<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Travel journal export</title>
  <style>
    :root { font-family: system-ui, sans-serif; line-height: 1.5; color: #1a1a1a; background: #fafafa; }
    body { margin: 0 auto; max-width: 42rem; padding: 1.25rem; }
    h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
    h2 { font-size: 1.1rem; margin: 1.5rem 0 0.35rem; }
    .meta { color: #555; font-size: 0.9rem; margin-bottom: 1rem; }
    article { margin: 0.75rem 0; padding: 0.75rem 0; border-bottom: 1px solid #ddd; }
    .place { font-weight: 600; }
    .text { white-space: pre-wrap; }
    .err { color: #8b0000; }
    img { max-width: 100%; height: auto; border-radius: 4px; }
    .caption { font-size: 0.85rem; color: #444; margin-top: 0.25rem; }
  </style>
</head>
<body>
  <div id="app" class="meta">Loading journal…</div>
  <script>
    (function () {
      var app = document.getElementById('app');
      function esc(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }
      function mediaById(list) {
        var map = {};
        (list || []).forEach(function (m) { map[m.id] = m; });
        return map;
      }
      function render(journal) {
        var html = '<h1>' + esc(journal.title || 'Untitled trip') + '</h1>';
        html += '<p class="meta">Trip ' + esc(journal.trip_id) + ' · revision ' + esc(String(journal.revision)) + '</p>';
        var legs = (journal.legs || []).slice().sort(function (a, b) { return a.order - b.order; });
        var media = mediaById(journal.media);
        legs.forEach(function (leg) {
          html += '<h2>' + esc(leg.destination) + '</h2>';
          var moments = (journal.moments || []).filter(function (m) {
            return m.leg_id === leg.id && m.lifecycle === 'live';
          }).sort(function (a, b) { return a.display_order - b.display_order; });
          moments.forEach(function (mom) {
            html += '<article><div class="meta">' + esc(mom.local_date) + (mom.local_time ? ' ' + esc(mom.local_time) : '') + '</div>';
            if (mom.place && mom.place.name) html += '<div class="place">' + esc(mom.place.name) + '</div>';
            if (mom.text) html += '<div class="text">' + esc(mom.text) + '</div>';
            (mom.media_ids || []).forEach(function (id) {
              var m = media[id];
              if (!m) return;
              var src = '../media/' + esc(id) + '/display.jpg';
              html += '<figure><img src="' + src + '" alt="" width="' + esc(String(m.width)) + '" height="' + esc(String(m.height)) + '" loading="lazy" />';
              if (m.caption) html += '<figcaption class="caption">' + esc(m.caption) + '</figcaption>';
              if (m.transcript) html += '<p class="caption">Transcript: ' + esc(m.transcript) + '</p>';
              html += '</figure>';
            });
            html += '</article>';
          });
        });
        app.innerHTML = html;
      }
      fetch('../data/journal.json')
        .then(function (r) { if (!r.ok) throw new Error('journal.json missing'); return r.json(); })
        .then(render)
        .catch(function (e) {
          app.innerHTML = '<p class="err">Could not load export: ' + esc(e.message) + '</p>';
        });
    })();
  </script>
</body>
</html>
