<!DOCTYPE html>
<html lang="en" data-hub="life">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-Tq7W4GE87P+mJ92E+MutlGYw8vQi2BvoeZBdOXHStj4='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://api.adam-russell.com https://tiles.openfreemap.org https://*.r2.cloudflarestorage.com; worker-src 'self' blob:; frame-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Travel · Life Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700;125,800&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
    />
    <script>
      (function () {
        var key = 'life-hub-spa-redirect';
        var redirect = sessionStorage.getItem(key);
        if (!redirect) return;
        if (redirect === '/travel' || redirect.indexOf('/travel/') === 0) {
          sessionStorage.removeItem(key);
          history.replaceState(null, '', redirect);
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
