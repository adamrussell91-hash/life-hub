<!DOCTYPE html>
<html lang="en" data-hub="teaching">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Teaching Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
    />
    <link rel="stylesheet" href="/src/design/tokens.css" />
    <link rel="stylesheet" href="/src/styles/app.css" />
    <script>
      (function () {
        var key = 'life-hub-spa-redirect';
        var redirect = sessionStorage.getItem(key);
        if (!redirect) return;
        if (redirect === '/teaching' || redirect.indexOf('/teaching/') === 0) {
          sessionStorage.removeItem(key);
          history.replaceState(null, '', redirect);
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
