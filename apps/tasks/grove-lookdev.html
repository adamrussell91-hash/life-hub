<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Grove Year Look</title>
  <style>
    :root { --ink: #1d2b24; --muted: #5f6f66; --paper: #fffdf8; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #a6dbf2 0%, #d4eef2 55%, #f5f2e2 100%);
      overflow: hidden;
    }
    #stage { position: fixed; inset: 0; touch-action: none; }
    #stage canvas { display: block; width: 100%; height: 100%; }
    .hud { position: fixed; left: 16px; right: 16px; top: 16px; display: flex; gap: 8px; align-items: center; justify-content: space-between; pointer-events: none; }
    .chip, .back {
      pointer-events: auto;
      background: rgba(255, 253, 248, 0.92);
      border-radius: 999px;
      box-shadow: 0 2px 10px rgba(30, 50, 40, 0.12);
      padding: 10px 16px;
      font-size: 15px;
      line-height: 1.25;
    }
    .chip strong { font-weight: 600; }
    .chip span { color: var(--muted); }
    .back { border: 0; font: inherit; font-size: 15px; font-weight: 600; color: var(--ink); min-height: 44px; cursor: pointer; }
    .back[hidden] { display: none; }
    #status { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); }
    #status:empty { display: none; }
  </style>
</head>
<body>
  <div id="stage" aria-label="Grove year landscape"></div>
  <div class="hud">
    <p class="chip" id="title" role="status" aria-live="polite"><strong>2026</strong> <span>· growing the forest…</span></p>
    <button class="back" id="back" type="button" hidden>Year</button>
  </div>
  <p class="chip" id="status"></p>
  <script type="module" src="/src/grove-lookdev/main.ts"></script>
</body>
</html>
