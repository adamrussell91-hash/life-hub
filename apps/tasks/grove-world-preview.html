<!doctype html>
<html lang="en" data-hub="tasks">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Grove annual geography preview</title></head>
<body><main class="world-preview">
  <header><p class="world-preview__eyebrow">Grove · Phase 1</p><h1>Annual landscape</h1><p>Geography prototype · basin surfaces are proposed, pending drainage analysis.</p></header>
  <div class="world-preview__controls">
    <button id="previous" class="btn btn--secondary" aria-label="Previous year">‹</button>
    <label for="year">Year <input id="year" type="number" min="1900" max="9999" step="1" value="2026"></label>
    <button id="next" class="btn btn--secondary" aria-label="Next year">›</button>
  </div>
  <p id="status" role="status" aria-live="polite">Preparing the annual world…</p>
  <div id="landscape" class="world-preview__stage" aria-label="Annual terrain, proposed basin surfaces and meadow reserves"></div>
  <p class="world-preview__legend">Gentle meadows · hills and valleys · two basin shapes · one island. Relief is enlarged ×3 for inspection. Drag to turn, pinch or scroll to zoom.</p>
  <p id="metrics"></p>
</main><script type="module" src="/src/grove-world-preview/main.ts"></script></body>
</html>
