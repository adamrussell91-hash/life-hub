<!DOCTYPE html>
<html lang="en" data-hub="tasks">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-YTxERsX/olq6cIQyRfVysmT2lX9jaILKYE3YGwyvvjw=' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://api.adam-russell.com blob:; worker-src 'self' blob:; frame-src 'self' https://maps.google.com https://www.google.com; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tasks Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var key = 'life-hub-spa-redirect';
        var redirect = sessionStorage.getItem(key);
        if (!redirect) return;
        if (redirect === '/tasks' || redirect.indexOf('/tasks/') === 0) {
          sessionStorage.removeItem(key);
          history.replaceState(null, '', redirect);
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
