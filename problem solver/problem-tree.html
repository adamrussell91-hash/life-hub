<div id="problem-tree-editor">
<style>
#problem-tree-editor{--pt-ink:light-dark(#202c33,#edf1f3);--pt-border:light-dark(#dfe3e2,#424b51);--pt-red:#b82e32;--pt-blue:#254f77;--pt-gold:#edbc2d;color:var(--pt-ink);font-family:system-ui,-apple-system,sans-serif;max-width:540px;margin:auto}
#problem-tree-editor *{box-sizing:border-box}
#problem-tree-editor .pt-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:12px 0 18px;border-bottom:1px solid var(--pt-border)}
#problem-tree-editor h2{font-family:Georgia,serif;font-size:30px;font-weight:400;letter-spacing:-.035em;margin:0}
#problem-tree-editor .pt-tools{display:flex;gap:14px;flex-wrap:wrap}
#problem-tree-editor button{font:400 12px system-ui;min-height:44px;padding:8px 0;background:transparent;color:var(--pt-ink);border:0;border-bottom:1px solid var(--pt-border);border-radius:0}
#problem-tree-editor button:disabled{opacity:.35}
#problem-tree-editor .pt-status{font:400 12px/1.5 system-ui;opacity:.65;padding:14px 0 26px}
#problem-tree-editor .pt-tree{width:min(100%,420px);margin:auto;padding-bottom:24px}
#problem-tree-editor .pt-layer{opacity:1;transform:none;visibility:visible;transition:opacity 400ms ease,transform 800ms cubic-bezier(.22,1,.36,1),visibility 0s}
#problem-tree-editor .pt-layer.pt-hidden{opacity:0;transform:translateY(22px) scale(.97);visibility:hidden;pointer-events:none;transition:opacity 300ms ease,transform 800ms cubic-bezier(.22,1,.36,1),visibility 0s 800ms}
#problem-tree-editor .pt-crown{position:relative;isolation:isolate;min-height:276px;padding:76px 0 78px;margin-bottom:34px}
#problem-tree-editor .pt-crown:before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--pt-blue);z-index:-1}
#problem-tree-editor .pt-box{position:relative;width:64%;margin:auto;border-radius:14px;text-align:center;padding:20px 18px}
#problem-tree-editor .pt-effects{background:var(--pt-gold);color:#433719}
#problem-tree-editor .pt-problem{background:var(--pt-red);color:#fff;min-height:110px;display:flex;flex-direction:column;justify-content:center}
#problem-tree-editor .pt-causes{background:var(--pt-blue);color:#fff;min-height:125px}
#problem-tree-editor label{display:block;font:700 20px/1.4 system-ui;letter-spacing:0;margin-bottom:10px;color:inherit}
#problem-tree-editor textarea{display:block;width:100%;margin:0;padding:0;height:46px;min-height:46px;resize:none;overflow:hidden;border:0;border-radius:0;background:transparent;color:inherit;text-align:center;font:400 16px/1.4 system-ui;transition:height 260ms ease}
#problem-tree-editor textarea::placeholder{color:inherit;opacity:.7}
#problem-tree-editor textarea:focus-visible,#problem-tree-editor button:focus-visible{outline:2px solid light-dark(#324e6b,#b0d0ec);outline-offset:4px}
#problem-tree-editor .pt-arrow{position:relative;width:40px;height:64px;margin:6px auto;transform-origin:bottom;transition:transform 700ms cubic-bezier(.22,1,.36,1),opacity 400ms ease}
#problem-tree-editor .pt-arrow:before{content:"";position:absolute;inset:0;background:var(--pt-red);clip-path:polygon(50% 0,100% 30%,66% 30%,66% 100%,34% 100%,34% 30%,0 30%)}
#problem-tree-editor .pt-effects-arrow{position:absolute;height:83px;bottom:-28px;left:50%;margin:0 0 0 -20px}
#problem-tree-editor .pt-hidden .pt-arrow{transform:scaleY(0);opacity:0}
@media(max-width:400px){#problem-tree-editor .pt-tools{gap:12px}#problem-tree-editor .pt-box{width:72%;padding:18px 14px}#problem-tree-editor .pt-crown{padding-top:55px;padding-bottom:65px;min-height:248px}#problem-tree-editor .pt-effects-arrow{height:75px}#problem-tree-editor .pt-arrow{width:36px}#problem-tree-editor .pt-effects-arrow{margin-left:-18px}}
@media(prefers-reduced-motion:reduce){#problem-tree-editor *{transition:none!important;animation:none!important}}
</style>
<div class="pt-top"><h2>Problem tree</h2><div class="pt-tools"><button class="cursor-interaction" type="button" data-action="back">Back</button><button class="cursor-interaction" type="button" data-action="replay">Replay</button><button class="cursor-interaction" type="button" data-action="next" disabled>Complete</button></div></div>
<div class="pt-status" role="status" aria-live="polite">Select any shape to edit. Replay builds from the problem.</div>
<section class="pt-tree" aria-label="Editable problem tree. Causes lead upwards to the problem, which leads to effects.">
<div class="pt-layer" data-stage="3"><div class="pt-crown"><div class="pt-box pt-effects"><label for="pt-effects-answer">Effects</label><textarea id="pt-effects-answer" rows="2" placeholder="Who, what, where,&#10;when, why"></textarea></div><div class="pt-arrow pt-effects-arrow" role="img" aria-label="The problem leads to effects"></div></div></div>
<div class="pt-layer" data-stage="1"><div class="pt-box pt-problem"><label for="pt-problem-answer">The problem</label><textarea id="pt-problem-answer" rows="2" placeholder="State the problem"></textarea></div></div>
<div class="pt-layer" data-stage="2"><div class="pt-arrow" role="img" aria-label="Causes lead to the problem"></div><div class="pt-box pt-causes"><label for="pt-causes-answer">Causes</label><textarea id="pt-causes-answer" rows="2" placeholder="Who, what, where,&#10;when, why, how"></textarea></div></div>
</section>
</div>
<script>
(()=>{
const root=document.getElementById('problem-tree-editor');if(!root||root.dataset.ready)return;root.dataset.ready='true';
const layers=Array.from(root.querySelectorAll('[data-stage]')),fields=Array.from(root.querySelectorAll('textarea'));
const next=root.querySelector('[data-action="next"]'),back=root.querySelector('[data-action="back"]'),replay=root.querySelector('[data-action="replay"]'),status=root.querySelector('.pt-status');
let visible=3,busy=false;
function draw(n){layers.forEach(layer=>{const hidden=Number(layer.dataset.stage)>n;layer.classList.toggle('pt-hidden',hidden);layer.inert=hidden;layer.setAttribute('aria-hidden',String(hidden))});next.disabled=busy||n===3;back.disabled=busy||n<=1;replay.disabled=busy;next.textContent=n===3?'Complete':n===1?'Add causes':'Add effects';status.textContent=n===3?'Select any shape to edit. Replay builds from the problem.':n===2?'Add the causes below, then reveal the effects.':n===1?'Start by defining the problem.':'Building the problem tree.'}
function fit(field){const old=field.getBoundingClientRect().height;field.style.transition='none';field.style.height='auto';const height=Math.max(46,field.scrollHeight);field.style.height=old+'px';void field.offsetHeight;field.style.transition='';field.style.height=height+'px'}
fields.forEach(field=>field.addEventListener('input',()=>fit(field)));
next.addEventListener('click',()=>{if(busy||visible>=3)return;draw(++visible)});
back.addEventListener('click',()=>{if(busy||visible<=1)return;draw(--visible)});
replay.addEventListener('click',async()=>{if(busy)return;busy=true;const target=visible;draw(0);const reduced=typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches;const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));await wait(reduced?0:160);for(let n=1;n<=target;n++){draw(n);await wait(reduced?0:680)}busy=false;draw(visible)});
if(typeof ResizeObserver==='function'){let width=0;new ResizeObserver(entries=>{const w=entries[0].contentRect.width;if(Math.abs(w-width)>1){width=w;fields.forEach(fit)}}).observe(root)}
draw(visible);
})();
</script>
