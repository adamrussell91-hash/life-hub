<div id="gap-analysis-original-layout">
<style>
#gap-analysis-original-layout{--ga-ink:light-dark(#202c33,#edf1f3);--ga-border:light-dark(#dfe3e2,#424b51);--ga-panel:light-dark(#fff,#20252a);color:var(--ga-ink);font-family:system-ui,-apple-system,sans-serif;max-width:600px;margin:auto}
#gap-analysis-original-layout *{box-sizing:border-box}
#gap-analysis-original-layout .ga-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:12px 0 18px;border-bottom:1px solid var(--ga-border)}
#gap-analysis-original-layout h2{font:400 30px Georgia,serif;letter-spacing:-.035em;margin:0}
#gap-analysis-original-layout .ga-tools{display:flex;gap:14px;flex-wrap:wrap}
#gap-analysis-original-layout .ga-tools button{font:400 12px system-ui;min-height:44px;padding:8px 0;background:transparent;color:var(--ga-ink);border:0;border-bottom:1px solid var(--ga-border);border-radius:0}
#gap-analysis-original-layout button:disabled{opacity:.35}
#gap-analysis-original-layout .ga-status{font:400 12px/1.5 system-ui;opacity:.65;padding:14px 0 24px}
#gap-analysis-original-layout .ga-diagram{position:relative;width:100%;aspect-ratio:6/5;margin:0 auto 24px}
#gap-analysis-original-layout .ga-shapes{display:block;width:100%;height:100%;overflow:visible}
#gap-analysis-original-layout .ga-layer{opacity:1;transform:none;transition:opacity 400ms ease,transform 850ms cubic-bezier(.22,1,.36,1)}
#gap-analysis-original-layout .ga-left{transform-origin:270px 250px}
#gap-analysis-original-layout .ga-right{transform-origin:330px 250px}
#gap-analysis-original-layout .ga-bridge{transform-origin:300px 250px}
#gap-analysis-original-layout .ga-left.ga-hidden{opacity:0;transform:translateX(-18px)}
#gap-analysis-original-layout .ga-right.ga-hidden{opacity:0;transform:translateX(18px)}
#gap-analysis-original-layout .ga-bridge.ga-hidden{opacity:0;transform:scaleX(.05)}
#gap-analysis-original-layout .ga-node{position:absolute;transform:translate(-50%,-50%);width:24%;padding:5px 0;min-height:44px;border:0;background:transparent;text-align:center;color:#fff;transition:opacity 400ms ease;overflow-wrap:normal}
#gap-analysis-original-layout .ga-node.ga-hidden{opacity:0;visibility:hidden;pointer-events:none}
#gap-analysis-original-layout .ga-node strong,#gap-analysis-original-layout .ga-node small{display:none}
#gap-analysis-original-layout .ga-shapes text{fill:#fff;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;text-anchor:middle;dominant-baseline:middle;letter-spacing:0}
#gap-analysis-original-layout .ga-node small:empty{display:none}
#gap-analysis-original-layout .ga-current{left:15.83%;top:50%;width:25%}
#gap-analysis-original-layout .ga-known{left:36.7%;top:29%}
#gap-analysis-original-layout .ga-done{left:36.7%;top:73%}
#gap-analysis-original-layout .ga-objective{left:84.17%;top:50%;width:25%}
#gap-analysis-original-layout .ga-mustknow{left:63.3%;top:29%}
#gap-analysis-original-layout .ga-mustdo{left:63.3%;top:73%}
#gap-analysis-original-layout .ga-actions{left:50%;top:50%;width:30%;color:#433719}
#gap-analysis-original-layout .ga-editor{border-top:1px solid var(--ga-border);padding:20px 0 0}
#gap-analysis-original-layout label{display:block;font:700 20px/1.4 system-ui;margin-bottom:10px}
#gap-analysis-original-layout textarea{display:block;width:100%;min-height:100px;padding:14px 16px;border:1px solid var(--ga-border);border-radius:8px;background:var(--ga-panel);color:var(--ga-ink);font:400 16px/1.5 system-ui;resize:vertical}
#gap-analysis-original-layout .ga-node:focus-visible,#gap-analysis-original-layout .ga-tools button:focus-visible,#gap-analysis-original-layout textarea:focus-visible{outline:2px solid light-dark(#324e6b,#b0d0ec);outline-offset:4px}
@media(max-width:460px){#gap-analysis-original-layout .ga-node small{display:none}#gap-analysis-original-layout .ga-node{width:25%}#gap-analysis-original-layout .ga-actions{width:30%}#gap-analysis-original-layout .ga-tools{gap:12px}}
@media(prefers-reduced-motion:reduce){#gap-analysis-original-layout *{transition:none!important;animation:none!important}}
</style>
<div class="ga-top"><h2>Gap analysis</h2><div class="ga-tools"><button class="cursor-interaction" type="button" data-action="back">Back</button><button class="cursor-interaction" type="button" data-action="replay">Replay</button><button class="cursor-interaction" type="button" data-action="next" disabled>Complete</button></div></div>
<div class="ga-status" role="status" aria-live="polite">Select a shape to add or edit your text.</div>
<div class="ga-diagram" aria-label="Gap analysis diagram. Current state, known and done on the left. Objective, must know and must do on the right. Actions connect both sides.">
<svg class="ga-shapes" viewBox="0 0 600 500" aria-hidden="true">
<g class="ga-layer ga-left" data-stage="1" fill="#b82e32"><path d="M270 5 C105 5 105 495 270 495 Z"/><circle cx="95" cy="250" r="90"/><text x="95" y="250">Current state</text><text x="214" y="145">Known</text><text x="214" y="365">Done</text></g>
<g class="ga-layer ga-right" data-stage="2" fill="#254f77"><path d="M330 5 C495 5 495 495 330 495 Z"/><circle cx="505" cy="250" r="90"/><text x="505" y="250">Objective</text><text x="386" y="145">Must know</text><text x="386" y="365">Must do</text></g>
<g class="ga-layer ga-bridge" data-stage="3" fill="#edbc2d"><path d="M175 195 H425 Q395 250 425 305 H175 Q205 250 175 195 Z"/><text x="300" y="250" style="font-size:22px">Actions</text></g>
</svg>
<button type="button" class="ga-node ga-current cursor-interaction" data-field="current" data-stage="1" aria-pressed="true"><strong>Current state</strong><small></small></button>
<button type="button" class="ga-node ga-known cursor-interaction" data-field="known" data-stage="1" aria-pressed="false"><strong>Known</strong><small></small></button>
<button type="button" class="ga-node ga-done cursor-interaction" data-field="done" data-stage="1" aria-pressed="false"><strong>Done</strong><small></small></button>
<button type="button" class="ga-node ga-objective cursor-interaction" data-field="objective" data-stage="2" aria-pressed="false"><strong>Objective</strong><small></small></button>
<button type="button" class="ga-node ga-mustknow cursor-interaction" data-field="mustknow" data-stage="2" aria-pressed="false"><strong>Must know</strong><small></small></button>
<button type="button" class="ga-node ga-mustdo cursor-interaction" data-field="mustdo" data-stage="2" aria-pressed="false"><strong>Must do</strong><small></small></button>
<button type="button" class="ga-node ga-actions cursor-interaction" data-field="actions" data-stage="3" aria-pressed="false"><strong>Actions</strong><small></small></button>
</div>
<div class="ga-editor"><label for="ga-answer">Current state</label><textarea id="ga-answer" placeholder="Describe the current situation." rows="3"></textarea></div>
</div>
<script>
(()=>{
const root=document.getElementById('gap-analysis-original-layout');if(!root||root.dataset.ready)return;root.dataset.ready='true';
const buttons=Array.from(root.querySelectorAll('[data-field]')),parts=Array.from(root.querySelectorAll('[data-stage]'));
const next=root.querySelector('[data-action="next"]'),back=root.querySelector('[data-action="back"]'),replay=root.querySelector('[data-action="replay"]'),status=root.querySelector('.ga-status'),editor=root.querySelector('textarea'),label=root.querySelector('label');
const values={current:'',known:'',done:'',objective:'',mustknow:'',mustdo:'',actions:''};const prompts={current:'Describe the current situation.',known:'What do you already know?',done:'What have you already done?',objective:'Describe the desired outcome.',mustknow:'What do you need to know?',mustdo:'What needs to be done?',actions:'What specific actions will close the gap?'};
let selected='current',visible=3,busy=false;
function select(key){selected=key;buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.field===key)));const b=buttons.find(b=>b.dataset.field===key);label.textContent=b.querySelector('strong').textContent;editor.value=values[key];editor.placeholder=prompts[key]}
buttons.forEach(b=>b.addEventListener('click',()=>select(b.dataset.field)));
editor.addEventListener('input',()=>{values[selected]=editor.value;const b=buttons.find(b=>b.dataset.field===selected);b.querySelector('small').textContent=editor.value;b.setAttribute('aria-label',b.querySelector('strong').textContent+(editor.value?': '+editor.value:''))});
function draw(n){parts.forEach(p=>{const hidden=Number(p.dataset.stage)>n;p.classList.toggle('ga-hidden',hidden);p.setAttribute('aria-hidden',String(hidden));if(p.tagName==='BUTTON')p.inert=hidden});next.disabled=busy||n===3;back.disabled=busy||n<=1;replay.disabled=busy;next.textContent=n===3?'Complete':n===1?'Add objective':'Add actions';status.textContent=busy?'Building the gap analysis.':'Select a shape to add or edit your text.';if(!busy&&Number(buttons.find(b=>b.dataset.field===selected).dataset.stage)>n)select('current')}
next.addEventListener('click',()=>{if(busy||visible>=3)return;draw(++visible)});
back.addEventListener('click',()=>{if(busy||visible<=1)return;draw(--visible)});
replay.addEventListener('click',async()=>{if(busy)return;busy=true;const target=visible;draw(0);const reduced=typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches;const wait=ms=>new Promise(r=>setTimeout(r,ms));await wait(reduced?0:160);for(let n=1;n<=target;n++){draw(n);await wait(reduced?0:700)}busy=false;draw(visible)});
buttons.forEach(b=>b.setAttribute('aria-label',b.querySelector('strong').textContent));
function resizeLabels(){const width=root.querySelector('.ga-diagram').getBoundingClientRect().width;if(width>0){root.querySelectorAll('.ga-shapes text').forEach(t=>t.style.fontSize=Math.max(t.textContent==='Actions'?22:20,12*600/width)+'px')}}
if(typeof ResizeObserver==='function')new ResizeObserver(resizeLabels).observe(root);resizeLabels();
draw(visible);
})();
</script>
