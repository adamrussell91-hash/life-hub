<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-J2CwePlBa0trHupOoIBD9KtnnW/lYyR6MVs4NlVPww0='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://api.adam-russell.com; worker-src 'self' blob:; frame-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <title>Life Hub</title>
    <script>
      (function () {
        var path = location.pathname;
        var prefixes = ['/teaching', '/knowledge', '/tasks', '/professional', '/travel'];
        if (path === '/s' || path.indexOf('/s/') === 0) {
          var teachingPath = '/teaching' + path;
          sessionStorage.setItem(
            'life-hub-spa-redirect',
            teachingPath + location.search + location.hash
          );
          location.replace('/teaching/');
          return;
        }
        for (var i = 0; i < prefixes.length; i++) {
          var prefix = prefixes[i];
          if (path === prefix || path.indexOf(prefix + '/') === 0) {
            sessionStorage.setItem(
              'life-hub-spa-redirect',
              path + location.search + location.hash
            );
            location.replace(prefix + '/');
            return;
          }
        }
        location.replace('/' + location.search + location.hash);
      })();
    </script>
  </head>
  <body></body>
</html>
