name: Install Cartographers staged backgrounds

on:
  push:
    branches: [main]
    paths:
      - ".tmp/cartographers-assets-trigger"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download full resolution Cartographers artwork
        env:
          DAWN_URL: "https://oaisdmntpraustraliaeast.blob.core.windows.net/files/00000000-a5f8-81fa-a55c-5cfc79dd50c1/raw?se=2026-09-24T10%3A39%3A11Z&sp=r&sv=2026-02-06&sr=b&scid=c25a59ad-e568-4f81-b1ad-ff8b22fce0b5&skoid=697dc613-6c29-4a76-87a7-d1b783c6d43f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T07%3A24%3A37Z&ske=2026-09-25T07%3A24%3A37Z&sks=b&skv=2026-02-06&sig=h3g1KODkaQR26R9clBEQL8cl0aFKopdKuMfVAKubnMA%3D"
          SUNRISE_URL: "https://oaisdmntprnortheu.blob.core.windows.net/files/00000000-fd24-81f4-ba31-db7946b988ef/raw?se=2026-09-24T10%3A39%3A11Z&sp=r&sv=2026-02-06&sr=b&scid=c25a59ad-e568-4f81-b1ad-ff8b22fce0b5&skoid=697dc613-6c29-4a76-87a7-d1b783c6d43f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T08%3A56%3A17Z&ske=2026-09-25T08%3A56%3A17Z&sks=b&skv=2026-02-06&sig=htEBmmXjc6prPCGu/yNw2ekJ9mUoh6mWaInZgBg7c%2BU%3D"
          MIDDAY_URL: "https://oaisdmntprnortheu.blob.core.windows.net/files/00000000-cbac-81f4-a051-17c902e54b8f/raw?se=2026-09-24T10%3A39%3A12Z&sp=r&sv=2026-02-06&sr=b&scid=c25a59ad-e568-4f81-b1ad-ff8b22fce0b5&skoid=697dc613-6c29-4a76-87a7-d1b783c6d43f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T08%3A01%3A37Z&ske=2026-09-25T08%3A01%3A37Z&sks=b&skv=2026-02-06&sig=usBrHwn8VSffpVkE6QrZhIjxaa16YcvQXOMadVuEdOY%3D"
          GOLDEN_URL: "https://oaisdmntpraustraliaeast.blob.core.windows.net/files/00000000-3308-81fa-842d-e35eb1f6ec87/raw?se=2026-09-24T10%3A39%3A12Z&sp=r&sv=2026-02-06&sr=b&scid=c25a59ad-e568-4f81-b1ad-ff8b22fce0b5&skoid=697dc613-6c29-4a76-87a7-d1b783c6d43f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T07%3A31%3A57Z&ske=2026-09-25T07%3A31%3A57Z&sks=b&skv=2026-02-06&sig=E6oy0eygTasvrk9hLs9zIo9OQGeHdVAIFTaS7CcxZ7E%3D"
          TWILIGHT_URL: "https://oaisdmntprcacentral.blob.core.windows.net/files/00000000-78d0-820d-90c2-90551f79435c/raw?se=2026-09-24T10%3A39%3A11Z&sp=r&sv=2026-02-06&sr=b&scid=c25a59ad-e568-4f81-b1ad-ff8b22fce0b5&skoid=697dc613-6c29-4a76-87a7-d1b783c6d43f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T09%3A41%3A15Z&ske=2026-09-25T09%3A41%3A15Z&sks=b&skv=2026-02-06&sig=7eK%2BjF0Hfjv/3I8qDtl%2BPd1z6jMF8QImlVg4CckZMN0%3D"
          NIGHT_URL: "https://oaisdmntprnortheu.blob.core.windows.net/files/00000000-e01c-81f4-ad06-e5715d9f040f/raw?se=2026-09-24T10%3A39%3A11Z&sp=r&sv=2026-02-06&sr=b&scid=c25a59ad-e568-4f81-b1ad-ff8b22fce0b5&skoid=697dc613-6c29-4a76-87a7-d1b783c6d43f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T08%3A45%3A46Z&ske=2026-09-25T08%3A45%3A46Z&sks=b&skv=2026-02-06&sig=VVEf2hyTjUWkt/AAbGezb%2BAEwmOZqW%2BYw/S5gEmFnW8%3D"
        run: |
          set -euo pipefail
          DEST="apps/knowledge/public/assets/cognitive-protocols/backgrounds"
          mkdir -p "$DEST"
          curl --fail --location --retry 3 "$DAWN_URL" -o "$DEST/cartographers-background-dawn.png"
          curl --fail --location --retry 3 "$SUNRISE_URL" -o "$DEST/cartographers-background-sunrise.png"
          curl --fail --location --retry 3 "$MIDDAY_URL" -o "$DEST/cartographers-background-midday.png"
          curl --fail --location --retry 3 "$GOLDEN_URL" -o "$DEST/cartographers-background-golden-hour.png"
          curl --fail --location --retry 3 "$TWILIGHT_URL" -o "$DEST/cartographers-background-twilight.png"
          curl --fail --location --retry 3 "$NIGHT_URL" -o "$DEST/cartographers-background-night.png"
          file "$DEST"/cartographers-background-*.png
      - name: Commit artwork and remove transport files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/knowledge/public/assets/cognitive-protocols/backgrounds/cartographers-background-dawn.png
          git add apps/knowledge/public/assets/cognitive-protocols/backgrounds/cartographers-background-sunrise.png
          git add apps/knowledge/public/assets/cognitive-protocols/backgrounds/cartographers-background-midday.png
          git add apps/knowledge/public/assets/cognitive-protocols/backgrounds/cartographers-background-golden-hour.png
          git add apps/knowledge/public/assets/cognitive-protocols/backgrounds/cartographers-background-twilight.png
          git add apps/knowledge/public/assets/cognitive-protocols/backgrounds/cartographers-background-night.png
          git rm -f .tmp/cartographers-assets-trigger .github/workflows/install-cartographers-assets-once.yml
          git commit -m "Add staged Cartographers background art"
          git push origin HEAD:main
