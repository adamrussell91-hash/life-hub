name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys instead of cancelling a running one when another merge lands.
# A newer pending run still replaces an older pending one, and it deploys
# main as it stands, so every merge reaches the site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The PR gate already ran these on the merged code. Run the full suites
  # again on main beside the deploy, not in front of it, so a break still
  # turns main red without every merge waiting on the Grove tests.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Run tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
      - name: Install Tasks Hub dependencies
        run: npm ci --ignore-scripts --prefix apps/tasks
      - name: Tasks Hub vitest
        run: |
          set -o pipefail
          cd apps/tasks
          npx vitest run 2>&1 | tee ../../tasks-vitest-output.log
      - name: Install Teaching Hub dependencies
        run: npm ci --ignore-scripts --prefix apps/teaching
      - name: Teaching Hub vitest
        run: |
          set -o pipefail
          cd apps/teaching
          npx vitest run tests/unit 2>&1 | tee ../../teaching-vitest-output.log
      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pages-test-output
          path: |
            test-output.log
            tasks-vitest-output.log
            teaching-vitest-output.log
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: github-pages-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      # The Tasks Hub build resolves its own node_modules.
      - name: Install Tasks Hub dependencies
        run: npm ci --ignore-scripts --prefix apps/tasks
      - name: Transfer Grove release input
        if: ${{ hashFiles('apps/life/assets/grove/deployment/release-input.enc') != '' }}
        run: node scripts/transfer-grove-release.mjs
        env:
          GROVE_ASSET_KEY: ${{ secrets.GROVE_ASSET_KEY }}
          GROVE_RELEASE_INPUT_KEY: ${{ secrets.GROVE_RELEASE_INPUT_KEY }}
      - name: Save Grove deployment ciphertext
        if: ${{ success() && hashFiles('apps/life/assets/grove/deployment/release-input.enc') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: grove-deployment-ciphertext-${{ github.run_attempt }}
          path: apps/life/assets/grove/deployment/animals.enc
          if-no-files-found: error
          retention-days: 7
      - name: Install Grove project assets
        run: node scripts/install-grove-deployment-assets.mjs
        env:
          GROVE_ASSET_KEY: ${{ secrets.GROVE_ASSET_KEY }}
      - run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_PICKER_API_KEY: ${{ secrets.VITE_GOOGLE_PICKER_API_KEY }}
          VITE_GOOGLE_APP_ID: ${{ secrets.VITE_GOOGLE_APP_ID }}
      - uses: actions/configure-pages@v5
      # Name the artifact per attempt: a re-run keeps the earlier attempt's
      # artifact, and deploy-pages fails on two artifacts named github-pages.
      # Preserve the build's name as a job output for deploy-only retries.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
