name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: github-pages-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Run tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
      - name: Install Tasks Hub dependencies
        run: npm ci --ignore-scripts --prefix apps/tasks
      - name: Tasks Hub vitest
        run: |
          set -o pipefail
          cd apps/tasks
          npx vitest run 2>&1 | tee ../../tasks-vitest-output.log
      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pages-test-output
          path: |
            test-output.log
            tasks-vitest-output.log
          if-no-files-found: ignore
      - name: Install Grove project assets
        run: node scripts/install-grove-deployment-assets.mjs
        env:
          GROVE_ASSET_KEY: ${{ secrets.GROVE_ASSET_KEY }}
      - run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_PICKER_API_KEY: ${{ secrets.VITE_GOOGLE_PICKER_API_KEY }}
          VITE_GOOGLE_APP_ID: ${{ secrets.VITE_GOOGLE_APP_ID }}
      - uses: actions/configure-pages@v5
      # Name the artifact per attempt: a re-run keeps the earlier attempt's
      # artifact, and deploy-pages fails on two artifacts named github-pages.
      # Preserve the build's name as a job output for deploy-only retries.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
