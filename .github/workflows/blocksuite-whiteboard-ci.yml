name: Whiteboard integration validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'apps/teaching/**'
      - 'apps/tasks/**'
      - 'packages/whiteboard/**'
      - 'netlify/functions/whiteboards.mjs'
      - 'netlify/functions/_shared/whiteboard-blobs.mjs'
      - 'netlify/functions/lesson-publish.mjs'
      - 'tests/unit/whiteboard-documents.test.js'
      - '.github/workflows/blocksuite-whiteboard-ci.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh lockfiles
        run: |
          npm install --package-lock-only --ignore-scripts
          npm install --package-lock-only --ignore-scripts --prefix apps/teaching
          npm install --package-lock-only --ignore-scripts --prefix apps/tasks

      - name: Commit refreshed lockfiles
        run: |
          if git diff --quiet -- package-lock.json apps/teaching/package-lock.json apps/tasks/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json apps/teaching/package-lock.json apps/tasks/package-lock.json
          git commit -m "chore: refresh BlockSuite lockfiles"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install Teaching Hub dependencies
        run: npm ci --ignore-scripts --prefix apps/teaching

      - name: Install Tasks Hub dependencies
        run: npm ci --ignore-scripts --prefix apps/tasks

      - name: Teaching Hub whiteboard tests
        run: cd apps/teaching && npx vitest run tests/unit/whiteboard-block.test.ts

      - name: Tasks Hub whiteboard tests
        run: cd apps/tasks && npx vitest run tests/unit/whiteboard-block.test.ts

      - name: Root tests
        run: npm test

      - name: Production build
        run: npm run build
