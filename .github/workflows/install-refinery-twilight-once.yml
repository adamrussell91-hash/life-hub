name: Install Refinery twilight backgrounds

on:
  push:
    branches: [main]
    paths:
      - ".tmp/refinery-twilight-trigger"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download full-resolution Refinery twilight artwork
        env:
          BLUE_URL: "https://oaisdmntprwestus.blob.core.windows.net/files/00000000-4ec8-8230-8a79-5907a3cb10ae/raw?se=2026-09-24T09%3A28%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=cd6ec1ef-e065-4e8b-a169-d86d6f4af684&skoid=697dc613-6c29-4a76-87a7-d1b783c6d43f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T07%3A59%3A49Z&ske=2026-09-25T07%3A59%3A49Z&sks=b&skv=2026-02-06&sig=LVcbpyOkXBee5bt2qYtmu2kpg82HN5FBKgx23rIJf2g%3D"
          DUSK_URL: "https://oaisdmntprcentralindia.blob.core.windows.net/files/00000000-2c04-8208-a06c-c19ff421cdf1/raw?se=2026-09-24T09%3A28%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=cd6ec1ef-e065-4e8b-a169-d86d6f4af684&skoid=697dc613-6c29-4a76-87a7-d1b783c6d43f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T05%3A25%3A45Z&ske=2026-09-25T05%3A25%3A45Z&sks=b&skv=2026-02-06&sig=RcDhOqEHYwH6G2JDesY485TvnpgkaYao4XTjjK1L/ns%3D"
        run: |
          set -euo pipefail
          DEST="apps/knowledge/public/assets/cognitive-protocols/backgrounds"
          mkdir -p "$DEST"
          curl --fail --location --retry 3 "$BLUE_URL" -o "$DEST/refinery-background-blue-hour.png"
          curl --fail --location --retry 3 "$DUSK_URL" -o "$DEST/refinery-background-just-after-dusk.png"
          file "$DEST"/refinery-background-blue-hour.png "$DEST"/refinery-background-just-after-dusk.png
      - name: Commit artwork and remove transport files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/knowledge/public/assets/cognitive-protocols/backgrounds/refinery-background-blue-hour.png
          git add apps/knowledge/public/assets/cognitive-protocols/backgrounds/refinery-background-just-after-dusk.png
          git rm -f .tmp/refinery-twilight-trigger .github/workflows/install-refinery-twilight-once.yml
          git commit -m "Complete staged Refinery background art"
          git push origin HEAD:main
