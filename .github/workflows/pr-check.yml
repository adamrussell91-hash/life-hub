name: PR check

# Runs the mandatory pre-PR gate on every PR so the main ruleset can require
# it and auto-merge has something to wait for. No paths filter: a required
# check that skips leaves PRs waiting forever.
on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-pr-check:
    runs-on: ubuntu-latest
    steps:
      # Depth 2 keeps the PR merge commit's first parent, the base branch tip,
      # so the gate can run only the Tasks tests this PR reaches.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Reuse the npm download cache that the main deploy's test job saves,
      # so installs skip the registry when npm is slow.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci --ignore-scripts --prefer-offline
      - run: npm ci --ignore-scripts --prefer-offline --prefix apps/professional
      - run: npm run pre-pr-check
        env:
          PRE_PR_BASE: HEAD^1
