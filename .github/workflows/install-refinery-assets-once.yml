name: Install Refinery staged backgrounds

on:
  push:
    branches: [main]
    paths:
      - ".tmp/refinery-assets-trigger"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download full-resolution Refinery artwork
        env:
          SUNRISE_URL: "https://oaisdmntprbrazilsouth.blob.core.windows.net/files/00000000-5104-820e-af18-ee1483fb4377/raw?se=2026-09-24T09%3A08%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=bc1e2ff0-595b-4446-8dd4-ee191ebbabf6&skoid=697dc613-6c29-4a76-87a7-d1b783c6d43f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T07%3A07%3A50Z&ske=2026-09-25T07%3A07%3A50Z&sks=b&skv=2026-02-06&sig=UBxncgIXGsfNmtlzrtaqwKNvYi5NhSYOPEEKzEJldNw%3D"
          MORNING_URL: "https://oaisdmntprwestcentralus.blob.core.windows.net/files/00000000-e5d8-81fb-8285-425e8bc0d869/raw?se=2026-09-24T09%3A08%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=bc1e2ff0-595b-4446-8dd4-ee191ebbabf6&skoid=697dc613-6c29-4a76-87a7-d1b783c6d43f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T08%3A43%3A25Z&ske=2026-09-25T08%3A43%3A25Z&sks=b&skv=2026-02-06&sig=FTX65%2BwGOdGOLQe4TVHcMPFcgUWYmdg6%2B64J8EDxcxs%3D"
          GOLDEN_URL: "https://oaisdmntprukwest.blob.core.windows.net/files/00000000-2ff4-8243-8299-5b6988a30e18/raw?se=2026-09-24T09%3A08%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=bc1e2ff0-595b-4446-8dd4-ee191ebbabf6&skoid=697dc613-6c29-4a76-87a7-d1b783c6d43f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T08%3A39%3A43Z&ske=2026-09-25T08%3A39%3A43Z&sks=b&skv=2026-02-06&sig=nb1zeA/%2BviKw6snl1hl/gG4N9g6XzMPpbk3HiXsypec%3D"
        run: |
          set -euo pipefail
          DEST="apps/knowledge/public/assets/cognitive-protocols/backgrounds"
          mkdir -p "$DEST"
          curl --fail --location --retry 3 "$SUNRISE_URL" -o "$DEST/refinery-background-sunrise.png"
          curl --fail --location --retry 3 "$MORNING_URL" -o "$DEST/refinery-background-morning.png"
          curl --fail --location --retry 3 "$GOLDEN_URL" -o "$DEST/refinery-background-golden-hour.png"
          file "$DEST"/refinery-background-*.png
      - name: Commit artwork and remove transport files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/knowledge/public/assets/cognitive-protocols/backgrounds/refinery-background-sunrise.png
          git add apps/knowledge/public/assets/cognitive-protocols/backgrounds/refinery-background-morning.png
          git add apps/knowledge/public/assets/cognitive-protocols/backgrounds/refinery-background-golden-hour.png
          git rm -f .tmp/refinery-assets-trigger .github/workflows/install-refinery-assets-once.yml
          git commit -m "Add staged Refinery background art"
          git push origin HEAD:main
