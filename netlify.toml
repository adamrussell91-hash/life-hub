# Netlify hosts API Functions only. The site is on GitHub Pages.
# GITHUB_REPOSITORY is an owner/repo name, not a credential — omit it so a
# comment cannot fail the deploy the way secrets scanning did on 16 Aug.
[build]
  command = "true"
  publish = "netlify/public"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_KEYS = "GITHUB_BRANCH,GITHUB_REPOSITORY,RESEARCH_KERNEL_URL,R2_BUCKET"

[functions]
directory = "netlify/functions"
node_bundler = "esbuild"
external_node_modules = ["@netlify/blobs", "@aws-sdk/client-s3", "@aws-sdk/s3-request-presigner"]
included_files = [
  "config/chadwick-protocol.md",
  "config/hyaluronica-protocol.md",
  "config/penelope-protocol.md",
  "config/vera-protocol.md",
  "config/brisket-protocol.md",
  "config/sara-protocol.md",
  "config/hammond-protocol.md",
  "config/physique-target.yml",
  "config/knowledge/**",
  "central-node.md",
  "capabilities/**",
  "intuition/**"
]

[functions.knowledge-clementine-chat]
  timeout = 26

[functions.knowledge-tidy]
  timeout = 26

[functions.knowledge-podcast-path]
  timeout = 26

[functions.lesson-alchemist]
  timeout = 26

[functions.alchemy-lab]
  timeout = 26

# Chat turns start on /api/chat, run on the background function /api/chat-run
# (15 minute cap), and the browser polls /api/chat/events. Do not put a
# client abort on the turn — Netlify's 60s synchronous cap must not cut chat.
