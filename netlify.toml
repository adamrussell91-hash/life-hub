# Netlify hosts API Functions only. The site is on GitHub Pages.
# GITHUB_REPOSITORY is an owner/repo name, not a credential — omit it so a
# comment cannot fail the deploy the way secrets scanning did on 16 Aug.
[build]
  command = "true"
  publish = "netlify/public"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_KEYS = "GITHUB_BRANCH,GITHUB_REPOSITORY"

[functions]
directory = "netlify/functions"
included_files = [
  "config/chadwick-protocol.md",
  "config/hyaluronica-protocol.md",
  "config/penelope-protocol.md",
  "config/vera-protocol.md",
  "config/brisket-protocol.md",
  "config/sara-protocol.md",
  "config/hammond-protocol.md",
  "config/physique-target.yml",
  "central-node.md",
  "capabilities/**"
]

# Streaming chat uses Netlify's synchronous 60s execution cap (platform default, not configurable).
# Client timeout is js/core/chat-turn-limits.js — keep them aligned.
