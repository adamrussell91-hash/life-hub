<!-- Imperative: import { createContextualAiBar, createSelectAiAgent } from design-kit/js/hub-ai-bar.js -->
<form class="hub-ai-bar" data-hub-ai-bar>
  <div class="hub-ai-bar__tools">
    <button class="btn btn--ghost" type="button">Ask</button>
  </div>
  <div class="hub-ai-bar__field">
    <input class="hub-ai-bar__input" type="text" placeholder="Ask…" aria-label="Ask">
  </div>
  <button class="btn btn--primary" type="submit">Send</button>
</form>

<!-- Thread composer: full-width text box, chips + Attach/Send on the row below. -->
<form class="hub-ai-bar hub-ai-bar--thread" data-hub-ai-bar>
  <div class="hub-ai-bar__field">
    <textarea class="hub-ai-bar__input" rows="1" placeholder="Message…" aria-label="Message"></textarea>
  </div>
  <div class="hub-ai-bar__aside">
    <div class="chat-attach-list" hidden></div>
    <div class="hub-ai-bar__tools">
      <button class="btn btn--ghost" type="button">Attach</button>
      <button class="btn btn--primary" type="submit">Send</button>
    </div>
  </div>
</form>
