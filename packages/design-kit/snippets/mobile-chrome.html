     Desktop rail stays; this bar is CSS-visible only under 720px. -->

  <a href="/" aria-current="page">
    <span class="hub-mobile-nav__glyph" aria-hidden="true"><!-- icon --></span>
    Home
  </a>
  <a href="/chat">
    <span class="hub-mobile-nav__glyph" aria-hidden="true"><!-- icon --></span>

  </a>
  <a href="/calendar">

    <nav class="hub-more-sheet__nav" aria-label="Secondary destinations">

      <!-- secondary destinations -->
      <p class="hub-more-sheet__section">Hubs</p>
      <!-- other hubs from hub-switcher -->
    </nav>
  </div>
</dialog>
