<!-- Adaptive slider. Spring fill + thumb, digit pop, token bands.
     Load tokens.css → overlays.css → adaptive-slider.css (or chrome.css)
     then mountAdaptiveSliders(document) or createAdaptiveSlider().

     Optional:
       data-slider-label / data-slider-unit
       data-slider-min / data-slider-max / data-slider-step / data-slider-value
       data-slider-dots="6"
       data-slider-readonly
-->
<div
  class="hub-slider"
  data-adaptive-slider
  data-slider-label="Calories"
  data-slider-unit="kcal"
  data-slider-min="100"
  data-slider-max="800"
  data-slider-step="50"
  data-slider-value="300"
>
  <p class="hub-slider__label">Calories</p>
  <div class="hub-slider__value">
    <span class="hub-slider__digits" data-slider-digits>300</span>
    <span class="hub-slider__unit">kcal</span>
  </div>
  <div class="hub-slider__track">
    <div class="hub-slider__dots" aria-hidden="true"></div>
    <div class="hub-slider__fill" aria-hidden="true"></div>
    <input class="hub-slider__input" type="range" min="100" max="800" step="50" value="300" title="Calories">
    <div class="hub-slider__thumb" aria-hidden="true">
      <div class="hub-slider__knob"></div>
    </div>
  </div>
</div>
