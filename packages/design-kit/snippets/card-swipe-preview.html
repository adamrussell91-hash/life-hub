<!doctype html>
<html lang="en-AU" data-hub="life">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Card swipe · design kit</title>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../overlays.css">
  <link rel="stylesheet" href="../actions.css">
  <link rel="stylesheet" href="../card-swipe.css">
  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: var(--space-8);
      background: var(--cotton);
    }
  </style>
</head>
<body>
  <div id="mount"></div>
  <script type="module">
    import { createCardSwipe } from '../js/card-swipe.js';
    const mount = document.getElementById('mount');
    const swipe = createCardSwipe({
      root: document,
      label: 'Exercises'
    });
    mount.append(swipe.el);
    swipe.el.focus();
  </script>
</body>
</html>
