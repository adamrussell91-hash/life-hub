<!doctype html>
<html lang="en-AU">
<head>

<title>Lab lesson</title>
<style>
  /* Tokens copied from packages/design-kit/tokens.css */
  :root { --paper:#fbf8f2; --marine:#142b51; --navy:#17375e; --navy-2:#244f7c; --ink:#13233a; --muted:#6b7788; --line:rgba(23,55,94,.10); --lilac:#e8e0f1; --lilac-ink:#5d4e70; --success:#2f7a4f; --on-dark:rgba(255,255,255,.92); --on-dark-muted:rgba(255,255,255,.66);

  .board .inner { display:grid; gap:18px; align-content:start; font-size:var(--text-lg); min-width:0; }
  .board h2 { font-size:var(--text-xl); letter-spacing:-.015em; color:var(--navy); }
  .board .bar { font-size:var(--text-lg); grid-template-columns:9rem 1fr 3.5rem; } .board .bar i { height:30px; }
  .board .piece { font-size:1.4rem; padding:20px 24px; } .board .chip { font-size:var(--text-md); } .board .poem { font-size:1.45rem; }
  .board .bench .poem { font-size:var(--text-md); } .board .bench { font-size:var(--text-base); }
  .ctrl { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:10px; margin:28px -40px 0; padding:14px 40px; border-top:1px solid var(--line); font-size:var(--text-base); color:var(--muted); }
  .ctrl div { display:flex; gap:8px; flex-wrap:wrap; }
  .board .card.flat { padding:24px; min-height:0; grid-template-rows:none; } .board .card.flat h2 { font-size:var(--text-lg); color:var(--ink); }
  .rows { margin:0; } .row { display:grid; grid-template-columns:13rem 1fr; gap:16px; padding:14px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; } .row dt { color:var(--muted); } .row dd { margin:0; display:grid; gap:6px; min-width:0; } .row small { color:var(--muted); font-size:var(--text-sm); }
  table { width:100%; border-collapse:collapse; } th { text-align:left; font-size:var(--text-sm); color:var(--muted); font-weight:600; padding:8px; border-bottom:1px solid var(--line); }
  td { padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:top; } .held { color:var(--success); font-weight:600; }
  @media (max-width:640px) {
    .card { padding:18px 16px; } .board .card { padding:22px 16px 0; min-height:0; } .board .inner { font-size:var(--text-md); } .board h2 { font-size:1.5rem; }
    .board .bar { font-size:var(--text-base); grid-template-columns:6rem 1fr 2.5rem; } .board .piece, .board .poem { font-size:var(--text-md); }
    .ctrl { margin:20px -16px 0; padding:12px 16px; } .row { grid-template-columns:1fr; gap:2px; } .bar { grid-template-columns:4.5rem 1fr 2.5rem; }
    .bench { grid-template-columns:1fr; } .find, .axis { grid-template-columns:1fr 5rem 3rem; font-size:var(--text-base); }
    thead { display:none; } tr { display:grid; gap:2px; padding:10px 0; border-bottom:1px solid var(--line); } td { border:0; padding:0; }
  }
  @media (prefers-reduced-motion:reduce) { .bar i, .meter i, .find .track i { transition:none; } .reading circle { animation:none; opacity:1; } }
</style>

<script>
const CLASS = 17, OTHERS = 16;
const POEM = ['I meant to tell you — once', 'the kettle stopped, once the light', 'had settled on the bench,', 'but the words, I think,', 'were somewhere else. Perhaps', 'tomorrow. Would tomorrow do?'];
const LABS = {
  poem: {
    kind: 'design', name: 'Pairs design it', title: 'What makes this speaker sound hesitant?', question: 'What makes this speaker sound hesitant?',
    claim: 'The line breaks create the hesitation.', measure: 'How hesitant does the speaker sound?', notes: 'The breaks matter, but the hedges and the closing question do more. Push them to say the claim needs both.',
    control: 6.6, win: 1,
    trials: [
      { who: 'Pair 1', ops: { cut: [21, 22] }, pred: -1, mean: 4.8, f: 1 },
      { who: 'Pair 2', ops: { join: [26] }, pred: -1, mean: 6.2, f: 0 },
      { who: 'Pair 3', ops: { rep: { 28: 'Tomorrow', 29: 'would', 30: 'do.' } }, desc: 'Turned the question into a statement', pred: -1, mean: 4.3, f: 2 },

  storm: {

      { order: [2, 1, 0], t: ['The neighbour\'s roof shines black and slick. Beyond it there is only white.', 'A whistle starts under the door and climbs. Somewhere a gate slams, and slams, and slams.', 'Grit stings my face when I open the door. The wind leans on my chest until I step back.'] },
      { order: [0, 2, 1], t: ['The gum tree bends until its crown touches the shed. Hail bounces white across the lawn.', 'Hail hits the car like thrown gravel. Inside, the fridge clicks off and the house goes quiet.', 'The floor hums under my heels. Each gust pushes the cold a little further down my collar.'] }
    ],
    best: 'The gutters choke and spit. Something heavy rolls across the roof and the whole house hums like a struck drum.'
  },
  river: {
    name: 'You supply it', title: 'Does the passive voice shrink the blame?', question: 'Does the passive voice shrink the blame?',
    same: 'The events, their order and the length of the paragraph.', options: ['Active', 'Passive'], source: 'supplied', judge: 'rate',
    predictQ: 'Which version will make readers blame the company more?', judgeQ: 'How much is the company to blame?', notes: 'The passive removes the doer. Ask who is missing from each sentence.',
    otherPred: [11, 5], win: 1, otherSum: [63.2, 41], otherN: [8, 8], myVersion: 1,
    texts: ['For three years the company <v>dumped waste</v> upstream of the town. <v>Its managers ignored</v> two written warnings from the council. By spring, <v>scientists had declared</v> the river dead, and <v>the company had still not answered</v> a single letter.',
            'For three years <v>waste was dumped</v> upstream of the town. Two written warnings from the council <v>were ignored</v>. By spring, the river <v>had been declared</v> dead, and not a single letter <v>had been answered</v>.']
  }

const fresh = () => ({ pred: null, reason: '', locked: false, texts: null, v: 0, made: false, judged: [], rating: 5, rated: false, explain: '', handed: false,
  tokens: baseTokens(), sel: -1, ready: false, k: 0, ratings: [], notes: {}, qdone: false, tdone: false, rdone: false, feat: null, named: false });
const s = { lab: 'poem', view: 'board', step: 0, tick: 0, revealed: false, showBest: false, open: -1, notesOn: true, miss: '', me: null };
const L = () => LABS[s.lab];
const isDesign = () => L().kind === 'design';
const steps = () => isDesign() ? ['Question', 'Design', 'Predict', 'Test', 'Result', 'Name it', 'Explain'] : L().source === 'students' ? ['Question', 'Predict', 'Make', 'Test', 'Result', 'Explain'] : ['Question', 'Predict', 'Test', 'Result', 'Explain'];
const stepName = () => steps()[s.step] || 'After class';

/* ---------- The poem as apparatus ---------- */
function baseTokens() {
  const t = [];
  POEM.forEach((line, li) => { const ws = line.split(' '); ws.forEach((w, wi) => { const br = wi === ws.length - 1 && li < POEM.length - 1; t.push({ w, line: li + 1, br, nbr: br, cut: false, rep: null }); }); });
  return t;
}
function applyOps(ops) {
  const t = baseTokens();
  (ops.cut || []).forEach((i) => t[i].cut = true); (ops.join || []).forEach((i) => t[i].nbr = false); (ops.brk || []).forEach((i) => t[i].nbr = true);
  Object.entries(ops.rep || {}).forEach(([i, w]) => t[i].rep = w);
  return t;
}
const changed = (x) => x.cut || x.rep !== null || x.nbr !== x.br;
function describe(t) {
  const out = []; let i = 0;
  while (i < t.length) {
    if (!changed(t[i])) { i++; continue; }
    let j = i; while (j + 1 < t.length && changed(t[j + 1])) j++;
    const run = t.slice(i, j + 1), cuts = run.filter((x) => x.cut), reps = run.filter((x) => x.rep !== null && !x.cut);
    if (cuts.length) out.push(`cut "${cuts.map((x) => x.w).join(' ')}"`);
    if (reps.length) out.push(`changed "${reps.map((x) => x.w).join(' ')}" to "${reps.map((x) => x.rep).join(' ')}"`);
    run.filter((x) => x.br && !x.nbr).forEach((x) => out.push(`joined lines ${x.line} and ${x.line + 1}`));
    run.filter((x) => !x.br && x.nbr).forEach((x) => out.push(`broke line ${x.line} after "${x.rep ?? x.w}"`));
    i = j + 1;
  }
  return out;
}
function poemHTML(t, o = {}) {
  const lines = [[]];
  t.forEach((x, i) => {
    if (x.cut && !o.marks) { if (x.nbr) lines.push([]); return; }

  if (isDesign()) return dStudent();
  const l = L(), m = s.me, n = stepName();
  if (n === 'Question') return `<h2>${l.question}</h2>${facts()}<p class="muted">${l.source === 'students' ? 'You will write the same moment once for each. Readers choose the one that feels most real.' : 'You will read one version of a short news paragraph and rate it.'}</p>${WAIT}`;
  if (n === 'Predict') return m.locked ? `<h2>Locked in: ${low(l.options[m.pred])}</h2>${m.reason ? `<p>Because ${esc(m.reason)}</p>` : ''}${WAIT}`
    : `<h2>${l.predictQ}</h2><div class="chips">${l.options.map((o, i) => `<button class="chip ${m.pred === i ? 'on' : ''}" data-act="pred" data-i="${i}">${o}</button>`).join('')}</div>
       <textarea rows="2" data-bind="reason" placeholder="Because…">${esc(m.reason)}</textarea><button class="btn" data-act="lock" ${m.pred === null ? 'disabled' : ''}>Lock it in</button>`;
  if (n === 'Make') { if (!m.texts) m.texts = l.mine.slice(); const last = m.v === l.options.length - 1;
    return m.made ? `<h2>Three versions written</h2>${WAIT}`
    : `<h2>The storm hits the house. Lean on <span class="var">${low(l.options[m.v])}</span>.</h2><textarea class="prose" rows="5" data-bind="text">${esc(m.texts[m.v])}</textarea>
       <p class="muted">Version ${m.v + 1} of ${l.options.length}. Two or three sentences.</p><button class="btn" data-act="made">${last ? 'Finish' : `Next: ${low(l.options[m.v + 1])}`}</button>`; }
  if (n === 'Test' && l.judge === 'pick') { const k = m.judged.length; if (k >= 6) return `<h2>Six writers read</h2>${WAIT}`; const w = l.writers[k];
    return `<h2>${l.judgeQ}</h2>${w.order.map((sense, pos) => `<button class="piece" data-act="judge" data-i="${sense}"><small>${'ABC'[pos]}</small>${esc(w.t[sense])}</button>`).join('')}<p class="muted">Writer ${k + 1} of 6. Tap one.</p>`; }
  if (n === 'Test') return m.rated ? `<h2>Rating sent</h2>${WAIT}`
    : `<h2>${l.judgeQ}</h2><div class="piece">${esc(plain(l.texts[l.myVersion]))}</div><div class="scale"><input type="range" min="0" max="10" step="1" value="${m.rating}" data-bind="rating"><div class="ends"><span>A little</span><span>Completely</span></div></div><button class="btn" data-act="rate">Send</button>`;
  if (n === 'Result') { const v = verdict();
    return `<h2>${headline(true)}</h2>${bars(v.t, v.win ? v.top : -1, l.judge === 'rate' ? 10 : 0)}<p class="muted">${l.judge === 'pick' ? `${CLASS * 6} choices from ${CLASS} readers.` : `Average blame out of 10, from ${CLASS} readers.`}</p>
      ${l.judge === 'pick' ? `<p><strong>Your writing:</strong> ${Math.max(...l.mineChosen)} of your 6 readers chose your ${low(l.options[l.mineChosen.indexOf(Math.max(...l.mineChosen))])} version.</p>` : `<p><strong>You read</strong> the ${low(l.options[l.myVersion])} version and gave it ${m.rating}.</p>`}`; }
  if (n === 'Explain') return m.handed ? `<h2>Handed in</h2><p>${esc(m.explain) || '<span class="muted">No explanation written.</span>'}</p>`
    : `<h2>${whyQ()}</h2><p class="muted">${evidence()}</p><textarea rows="5" data-bind="explain" placeholder="${l.judge === 'pick' ? 'It felt most real because…' : 'Readers blamed the company more when…'}">${esc(m.explain)}</textarea><button class="btn" data-act="hand">Hand in</button>`;
  return `<h2>Lab finished</h2><p class="muted">Your prediction, your writing and your explanation are with your teacher.</p>`;
}
function board() {
  if (isDesign()) return dBoard();
  const l = L(), n = stepName(), all = steps(), next = all[s.step + 1];
  const nextBtn = `<button class="btn" data-act="next">${next ? `Next: ${next}` : 'Finish the lab'}</button>`, meter = '<div class="meter"><i data-meter></i></div>';
  let inner = '', status = `${CLASS} students here`, extra = '';
  if (n === 'Question') inner = `<h2>${l.question}</h2>${facts()}`;
  else if (n === 'Predict') { status = '<span data-count></span> locked in';
    inner = s.revealed ? `<h2>What we predict</h2>${bars(preds(), preds().indexOf(Math.max(...preds())))}` : `<h2>${l.predictQ}</h2><p class="muted">Predictions stay hidden until you reveal them.</p>${meter}`;
    extra = `<button class="btn second" data-act="reveal">${s.revealed ? 'Hide predictions' : 'Reveal predictions'}</button>`; }
  else if (n === 'Make') { status = '<span data-count></span> finished'; inner = `<h2>Write the moment the storm hits the house</h2><p>Three versions. Two or three sentences each.</p><div class="chips">${l.options.map((o) => `<span class="chip">${o}</span>`).join('')}</div>${meter}`; }
  else if (n === 'Test') { status = '<span data-count></span> in'; inner = `<h2>${l.judge === 'pick' ? 'Readers are choosing' : 'Readers are rating'}</h2><p>${l.judgeQ}</p><p class="muted">${l.judge === 'pick' ? 'Each reader gets six anonymous writers, with the senses hidden.' : 'Half the class has each version. Nobody knows which one they have.'}</p>${meter}`; }
  else if (n === 'Result') { const v = verdict(); status = l.judge === 'pick' ? `${CLASS * 6} choices from ${CLASS} readers` : `Average blame out of 10, from ${CLASS} readers`;
    inner = `<h2>${headline(false)}</h2>${bars(v.t, v.win ? v.top : -1, l.judge === 'rate' ? 10 : 0)}<p class="muted">Ahead by ${v.lead}. ${v.win ? 'That counts as a win.' : `A win needs ${l.win} or more.`}</p>${s.showBest ? best() : ''}`;
    extra = `<button class="btn second" data-act="best">${s.showBest ? 'Hide' : l.judge === 'pick' ? 'Show the most chosen piece' : 'Show both versions'}</button>`; }
  else if (n === 'Explain') { status = '<span data-count></span> handed in'; inner = `<h2>${whyQ()}</h2>${best()}<p class="muted">Your notes: ${l.notes}</p>`; }
  else return after();
  return `<section class="card"><div class="inner">${inner}</div><div class="ctrl"><span>${status}</span><div>${extra}${nextBtn}</div></div></section>`;
}
function best() { const l = L(); return l.judge === 'pick' ? `<div class="piece"><small>Most chosen: 6 of 6 readers</small>${l.best}</div>` : l.texts.map((t, i) => `<div class="piece"><small>${l.options[i]}</small>${marked(t)}</div>`).join(''); }
function after() {
  const l = L(), v = verdict(), p = preds(), m = s.me;
  const mineBest = l.judge === 'pick' ? `${l.options[l.mineChosen.indexOf(Math.max(...l.mineChosen))]}, ${Math.max(...l.mineChosen)} of 6` : `Read ${low(l.options[l.myVersion])}, gave ${m.rating}`;
  const rows = l.judge === 'pick'
    ? [['KT', 0, 'Touch, 4 of 6', 'You hear a storm from inside the house, so sound is the one you cannot escape…'], ['RV', 1, 'Sound, 6 of 6', 'You can close your eyes to a storm but the noise still gets in…'], ['JM', 0, 'Sound, 3 of 6', 'Sight tells you what it looks like, sound tells you how big it is…']]
    : [['KT', 0, 'Read active, gave 9', 'When the company is the subject of every sentence there is nowhere else to look…'], ['RV', 1, 'Read passive, gave 4', 'I did not notice the company was missing until we saw both versions…'], ['JM', 0, 'Read passive, gave 6', 'The passive makes it sound like weather, something that just happened…']];
  const tr = (who, pred, bestCol, text) => `<tr><td>${who}</td><td class="${pred === v.top ? 'held' : ''}">${l.options[pred]}${pred === v.top ? ', held' : ''}</td><td>${bestCol}</td><td>${text}</td><td><button class="btn second">Mark</button></td></tr>`;
  return `<section class="card flat"><h2>What the lab found</h2><dl class="rows">
      <div class="row"><dt>Class finding</dt><dd>${headline(false)} ${evidence()}</dd></div>
      <div class="row"><dt>Predictions</dt><dd>${p[v.top]} held, ${CLASS - p[v.top]} overturned.</dd></div></dl>
      <div><button class="btn second">Run it again</button></div></section>
    <section class="card flat" style="margin-top:16px"><h2>Explanations to mark</h2><table><thead><tr><th>Student</th><th>Predicted</th><th>${l.judge === 'pick' ? 'Their best version' : 'Their reading'}</th><th>Explanation</th><th></th></tr></thead><tbody>
      ${tr('You', m.pred ?? 0, mineBest, esc(m.explain) || '<span class="muted">Nothing written</span>')}${rows.map((r) => tr(...r)).join('')}
      <tr><td colspan="5" class="muted">13 more students</td></tr></tbody></table></section>`;
}
function plan() {
  if (isDesign()) return dPlan();
  const l = L(), on = (c) => c ? 'on' : '';
  return `<section class="card"><h2>Lab</h2><p class="muted">These lines are the whole lab. The steps build themselves from them.</p><dl class="rows">
    <div class="row"><dt>Question</dt><dd>${l.question}</dd></div>
    <div class="row"><dt>Kept the same</dt><dd>${l.same}</dd></div>
    <div class="row"><dt>Changed</dt><dd><div class="chips">${l.options.map((o) => `<span class="chip">${o}</span>`).join('')}<span class="chip plain">Add</span></div></dd></div>
    <div class="row"><dt>Who decides the change</dt><dd>${levelChips()}<small>${l.source === 'students' ? 'You set the change. Each student writes one version per option, so the lab gains a Make step.' : 'You set the change and paste one version per option. Half the class reads each.'}</small></dd></div>
    <div class="row"><dt>How readers judge</dt><dd><div class="chips"><span class="chip plain ${on(l.judge === 'pick')}">Pick one</span><span class="chip plain ${on(l.judge === 'rate')}">Rate on a line</span></div>
      <small>"${l.judgeQ}" ${l.judge === 'pick' ? 'Each student reads 6 writers. Writers are anonymous and the options are hidden.' : 'Each student reads one version and places it from "A little" to "Completely".'}</small></dd></div>
    <div class="row"><dt>Counts as a win</dt><dd>${l.judge === 'pick' ? 'Ahead by 8 choices or more.' : 'Ahead by 1 point or more out of 10.'} Closer than that is too close to call.</dd></div>
    <div class="row"><dt>My debrief notes</dt><dd>${l.notes}<small>Only you see these.</small></dd></div></dl>
    ${l.source === 'supplied' ? `<div class="rows">${l.texts.map((t, i) => `<div class="piece" style="margin-top:10px"><small>${l.options[i]}</small>${marked(t)}</div>`).join('')}</div>` : ''}
    <div><button class="btn" data-act="view" data-i="board">Open on the board</button></div></section>`;
}

/* ---------- Frame ---------- */
function render() {
  const l = L(), all = steps(), over = s.step >= all.length;
  document.getElementById('mock').innerHTML = `<b>Mock</b>
    <div class="seg">${[['plan', 'Plan'], ['board', 'Board'], ['student', 'Student']].map(([k, n]) => `<button class="${s.view === k ? 'on' : ''}" data-act="view" data-i="${k}">${n}</button>`).join('')}</div>
    <div class="seg">${Object.entries(LABS).map(([k, x]) => `<button class="${s.lab === k ? 'on' : ''}" data-act="lab" data-i="${k}">${x.name}</button>`).join('')}</div>
    <button class="go" data-act="next" ${over ? 'disabled' : ''}>Move the class on</button><button class="go" style="margin-left:0" data-act="reset">Start again</button>`;
  const strip = s.view === 'plan' ? '' : `<div class="strip"><p>${over ? '<b>After class</b>' : `<b>${all[s.step]}</b> · ${s.step + 1} of ${all.length}`}</p><div class="dots">${all.map((_, i) => `<i class="${i < s.step ? 'seen' : i === s.step ? 'here' : ''}"></i>`).join('')}</div></div>`;
  const body = s.view === 'plan' ? plan() : s.view === 'board' ? board() : `${notes()}<section class="card">${student()}</section>`;
  document.getElementById('page').innerHTML = `<main class="page ${s.view}"><p class="eyebrow">Lab</p><h1 class="title">${l.title}</h1>
    <div class="meta"><strong>12 English Advanced</strong><span>Thursday 19 November · Period 3</span></div>${strip}${body}</main>`;
  requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll('[data-w]').forEach((b) => b.style.width = b.dataset.w + '%')));
  progress();
}
function progress() {
  const l = L(), n = stepName(), o = othersDone(), c = document.querySelector('[data-count]'), m = document.querySelector('[data-meter]');
  let done = o + (meDone() ? 1 : 0), total = CLASS, text = `${done} of ${total}`;
  if (isDesign() && (n === 'Design' || n === 'Predict')) { done = Math.min(7, s.tick) + (meDone() ? 1 : 0); total = 8; text = `${done} of 8 pairs`; }
  else if (n === 'Test' && (isDesign() || l.judge === 'pick')) { done = o * 6 + (isDesign() ? s.me.k : s.me.judged.length); total = CLASS * 6; text = `${done} of ${total} ${isDesign() ? 'ratings' : 'choices'}`; }
  else if (n === 'Test') text = `${done} of ${total} ratings`;
  if (c) c.textContent = text; if (m) m.style.width = done / total * 100 + '%';
}
setInterval(() => { if (s.tick < 8) { s.tick++; progress(); } }, 900);

document.addEventListener('input', (e) => {
  const b = e.target.dataset.bind, m = s.me; if (e.target.dataset.note) { m.notes[e.target.dataset.note] = e.target.value; return; } if (!b) return;
  if (b === 'reason') m.reason = e.target.value; else if (b === 'explain') m.explain = e.target.value; else if (b === 'again') m.again = e.target.value;
  else if (b === 'text') m.texts[m.v] = e.target.value; else if (b === 'rating') m.rating = +e.target.value;
});
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const a = t.dataset.act, i = t.dataset.i, m = s.me, tok = m.tokens[m.sel];
  let top = true;
  const need = t.dataset.needs;
  if (need && s.notesOn && !(m.notes[need] || '').trim()) { s.miss = need; render(); const el = document.querySelector(`[data-note="${need}"]`); if (el) el.focus(); return; }
  s.miss = '';
  if (a === 'view') s.view = i;
  else if (a === 'lab' || a === 'reset') { if (a === 'lab') s.lab = i; Object.assign(s, { step: 0, tick: 0, revealed: false, showBest: false, open: -1, me: fresh() }); }
  else if (a === 'next') { if (s.step < steps().length) { s.step++; s.tick = 0; s.showBest = false; s.open = -1; } }
  else if (a === 'pred') m.pred = +i;
  else if (a === 'dpred') { m.pred = +i; top = false; }
  else if (a === 'lock') m.locked = true;
  else if (a === 'made') { if (m.v < L().options.length - 1) m.v++; else m.made = true; }
  else if (a === 'judge') { t.classList.add('on'); m.judged.push(+i); setTimeout(render, 320); return; }
  else if (a === 'rate') m.rated = true;
  else if (a === 'hand') m.handed = true;
  else if (a === 'reveal') s.revealed = !s.revealed;
  else if (a === 'best') s.showBest = !s.showBest;
  else if (a === 'tok') { m.sel = m.sel === +i ? -1 : +i; top = false; }
  else if (a === 'rep') { const v = document.querySelector('[data-rep]').value.trim(); tok.rep = v && v !== tok.w ? v : null; tok.cut = false; top = false; }
  else if (a === 'cut') { tok.cut = !tok.cut; top = false; }
  else if (a === 'brk') { tok.nbr = !tok.nbr; top = false; }
  else if (a === 'clear') { m.tokens = baseTokens(); m.sel = -1; top = false; }
  else if (a === 'ready') { m.ready = true; m.sel = -1; }
  else if (a === 'drate') { m.ratings.push(+document.querySelector('[data-bind=cur]').value); m.k++; }
  else if (a === 'qdone' || a === 'tdone' || a === 'rdone' || a === 'named') m[a] = true;
  else if (a === 'feat') { m.feat = +i; top = false; }
  else if (a === 'notes') { s.notesOn = i === 'on'; top = false; }
  else if (a === 'open') { s.open = s.open === +i ? -1 : +i; top = false; }
  render(); if (top) window.scrollTo(0, 0);
});
s.me = fresh();
render();
</script>
</body>
</html>
