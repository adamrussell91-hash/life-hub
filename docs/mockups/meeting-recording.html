<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meeting recording — mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #fbf8f2; --cotton: #f5f1e9; --navy: #17375e; --navy-2: #244f7c;
  --depth: #0a1536; --ink: #13233a; --muted: #6b7788;
  --line: rgba(23, 55, 94, 0.10); --line-2: rgba(23, 55, 94, 0.18);
  --glass: rgba(255, 255, 255, 0.86); --elev-1: 0 1px 2px rgba(20,35,70,.06);
  --elev-2: 0 8px 28px rgba(20,35,70,.12);
  --sage: #5e8a6e; --sage-bg: #e7f0e8; --amber: #b7791f; --amber-bg: #fbf0dc;
  --sky-bg: #e6eef8; --red: #c0392b; --red-bg: #fbe9e7; --plum: #6b4c8a; --plum-bg: #f0eaf6;
  --gold: #a67c00; --gold-bg: #fff6d6;
  --r-sm: 12px; --r-md: 18px; --r-lg: 22px;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: Inter, ui-sans-serif, sans-serif; color: var(--ink);
  background: linear-gradient(135deg, #f6f1e8, #fbf8f2 50%, #f3eee6); min-height: 100vh; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select { font: inherit; }

/* mockup control bar — not part of the product */
.mock { position: sticky; top: 0; z-index: 50; background: #2b2f36; color: #e9ecf1; font-size: 13px;
  display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 8px 16px; }
.mock b { color: #fff; letter-spacing: .06em; font-size: 11px; text-transform: uppercase; }
.mock .grp { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.mock button { background: #3b414b; border: 0; color: #e9ecf1; border-radius: 6px; padding: 5px 9px; font-size: 12px; }
.mock button.on { background: #f2c94c; color: #222; font-weight: 700; }
.mock .lbl { color: #9aa3b2; }

.app { display: grid; grid-template-columns: 240px 1fr; min-height: calc(100vh - 40px); }
.side { background: var(--depth); color: #dfe6f1; padding: 26px 14px; }
.side h1 { font-size: 13px; letter-spacing: .12em; margin: 0 14px 26px; color: #fff; }
.side .sec { font-size: 11px; letter-spacing: .12em; color: #8d9ab3; margin: 20px 14px 8px; font-weight: 700; }
.side a { display: block; padding: 10px 14px; border-radius: 12px; color: #dfe6f1; text-decoration: none; font-weight: 500; font-size: 15px; }
.side a.on { background: rgba(255,255,255,.1); color: #fff; font-weight: 700; }

main { padding: 30px 36px 140px; max-width: 1040px; min-width: 0; }
.eyebrow { font-size: 12px; letter-spacing: .14em; font-weight: 700; color: var(--muted); text-transform: uppercase; }
h2.page { font-size: 30px; font-weight: 800; color: var(--depth); margin: 6px 0 6px; letter-spacing: -.02em; }
.meta { color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 18px; }
.people { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: #fff; border: 1px solid var(--line-2); font-size: 13px; font-weight: 600; color: var(--navy); }
.pill small { font-weight: 500; color: var(--muted); }

.phases { display: inline-flex; background: var(--cotton); border: 1px solid var(--line); border-radius: 999px; padding: 4px; margin-bottom: 18px; }
.phases button { border: 0; background: transparent; padding: 7px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--muted); }
.phases button.on { background: #fff; color: var(--navy); box-shadow: var(--elev-1); }

.card { background: var(--glass); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--elev-1); padding: 20px 22px; margin-bottom: 16px; min-width: 0; }
.card h3 { margin: 0 0 4px; font-size: 17px; font-weight: 700; color: var(--depth); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card .sub { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
.card.dim { opacity: .55; }
.stub { height: 60px; border-radius: 12px; background: repeating-linear-gradient(90deg, var(--cotton) 0 40%, transparent 40% 45%); }
.cardhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }

.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line-2); background: #fff; font-weight: 600; font-size: 14px; color: var(--navy); white-space: nowrap; }
.btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn.primary:disabled { background: #a9b4c3; border-color: #a9b4c3; cursor: not-allowed; }
.btn.red { background: var(--red); border-color: var(--red); color: #fff; }
.btn.ghost { background: transparent; }
.btn.small { min-height: 32px; padding: 0 12px; font-size: 13px; }
.btn.tiny { min-height: 28px; padding: 0 10px; font-size: 12px; }
.link { background: none; border: 0; padding: 0; color: var(--navy-2); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; font-size: 13px; }
.ts { font-size: 12px; color: var(--navy-2); font-weight: 600; background: var(--sky-bg); border: 0; border-radius: 6px; padding: 1px 6px; font-variant-numeric: tabular-nums; }

/* live strip */
.strip { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--depth); color: #fff; border-radius: var(--r-md); padding: 12px 14px; margin-bottom: 14px; }
.strip .timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 18px; margin-right: auto; display: flex; align-items: center; gap: 10px; }
.strip .timer small { font-weight: 500; font-size: 12px; color: #9fb0cc; }
.strip .btn { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.2); color: #fff; }
.strip .btn.rec { background: #fff; color: var(--red); border-color: #fff; }
.strip .btn.end { background: #fff; color: var(--depth); }
.recbadge { display: inline-flex; align-items: center; gap: 8px; background: rgba(192,57,43,.22); border: 1px solid rgba(255,140,120,.5); padding: 4px 12px; border-radius: 999px; font-size: 14px; font-variant-numeric: tabular-nums; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: #ff5a47; animation: pulse 1.6s infinite; }
.paused .dot { animation: none; background: #f2c94c; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,90,71,.6);} 70% { box-shadow: 0 0 0 8px rgba(255,90,71,0);} 100% { box-shadow: 0 0 0 0 rgba(255,90,71,0);} }
.health { width: 100%; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 12px; color: #9fb0cc; }
.health .ok::before { content: "✓ "; color: #7fd1a0; }
.health .bad { color: #ffb4a8; font-weight: 600; }
.health .bad::before { content: "! "; }
.meter { display: inline-flex; align-items: flex-end; gap: 2px; height: 18px; }
.meter i { width: 4px; border-radius: 2px; background: #7fd1a0; transition: height .2s; }
.meter.dead i { background: #ff7a66; }

/* mic check */
.miccheck { display: flex; align-items: center; gap: 12px; background: var(--cotton); border-radius: 12px; padding: 10px 12px; margin: 0 0 14px; font-size: 14px; flex-wrap: wrap; }
.miccheck .meter i { background: var(--sage); }
.miccheck select { border: 1px solid var(--line-2); border-radius: 999px; padding: 4px 10px; background: #fff; font-size: 13px; }
.miccheck .heard { color: var(--sage); font-weight: 700; }

/* alarm banners */
.alarm { border-radius: var(--r-md); padding: 14px 16px; margin-bottom: 14px; display: flex; gap: 12px; align-items: flex-start; }
.alarm .big { font-size: 22px; line-height: 1; }
.alarm p { margin: 0 0 6px; }
.alarm .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
.alarm.red { background: var(--red); color: #fff; animation: throb 1.2s ease-in-out infinite; }
.alarm.red .btn { background: #fff; color: var(--red); border-color: #fff; }
.alarm.red select { border-radius: 999px; border: 0; padding: 6px 10px; font-size: 13px; }
.alarm.amber { background: var(--amber-bg); color: #6b4509; }
.alarm.sky { background: var(--sky-bg); color: var(--navy); }
@keyframes throb { 50% { box-shadow: 0 0 0 6px rgba(192,57,43,.25); } }

/* consent */
.consent { background: #fff; border: 1px solid var(--line-2); border-radius: var(--r-md); padding: 18px; margin-bottom: 14px; box-shadow: var(--elev-2); }
.consent label.tick { display: flex; gap: 12px; align-items: flex-start; font-size: 16px; font-weight: 600; color: var(--depth); cursor: pointer; }
.consent input[type=checkbox] { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--navy); flex: none; }
.consent .law { color: var(--muted); font-size: 13px; margin: 8px 0 14px 34px; }
.consent .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.private { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink); cursor: pointer; }
.switch { width: 40px; height: 24px; border-radius: 999px; background: #c9d1dc; position: relative; transition: background .15s; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.private.on .switch { background: var(--plum); }
.private.on .switch::after { left: 19px; }
.private small { color: var(--muted); display: block; font-size: 12px; }

/* tap chips */
.taps { background: #fff; border: 1px solid var(--line-2); border-radius: var(--r-md); padding: 14px 16px; margin-bottom: 14px; }
.taps .hint { font-size: 13px; color: var(--muted); margin: 0 0 10px; display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.tchip { display: inline-flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 18px; border-radius: 999px; border: 2px solid var(--line-2); background: var(--paper); font-size: 16px; font-weight: 700; color: var(--navy); transition: transform .08s; user-select: none; }
.tchip:active { transform: scale(.96); }
.tchip .av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; color: #fff; background: var(--navy-2); }
.tchip .cnt { font-size: 12px; font-weight: 700; background: var(--sky-bg); color: var(--navy); border-radius: 999px; padding: 2px 7px; }
.tchip.flash { background: var(--navy); color: #fff; border-color: var(--navy); }
.tchip.room { border-style: dashed; background: transparent; color: var(--muted); }
.tchip.room .av { background: #9aa3b2; }
.tchip.speaking { border-color: var(--sage); box-shadow: 0 0 0 3px var(--sage-bg); }
.undo { margin-top: 10px; font-size: 13px; color: var(--muted); min-height: 20px; }
.flagrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line-2); }
.flagrow .btn { border-style: dashed; }

.notes { background: #fff; border: 1px solid var(--line-2); border-radius: var(--r-md); padding: 14px 16px; font-size: 15px; line-height: 1.6; min-height: 110px; }
.notes ul { margin: 0; padding-left: 18px; }

/* modal */
.scrim { position: fixed; inset: 0; background: rgba(10,21,54,.35); display: none; place-items: center; z-index: 70; padding: 16px; }
.scrim.show { display: grid; }
.modal { background: #fff; border-radius: var(--r-lg); padding: 22px; max-width: 440px; width: 100%; box-shadow: var(--elev-2); }
.modal h4 { margin: 0 0 8px; font-size: 18px; color: var(--depth); }
.modal p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
.modal .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

/* transcript card waiting states */
.state { display: flex; gap: 14px; align-items: flex-start; padding: 6px 0; }
.state .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 18px; flex: none; }
.state .ic.wait { background: var(--sky-bg); }
.state .ic.work { background: var(--amber-bg); }
.state .ic.fail { background: var(--red-bg); }
.state p { margin: 0 0 4px; font-size: 15px; }
.state .muted, .muted { color: var(--muted); font-size: 13px; }
.bar { height: 8px; background: var(--cotton); border-radius: 999px; overflow: hidden; margin: 8px 0 4px; max-width: 360px; }
.bar i { display: block; height: 100%; background: var(--navy-2); border-radius: 999px; }
.bar.work i { background: var(--amber); width: 40%; animation: slide 2.4s ease-in-out infinite; }
@keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
.safety { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; margin-top: 12px; }
.safety div { background: var(--cotton); border-radius: 10px; padding: 8px 10px; font-size: 12px; color: var(--muted); }
.safety b { display: block; color: var(--ink); font-size: 13px; }

.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; letter-spacing: .02em; white-space: nowrap; }
.tag.priv { background: var(--plum-bg); color: var(--plum); }
.tag.ok { background: var(--sage-bg); color: var(--sage); }
.tag.amber { background: var(--amber-bg); color: #7a4f0d; }
.tag.gone { background: var(--cotton); color: var(--muted); }
.tag.gold { background: var(--gold-bg); color: var(--gold); }

/* DONE: overview */
.sect-h { font-size: 12px; font-weight: 700; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; margin: 22px 0 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.sect-h:first-child { margin-top: 0; }
.overview { font-size: 16px; line-height: 1.6; color: var(--ink); margin: 0; }
.feeds { font-size: 12px; color: var(--muted); margin-top: 8px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* flow timeline */
.flowbar { display: flex; height: 10px; border-radius: 99px; overflow: hidden; gap: 2px; margin-bottom: 10px; }
.flowbar i { display: block; height: 100%; cursor: pointer; }
.flow { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 10px; scroll-snap-type: x mandatory; }
.seg { flex: 0 0 210px; scroll-snap-align: start; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; border-top: 4px solid var(--c); }
.seg .when { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; justify-content: space-between; }
.seg b { display: block; font-size: 14px; color: var(--depth); margin: 3px 0 4px; }
.seg p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.45; }
.seg .who { display: flex; margin-top: 8px; }
.mini { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 9px; font-weight: 700; border: 2px solid #fff; margin-left: -5px; }
.mini:first-child { margin-left: 0; }

/* notes built out */
.bnotes { background: #fff; border: 1px solid var(--line-2); border-radius: var(--r-md); padding: 14px 16px; }
.bnotes .mine { font-size: 15px; font-weight: 600; color: var(--depth); margin: 10px 0 4px; display: flex; gap: 8px; }
.bnotes .mine:first-child { margin-top: 0; }
.bnotes .mine::before { content: "•"; color: var(--navy-2); }
.add { display: flex; gap: 8px; align-items: flex-start; margin: 4px 0 4px 18px; font-size: 14px; line-height: 1.5; padding: 6px 8px; border-radius: 10px; background: var(--plum-bg); border-left: 3px solid var(--plum); }
.add .txt { flex: 1; min-width: 0; color: #3f2c55; }
.add .txt .src { color: var(--plum); font-size: 12px; }
.add .acts { display: flex; gap: 4px; flex: none; }
.add .acts button { border: 0; background: #fff; border-radius: 8px; width: 28px; height: 28px; font-size: 14px; }
.add.kept { background: transparent; border-left-color: var(--line-2); }
.add.kept .txt { color: var(--ink); }
.add.kept .acts { display: none; }
.add.gone { display: none; }
.newhead { margin-top: 14px !important; color: var(--plum) !important; }
.newhead::before { content: "+" !important; color: var(--plum) !important; }
.legend { font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--plum-bg); border-left: 3px solid var(--plum); margin-right: 4px; vertical-align: -1px; }

/* pickups */
.picks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.pcol h4 { margin: 0 0 8px; font-size: 13px; display: flex; align-items: center; gap: 6px; color: var(--depth); }
.pcol h4 .n { background: var(--cotton); color: var(--muted); border-radius: 99px; font-size: 11px; padding: 1px 7px; }
.pk { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; font-size: 14px; line-height: 1.45; }
.pk .q { color: var(--muted); font-size: 12px; margin-top: 4px; font-style: italic; }
.pk .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
.pk.done { background: var(--sage-bg); border-color: transparent; }
.pk.done .acts { display: none; }
.pk .res { display: none; font-size: 12px; font-weight: 700; color: var(--sage); margin-top: 6px; }
.pk.done .res { display: block; }
.pk.dismissed { display: none; }
.pcol.poi .pk { border-left: 3px solid var(--gold); }
.pcol.poi h4 { color: var(--gold); }

/* by person */
.persons { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.prs { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.prs .top { display: flex; gap: 10px; align-items: center; margin-bottom: 6px; }
.prs .av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 700; flex: none; }
.prs .nm { font-weight: 700; color: var(--depth); }
.prs .nm small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.prs ul { margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.5; }
.prs li { margin-bottom: 3px; }
.prs .star { color: var(--gold); font-weight: 700; }
.prs .foot2 { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 8px; flex-wrap: wrap; }
.nameprompt { background: var(--amber-bg); border-radius: 12px; padding: 10px 12px; font-size: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between; margin-top: 12px; }

.wordsbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); margin-top: 18px; padding-top: 14px; font-size: 13px; color: var(--muted); }

/* drawer (full transcript) */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: #fff; z-index: 65; box-shadow: -10px 0 40px rgba(10,21,54,.18); transform: translateX(105%); transition: transform .22s ease; display: flex; flex-direction: column; }
.drawer:not(.open) { visibility: hidden; }
.drawer.open { transform: none; }
.drawer .dh { padding: 16px 18px 10px; border-bottom: 1px solid var(--line); }
.drawer .dh .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.drawer .dh h3 { margin: 0; font-size: 17px; color: var(--depth); }
.drawer .db { overflow: auto; padding: 8px 18px 40px; flex: 1; }
.dscrim { position: fixed; inset: 0; background: rgba(10,21,54,.2); z-index: 64; display: none; }
.dscrim.show { display: block; }
.spk { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.spk:first-of-type { border-top: 0; }
.spk .av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 700; }
.spk .nm { font-weight: 700; color: var(--depth); font-size: 14px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.spk .nm small { font-weight: 500; color: var(--muted); font-size: 12px; }
.spk .share { font-size: 12px; color: var(--muted); }
.spk.unnamed { background: linear-gradient(90deg, var(--amber-bg), transparent 70%); border-radius: 12px; padding-left: 6px; }
.picker select { border: 1px solid var(--line-2); border-radius: 999px; padding: 4px 10px; background: #fff; font-size: 13px; font-weight: 600; color: var(--navy); margin-top: 4px; }
.find input { width: 100%; height: 38px; border-radius: 999px; border: 1px solid var(--line-2); padding: 0 16px; background: #fff; font-size: 14px; margin-top: 10px; }
.ln { display: grid; grid-template-columns: 42px 1fr; gap: 8px; padding: 8px 4px; border-radius: 10px; }
.ln.hit { background: var(--gold-bg); }
.ln:hover { background: var(--cotton); }
.ln .t { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 3px; }
.ln .who { font-weight: 700; font-size: 13px; }
.ln .tx { font-size: 14px; line-height: 1.55; }
.ln mark { background: #fde68a; border-radius: 3px; }
.ln .moved { font-size: 11px; font-weight: 600; color: var(--plum); background: var(--plum-bg); border-radius: 999px; padding: 1px 7px; }

    <div class="acts"><button class="btn small" data-act="online">Try now</button><button class="btn small">⇣ Save a copy to this device</button></div></div></div>` : '';

  const consent = rec === 'consent' ? `
  <div class="consent">
    <div class="miccheck">${meter(false)} <span class="heard">✓ Hearing you</span>
      <select aria-label="Microphone"><option>MacBook Pro microphone</option><option>AirPods Pro</option><option>iPhone microphone</option></select>
      <span class="muted">Say something. The bars must move before you start.</span></div>
    <label class="tick"><input type="checkbox" id="ctick" ${consentTicked ? 'checked' : ''}> Everyone in this ${ctx} has agreed to it being recorded.</label>
    <p class="law">Recording people without their agreement is unlawful in NSW.</p>
    <div class="row">
      ${privateSwitch()}
      <span style="display:flex;gap:8px">
        <button class="btn ghost small" data-act="cancel-consent">Cancel</button>
        <button class="btn primary" data-act="begin" ${consentTicked ? '' : 'disabled'}>● Start recording</button>
      </span>
    </div>
  </div>` : '';

  const warn = recording && secs >= 2 * 3600 + 50 * 60 ? `<div class="alarm amber">⚠ <span>Recording stops by itself at 3 hours (${fmt(3 * 3600 - secs)} left). Stop and start again to keep going.</span></div>` : '';

  const counts = {};
  taps.forEach(t => counts[t.who] = (counts[t.who] || 0) + 1);
  const chipList = [...everyone(), ...(CTX[ctx].room ? [ROOM] : [])];
  const allTapped = everyone().every(p => counts[p.id]);
  const lastWho = taps.length ? taps[taps.length - 1].who : null;
  const canUndo = lastTapAt !== null && (secs - lastTapAt) <= 10 && taps.length;
  const tapsBox = recording ? `
  <div class="taps">
    <p class="hint"><span>${allTapped ? 'Who’s talking? Tap when someone new starts.' : 'Tap when someone starts talking. Two or three taps each is enough.'}</span><span>${taps.length} taps</span></p>
    <div class="chips">
      ${chipList.map(p => `<button class="tchip ${p.id === 'room' ? 'room' : ''} ${p.id === lastWho ? 'speaking' : ''}" data-tap="${p.id}">
        <span class="av" style="background:${p.c}">${esc(initials(p.name))}</span>${esc(p.id === 'room' ? 'Someone in the room' : p.short)}
        ${counts[p.id] ? `<span class="cnt">×${counts[p.id]}</span>` : ''}</button>`).join('')}
    </div>
    <div class="flagrow">
      <button class="btn small" data-flag="task">☐ That’s a to-do</button>
      <button class="btn small" data-flag="poi">★ Remember this</button>
      ${flags.length ? `<span class="muted" style="align-self:center">${flags.length} marked — the write-up looks hardest here</span>` : ''}
    </div>
    <div class="undo">${canUndo ? `Tapped ${esc(byId(lastWho).short)}. <button class="link" data-act="undo">Undo last tap</button>` : ''}</div>
  </div>` : '';

  return `${strip}${silentAlarm}${offlineAlarm}${consent}${warn}${tapsBox}
  <div class="card"><h3>Minutes</h3><p class="sub">Agenda items fold here with a notes box each.</p><div class="stub"></div></div>
  <div class="card"><h3>Notes</h3><div class="notes"><ul>${CTX[ctx].notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul></div></div>`;
}

  }).join('');
  const q = findQ.trim().toLowerCase();

  const fixOpts = id => everyone().map(p => `<button data-fixto="${p.id}" data-line="${id}">${esc(p.short)}</button>`).join('') + (CTX[ctx].room ? `<button data-fixto="room" data-line="${id}">Room</button>` : '');

/* ---------- actions ---------- */
function tick() {
  if (rec !== 'recording') return;
  secs++;
  if (forceSilent) silentFor++;
  if (offline && secs % 60 === 0) pendingParts++;
  if (secs >= 3 * 3600) { stopRec(true); return; }
  if (!document.querySelector('#scrim.show')) render();
}
function startTimer() { clearInterval(timer); timer = setInterval(tick, 1000); }
function stopRec(auto) {
  rec = 'stopped'; clearInterval(timer);
  if (auto) showModal('Recording stopped at 3 hours', 'It has uploaded. Press Record again to start a second recording.', [['OK', 'close']]);
  render();
}
function showModal(h, p, buttons) {
  $('#modal').className = 'modal';
  $('#modal').innerHTML = `<h4>${esc(h)}</h4><p>${esc(p)}</p><div class="row">${buttons.map(([l, a, cls]) => `<button class="btn ${cls || ''}" data-act="${a}">${esc(l)}</button>`).join('')}</div>`;
  $('#scrim').classList.add('show');
}
function closeModal() { $('#scrim').classList.remove('show'); }
function seedTaps() {
  taps = []; everyone().forEach((p, i) => { taps.push({ who: p.id, at: 20 + i * 30 }); if (i < 2) taps.push({ who: p.id, at: 200 + i * 40 }); });
  lastTapAt = null;
}
function resetDone() { speakerNames = {}; lineOverrides = {}; findQ = ''; addState = {}; pickState = {}; hitLine = null; drawerOpen = false; }

function jump(to) {
  resetDone(); clearInterval(timer);
  forceSilent = false; silentFor = 0; offline = false; pendingParts = 0; crashed = false;
  if (to === 'before') { phase = 'before'; rec = 'idle'; card = 'none'; secs = 0; taps = []; flags = []; }
  if (['record', 'silent', 'offline', 'late'].includes(to)) {
    phase = 'during'; rec = 'recording'; consentTicked = true; card = 'none'; seedTaps();
    secs = to === 'late' ? 2 * 3600 + 50 * 60 + 4 : 754;
    if (to === 'silent') { forceSilent = true; silentFor = 18; }
    if (to === 'offline') { offline = true; pendingParts = 3; }
    startTimer();
  }
  if (to === 'crash') { phase = 'during'; rec = 'idle'; card = 'none'; crashed = true; secs = 2520; }
  if (['uploading', 'device', 'waiting', 'transcribing', 'done', 'failed'].includes(to)) {
    phase = 'after'; rec = 'stopped'; if (secs < 300) secs = 3482; card = to; failCount = to === 'failed' ? 3 : 0;
  }
  render();
}

function openDrawerAt(line) {
  drawerOpen = true; findQ = ''; hitLine = line; render();
  const el = document.getElementById('line-' + line); if (el) el.scrollIntoView({ block: 'center' });
}

document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-act]');
  if (!t) return;
  if (t.dataset.ctx) { ctx = t.dataset.ctx; resetDone(); render(); return; }
  if (t.dataset.jump) { jump(t.dataset.jump); return; }
  if (t.dataset.phase) { phase = t.dataset.phase; render(); return; }
  if (t.dataset.lineJump !== undefined) { openDrawerAt(+t.dataset.lineJump); return; }
  if (t.dataset.tap) {
    taps.push({ who: t.dataset.tap, at: secs }); lastTapAt = secs; render();
    const el = document.querySelector(`[data-tap="${t.dataset.tap}"]`); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 350);
    return;
  }
  if (t.dataset.flag) { flags.push({ kind: t.dataset.flag, at: secs }); render(); return; }
  if (t.dataset.add !== undefined) { addState[t.dataset.add] = t.dataset.v; render(); return; }
  if (t.dataset.pick) { pickState[t.dataset.pick] = t.dataset.x ? 'x' : t.dataset.res; render(); return; }
  if (t.dataset.profile) { openProfile(t.dataset.profile); return; }
  if (t.dataset.fix) { document.getElementById('fm-' + t.dataset.fix).classList.toggle('show'); return; }
  if (t.dataset.fixto) { lineOverrides[t.dataset.line] = t.dataset.fixto; render(); return; }
  const a = t.dataset.act;
  if (a === 'private') { isPrivate = !isPrivate; render(); }
  if (a === 'start-meeting') { phase = 'during'; render(); }
  if (a === 'record') { rec = 'consent'; consentTicked = false; render(); }
  if (a === 'cancel-consent') { rec = 'idle'; render(); }
  if (a === 'begin' && consentTicked) { rec = 'recording'; secs = 0; taps = []; flags = []; lastTapAt = null; startTimer(); render(); }
  if (a === 'pause') { rec = rec === 'paused' ? 'recording' : 'paused'; render(); }
  if (a === 'undo') { taps.pop(); lastTapAt = null; render(); }
  if (a === 'stop') stopRec(false);
  if (a === 'fix-mic') { forceSilent = false; silentFor = 0; render(); }
  if (a === 'online') { offline = false; pendingParts = 0; render(); }
  if (a === 'recover') { crashed = false; phase = 'after'; rec = 'stopped'; card = 'waiting'; render(); }
  if (a === 'resume-rec') { crashed = false; rec = 'recording'; seedTaps(); startTimer(); render(); }
  if (a === 'upload-now') { card = 'waiting'; render(); }
  if (a === 'end') {
    if (rec === 'recording' || rec === 'paused') showModal(`End the ${ctx}?`, `This stops the recording first, uploads the last minute, then completes the ${ctx}.`, [['Keep going', 'close', 'ghost'], ['Stop and end', 'end-confirm', 'primary']]);
    else { phase = 'after'; if (rec === 'stopped' && card === 'none') card = 'uploading'; render(); }
  }
  if (a === 'end-confirm') { closeModal(); stopRec(false); phase = 'after'; card = 'uploading'; render(); setTimeout(() => { if (card === 'uploading') { card = 'waiting'; render(); } }, 2500); }
  if (a === 'close') closeModal();
  if (a === 'retry') { card = 'transcribing'; render(); }
  if (a === 'keep-all') { R().built.forEach((_, i) => { if (!addState[i]) addState[i] = 'kept'; }); render(); }
  if (a === 'open-drawer') { drawerOpen = true; hitLine = null; render(); }
  if (a === 'close-drawer') { drawerOpen = false; render(); }
  if (a === 'del-rec') showModal('Delete this recording?', 'The audio is deleted permanently and there will be no write-up. This can’t be undone.', [['Cancel', 'close', 'ghost'], ['Delete', 'del-confirm', 'red']]);
  if (a === 'del-confirm') { closeModal(); card = 'none'; render(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'ctick') { consentTicked = e.target.checked; render(); }
  if (e.target.dataset.voice) { speakerNames[e.target.dataset.voice] = e.target.value || null; render(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'find') { findQ = e.target.value; hitLine = null; const pos = e.target.selectionStart; renderDrawer(); const f = $('#find'); f.focus(); f.setSelectionRange(pos, pos); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset.act === 'private') e.target.click();
  if (e.key === 'Escape') { drawerOpen = false; closeModal(); render(); }
});

render();
</script>
</body>
