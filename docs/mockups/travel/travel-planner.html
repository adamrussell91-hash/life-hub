<title>Round the World Trip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bagel+Fat+One&display=swap">
<style>
:root {
  color-scheme: light;
  /* Life Hub design-kit tokens */
  --cotton: #f5f1e9; --paper: #fbf8f2; --depth: #0a1536; --marine: #142b51; --navy: #17375e;
  --wave: #376fb7; --high-sea: #f68620; --high-sea-ink: #a85a0c; --shore: #eae7da; --sand: #f0cfac;
  --ink: #13233a; --muted: #6b7788; --line: rgba(23,55,94,.10);
  --pastel-blue: #dceafa; --pastel-blue-ink: #294c71; --pastel-sage: #dfe9e1; --pastel-sage-ink: #3c5949;
  --pastel-peach: #f2dfd0; --pastel-peach-ink: #7a5038; --pastel-gold: #f1e2b6; --pastel-gold-ink: #6c581f;
  --pastel-lilac: #e8e0f1; --pastel-lilac-ink: #5d4e70; --success: #2f7a4f;
  --radius-xs: .375rem; --radius-sm: .875rem; --radius-md: 1.25rem; --radius-lg: 1.5rem;
  --elev-1: 0 1px 2px rgba(10,21,54,.06); --elev-2: 0 6px 20px rgba(10,21,54,.12);
  --font-ui: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-fun: "Bagel Fat One", "Arial Rounded MT Bold", ui-rounded, system-ui, sans-serif;
  /* map */
  --map-land: #f4ecdc; --map-water: #a9d3e6; --map-park: #cfe3c4; --map-road: #ffffff;
  /* current city accent (set per city) */
  --city: #e8743b; --city-soft: #fde3d3; --city-ink: #8a3a12;
}
* { box-sizing: border-box; }
body { background: var(--cotton); color: var(--ink); font-family: var(--font-ui); font-size: .9375rem; line-height: 1.5; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 80px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--wave); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: .6875rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; color: var(--muted); }
.btn { border: 0; border-radius: var(--radius-sm); padding: 9px 14px; font-size: .8125rem; font-weight: 600; background: var(--navy); color: #fff; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
.btn.ghost { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.btn.city { background: var(--city); color: #fff; }
.btn svg { width: 16px; height: 16px; }

/* ---------- Header ---------- */
.top { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: end; justify-content: space-between; margin-bottom: 14px; }
.crumb { font-size: .75rem; color: var(--muted); }
.crumb b { color: var(--ink); }
.top h1 { font-family: var(--font-fun); font-weight: 400; font-size: 2.25rem; line-height: 1.05; letter-spacing: .01em; margin-top: 4px; color: var(--navy); }
.top .sub { color: var(--muted); font-size: .8125rem; margin-top: 4px; }
.top .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.count { background: var(--high-sea); color: var(--depth); border-radius: 999px; padding: 1px 7px; font-size: .75rem; }

/* ---------- World map ---------- */
.world { position: relative; background: #cfe6f1; border-radius: var(--radius-lg); overflow: hidden; }
.world > svg { display: block; width: 100%; height: auto; }
.world .land { fill: #f7efdf; stroke: #e2d5bd; stroke-width: .6; }
.world .grat { fill: none; stroke: rgba(255,255,255,.55); stroke-width: .6; }
.world .leg { fill: none; stroke: var(--navy); stroke-width: 2.4; stroke-linecap: round; }
.world .leg.todo { stroke-dasharray: 2 7; stroke: #5d6f8a; }
.world .leg.train { stroke: #3c5949; stroke-dasharray: 10 5; stroke-width: 3; }
.world .leg.train.todo { stroke-dasharray: 2 7; }
.world .stop circle { fill: #fff; stroke: var(--navy); stroke-width: 2.5; }
.world .stop text { font: 700 17px var(--font-ui); fill: var(--navy); paint-order: stroke; stroke: #f7efdf; stroke-width: 5px; stroke-linejoin: round; }
.world .stop { cursor: pointer; }
.world .stop:hover circle, .world .stop.is-on circle { fill: var(--high-sea); }
.world .mover path { fill: var(--navy); }
.world .puff { font: 400 20px var(--font-fun); fill: #3c5949; }
.world-foot { position: absolute; left: 14px; right: 14px; bottom: 12px; display: flex; justify-content: space-between; align-items: end; gap: 8px; flex-wrap: wrap; pointer-events: none; }
.world-foot > * { pointer-events: auto; }
.status-chip { background: rgba(251,248,242,.94); border-radius: var(--radius-sm); padding: 8px 12px; font-size: .8125rem; box-shadow: var(--elev-1); max-width: 520px; }
.status-chip b { font-weight: 600; }

/* City chips */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 2px 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 0; border-radius: var(--radius-md); padding: 8px 14px 9px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); text-align: left; min-width: 118px; }
.chip b { display: block; font-size: .875rem; }
.chip span { font-size: .75rem; color: var(--muted); }
.chip.is-on { background: var(--city); color: #fff; box-shadow: none; }
.chip.is-on span { color: rgba(255,255,255,.85); }
.chip .todo-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--high-sea); margin-left: 6px; vertical-align: 1px; }

/* To book */
details.tobook { margin-top: 10px; background: var(--paper); border-radius: var(--radius-md); box-shadow: inset 0 0 0 1px var(--line); }
details.tobook summary { cursor: pointer; padding: 12px 16px; font-weight: 600; font-size: .875rem; list-style: none; display: flex; justify-content: space-between; gap: 8px; }
details.tobook summary::-webkit-details-marker { display: none; }
details.tobook summary::after { content: "Show"; color: var(--muted); font-weight: 500; }
details.tobook[open] summary::after { content: "Hide"; }
.tobook ul { list-style: none; margin: 0; padding: 0 16px 12px; display: grid; gap: 0; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); column-gap: 24px; }
.tobook li { padding: 8px 0; border-top: 1px solid var(--line); font-size: .8125rem; display: grid; grid-template-columns: 72px 1fr; gap: 8px; }
.tobook li .w { color: var(--high-sea-ink); font-weight: 600; font-size: .75rem; }
.tobook li b { font-weight: 600; }
.tobook li span.d { color: var(--muted); display: block; font-size: .75rem; }

/* ---------- City scene ---------- */
.city { margin-top: 22px; }
.scene { position: relative; border-radius: var(--radius-lg) var(--radius-lg) 0 0; overflow: hidden; aspect-ratio: 800 / 230; min-height: 220px; max-height: 340px; width: 100%; background: var(--city); }
.scene svg.art { position: absolute; inset: 0; width: 100%; height: 100%; }
.scene .title { position: absolute; left: 20px; top: 16px; right: 20px; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.18); }
.scene .title .eyebrow { color: rgba(255,255,255,.9); }
.scene h2 { font-family: var(--font-fun); font-weight: 400; font-size: 2.6rem; line-height: 1; letter-spacing: .01em; margin-top: 4px; }
.scene .facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.scene .facts span { background: rgba(0,0,0,.22); backdrop-filter: blur(4px); border-radius: 999px; padding: 3px 10px; font-size: .75rem; font-weight: 500; }
.daybar { background: var(--city-soft); padding: 10px 12px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
.daybar::-webkit-scrollbar { display: none; }
.daybtn { flex: none; border: 0; background: rgba(255,255,255,.65); border-radius: var(--radius-sm); padding: 6px 12px; font-size: .8125rem; font-weight: 600; color: var(--city-ink); }
.daybtn small { display: block; font-weight: 500; font-size: .6875rem; opacity: .8; }
.daybtn.is-on { background: var(--city-ink); color: #fff; }

/* ---------- Day: list + map ---------- */
.day { display: grid; gap: 16px; margin-top: 16px; }
@media (min-width: 900px) {
  .day { grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); align-items: start; }
  .mapcol { position: sticky; top: 12px; order: 2; }
}
.mapbox { position: relative; background: var(--map-land); border-radius: var(--radius-lg); overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
.mapbox > svg { display: block; width: 100%; height: auto; max-height: 70vh; }
.map-tools { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 6px; align-items: end; }
.map-tools .btn { box-shadow: var(--elev-2); }
.map-note { position: absolute; left: 10px; bottom: 10px; right: 10px; background: rgba(251,248,242,.95); border-radius: var(--radius-sm); padding: 8px 12px; font-size: .8125rem; box-shadow: var(--elev-1); }
.map-note b { font-weight: 600; }
.pin { cursor: pointer; }
.pin circle.b { stroke: #fff; stroke-width: 2.5; }
.pin text { font: 700 12px var(--font-ui); fill: #fff; pointer-events: none; }
.pin.is-on circle.b { stroke: var(--ink); stroke-width: 3; }
.pin .halo { fill: var(--city); opacity: 0; }
.pin.is-on .halo { opacity: .25; }
.lbl { font: 600 11px var(--font-ui); fill: #7d7461; letter-spacing: .06em; text-transform: uppercase; }
.lbl.water { fill: #4f8aa6; font-style: italic; text-transform: none; letter-spacing: .02em; font-weight: 500; }
.transit-lbl { font: 600 10px var(--font-ui); }
.edge-lbl { font: 600 11px var(--font-ui); fill: var(--ink); paint-order: stroke; stroke: var(--map-land); stroke-width: 4px; }
.me { fill: #2f7cf6; stroke: #fff; stroke-width: 3; }
.me-ring { fill: #2f7cf6; opacity: .2; }
.dragon { font: 400 22px var(--font-fun); fill: #3c5949; }

.list { display: grid; gap: 0; }
.stop { display: grid; grid-template-columns: 34px 1fr; gap: 12px; }
.stop .rail { display: flex; flex-direction: column; align-items: center; }
.stop .dot { width: 28px; height: 28px; border-radius: 50%; background: var(--city); color: #fff; font-weight: 700; font-size: .75rem; display: grid; place-items: center; flex: none; margin-top: 12px; border: 0; }
.stop .dot.off { background: var(--muted); }
.stop .dot.stay { background: var(--navy); }
.stop .dot svg { width: 15px; height: 15px; }
.stop .line { flex: 1; width: 2px; background: repeating-linear-gradient(var(--line) 0 5px, transparent 5px 9px); min-height: 12px; }
.stop:last-child .line { display: none; }
.card { background: var(--paper); border-radius: var(--radius-md); padding: 12px 14px; box-shadow: inset 0 0 0 1px var(--line); margin-top: 6px; cursor: pointer; transition: box-shadow .15s; }
.card:hover { box-shadow: inset 0 0 0 1px rgba(23,55,94,.22); }
.stop.is-on .card { box-shadow: inset 0 0 0 2px var(--city); }
.card .row1 { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.card .t { font-size: .75rem; font-weight: 700; color: var(--city-ink); }
.card h3 { font-size: 1rem; font-weight: 600; margin-top: 2px; }
.card p { margin: 3px 0 0; font-size: .8125rem; color: var(--muted); }
.card .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 8px; font-size: .75rem; align-items: center; }
.tag { font-size: .6875rem; font-weight: 600; padding: 2px 8px; border-radius: var(--radius-xs); }
.tag.booked { background: var(--pastel-sage); color: var(--pastel-sage-ink); }
.tag.todo { background: var(--pastel-peach); color: var(--pastel-peach-ink); }
.tag.idea { background: var(--pastel-gold); color: var(--pastel-gold-ink); }
.tag.med { background: var(--pastel-lilac); color: var(--pastel-lilac-ink); }
.price { font-weight: 600; }
.price small { color: var(--muted); font-weight: 500; }
.go { display: flex; align-items: center; gap: 8px; font-size: .75rem; color: var(--muted); padding: 6px 0 2px; }
.go svg { width: 15px; height: 15px; color: var(--ink); }
.go b { color: var(--ink); font-weight: 600; }
.maps-link { font-size: .75rem; font-weight: 600; color: var(--wave); text-decoration: none; }
.maps-link:hover { text-decoration: underline; }

/* ticket */
.ticket { padding: 0; overflow: hidden; }
.ticket .band { display: flex; justify-content: space-between; padding: 8px 14px; background: var(--navy); color: #fff; font-size: .6875rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
.ticket.is-train .band { background: #2f5d46; }
.ticket .body { padding: 10px 14px 6px; display: grid; grid-template-columns: auto 1fr auto; gap: 2px 12px; align-items: center; }
.ticket .iata { font-family: var(--font-fun); font-size: 1.9rem; line-height: 1; color: var(--navy); }
.ticket.is-train .iata { color: #2f5d46; }
.ticket .flight { position: relative; height: 26px; overflow: hidden; }
.ticket .flight::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 2px dashed #b9c0cc; }
.ticket .flight .v { position: absolute; top: 1px; left: 0; width: 26px; height: 24px; color: var(--navy); animation: fly 4.5s ease-in-out infinite; }
.ticket.is-train .flight .v { color: #2f5d46; animation: fly 6s linear infinite; }
.ticket .hm { font-size: .75rem; color: var(--muted); }
.ticket .hm b { display: block; font-size: 1rem; color: var(--ink); }
.ticket .hm.r { text-align: right; }
.ticket .perf { border-top: 2px dashed var(--line); margin: 6px 12px 0; position: relative; }
.ticket .perf::before, .ticket .perf::after { content: ""; position: absolute; top: -9px; width: 16px; height: 16px; border-radius: 50%; background: var(--cotton); }
.ticket .perf::before { left: -20px; } .ticket .perf::after { right: -20px; }
.ticket .meta { padding: 8px 14px 10px; margin: 0; }
@keyframes fly { 0% { left: -10%; } 100% { left: 100%; } }

/* special cards */
.landing { background: var(--pastel-sage); box-shadow: none; }
.landing summary { cursor: pointer; list-style: none; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.landing summary::-webkit-details-marker { display: none; }
.landing summary::after { content: "+"; font-size: 1.1rem; line-height: 1; color: var(--pastel-sage-ink); }
.landing[open] summary::after { content: "−"; }
.landing .k { font-size: .6875rem; letter-spacing: .08em; text-transform: uppercase; color: var(--pastel-sage-ink); font-weight: 600; display: block; }
.landing dl { display: grid; grid-template-columns: 26px 1fr; gap: 8px 8px; margin: 10px 0 0; font-size: .8125rem; }
.landing dt svg { width: 18px; height: 18px; color: var(--pastel-sage-ink); margin-top: 1px; }
.landing dd { margin: 0; }
.landing dd b { font-weight: 600; }
.checkin { margin-top: 6px; background: var(--pastel-blue); color: var(--pastel-blue-ink); border-radius: var(--radius-md); padding: 9px 14px; font-size: .8125rem; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.checkin b { color: var(--ink); }
.pen { margin-top: 6px; background: var(--paper); border-radius: var(--radius-md); padding: 12px 14px; box-shadow: inset 0 0 0 1px var(--line); display: grid; grid-template-columns: 30px 1fr; gap: 10px; font-size: .8125rem; }
.pen .av { width: 30px; height: 30px; border-radius: 50%; background: var(--pastel-peach); color: var(--pastel-peach-ink); display: grid; place-items: center; font-weight: 700; }
.pen em { font-style: normal; display: block; font-size: .6875rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.pen .btn { margin-top: 8px; padding: 6px 12px; }
.med-card { background: var(--pastel-lilac); box-shadow: none; }
.med-card .t { color: var(--pastel-lilac-ink); }
.gap-card { background: transparent; box-shadow: inset 0 0 0 1.5px rgba(168,90,12,.45); border-radius: var(--radius-md); }

/* sheets */
.sheet-back { position: fixed; inset: 0; background: rgba(10,21,54,.4); display: grid; place-items: end center; z-index: 20; padding: 16px; }
.sheet { background: var(--paper); border-radius: var(--radius-lg); width: min(520px, 100%); padding: 20px; box-shadow: var(--elev-2); max-height: 85vh; overflow: auto; margin-bottom: env(safe-area-inset-bottom, 0px); }
@media (min-width: 700px) { .sheet-back { place-items: center; } }
.sheet h3 { font-size: 1.125rem; }
.sheet p { font-size: .875rem; color: var(--muted); }
.sheet .driver { background: var(--depth); color: #fff; border-radius: var(--radius-md); padding: 18px; margin: 12px 0; }
.sheet .driver .big { font-size: 1.4rem; font-weight: 700; line-height: 1.25; }
.sheet .driver .addr { font-size: 1.05rem; margin-top: 6px; }
.sheet .driver .phrase { margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.16); font-size: 1rem; }
.sheet .driver .phrase small { display: block; color: rgba(255,255,255,.66); font-size: .75rem; }
.sheet .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.linkbox { font-family: ui-monospace, Menlo, monospace; font-size: .8125rem; background: var(--cotton); border-radius: var(--radius-sm); padding: 10px 12px; margin: 10px 0; word-break: break-all; }
.sheet ul { font-size: .875rem; padding-left: 18px; margin: 6px 0; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--depth); color: #fff; padding: 10px 16px; border-radius: var(--radius-sm); font-size: .8125rem; box-shadow: var(--elev-2); max-width: calc(100% - 32px); z-index: 30; }

/* scene animation helpers */
.a-drive { animation: drive 11s linear infinite; }
.a-drive-rev { animation: driveRev 14s linear infinite; }
.a-bob { animation: bob 3.2s ease-in-out infinite; transform-box: fill-box; }
.a-flap { animation: flap .6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
.a-fall { animation: fall 7s linear infinite; }
.a-rise { animation: rise 6s ease-in infinite; }
.a-shimmer { animation: shimmer 2.4s ease-in-out infinite; }
.a-puff { animation: puff 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
.a-sway { animation: sway 4s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
.a-spin { animation: spin 40s linear infinite; transform-box: fill-box; transform-origin: center; }
.a-blink { animation: blink 2s steps(2) infinite; }
@keyframes drive { from { transform: translateX(-220px); } to { transform: translateX(1100px); } }
@keyframes driveRev { from { transform: translateX(1100px); } to { transform: translateX(-260px); } }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(.45); } }
@keyframes fall { from { transform: translateY(-240px); } to { transform: translateY(40px); } }
@keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-190px); opacity: 0; } }
@keyframes shimmer { 0%,100% { transform: translateY(0); opacity: .5; } 50% { transform: translateY(-6px); opacity: .9; } }
@keyframes puff { 0% { transform: translate(0,0) scale(.4); opacity: .95; } 100% { transform: translate(-30px,-46px) scale(1.5); opacity: 0; } }
@keyframes sway { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2.5deg); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes blink { 0% { opacity: 1; } 100% { opacity: .35; } }
@keyframes pulse { 0% { r: 9; opacity: .35; } 100% { r: 26; opacity: 0; } }
.me-ring { animation: pulse 1.8s ease-out infinite; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

@media (max-width: 600px) {
  .top h1 { font-size: 1.75rem; }
  .scene h2 { font-size: 2rem; }
  .world .stop text { font-size: 24px; }
  .status-chip { font-size: .75rem; }
  .world-foot { position: static; padding: 10px; }
  .ticket .iata { font-size: 1.5rem; }
}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="crumb">Life › Future map › <b>Travel</b></div>
      <h1>Sydney to Seoul, the long way</h1>
      <div class="sub num" id="subline">1 Dec 2026 – 10 Jan 2027 · 7 cities · 2 trains · 6 flights</div>
    </div>
    <div class="acts">
      <button class="btn ghost" type="button" id="btn-share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>Public link</button>
    </div>
  </header>

  <section class="world" aria-label="Route map">
    <svg id="world" role="img" aria-label="World map of the route: Sydney, Kuala Lumpur, Istanbul, Scotland, London, Rome, Seoul"></svg>
    <div class="world-foot">
      <div class="status-chip" id="world-status" aria-live="polite"></div>
      <button class="btn" type="button" id="btn-replay"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Replay the trip</button>
    </div>
  </section>

  <nav class="chips" id="chips" aria-label="Cities"></nav>

  <details class="tobook">
    <summary><span>Still to book <span class="count num" id="todo-count"></span></span></summary>
    <ul id="todo"></ul>
  </details>

  <section class="city" id="city" aria-live="polite"></section>

// ---------------- Money: everything in AUD ----------------
const RATE = { AUD: 1, GBP: 2.02, EUR: 1.72, MYR: 0.35, TRY: 0.036, KRW: 0.0011, CAD: 1.10 }; // rough, replaced by live rates
const aud = n => 'A$' + (Math.round(n) === n ? n.toLocaleString('en-AU') : n.toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
function price(amt, cur) {
  if (!amt) return '';
  if (cur === 'AUD') return `<span class="price">${aud(amt)}</span>`;
  const a = Math.round(amt * RATE[cur]);
  return `<span class="price">≈ ${aud(a)}</span>`;
}

function localProj(b, W) {
  const latc = (b.n + b.s) / 2, kx = Math.cos(latc * Math.PI / 180);
  const k = W / ((b.e - b.w) * kx);
  return { W, H: (b.n - b.s) * k, p: (lat, lon) => [(lon - b.w) * kx * k, (b.n - lat) * k] };
}

function placeMover(i, f) {
  const el = legEls[i], L = el.getTotalLength();
  const p = el.getPointAtLength(f * L), q = el.getPointAtLength(Math.min(L, f * L + 1));
  const ang = Math.atan2(q.y - p.y, q.x - p.x) * 180 / Math.PI;
  const isTrain = G.legs[i].mode === 'train';
  mover.setAttribute('transform', `translate(${p.x},${p.y})`);
  moverPlane.setAttribute('transform', `rotate(${ang}) translate(-12,-12) scale(1.4)`);
  moverPlane.setAttribute('visibility', isTrain ? 'hidden' : 'visible');
  moverTrain.setAttribute('visibility', isTrain ? 'visible' : 'hidden');
  puff.setAttribute('visibility', isTrain && (Date.now() / 400 | 0) % 2 ? 'visible' : 'hidden');
}
function frame(ts) {
  if (anim.t0 && ts < anim.t0) { anim.raf = requestAnimationFrame(frame); return; }
  if (!anim.t0) anim.t0 = ts;
  const i = anim.leg, len = legEls[i].getTotalLength();
  const dur = G.legs[i].mode === 'train' ? 2600 : Math.max(1600, len * 7);
  const f = Math.min(1, (ts - anim.t0) / dur);
  const ease = f < .5 ? 2 * f * f : 1 - Math.pow(-2 * f + 2, 2) / 2;
  placeMover(i, ease);
  if (f >= 1) {
    anim.leg = (i + 1) % legEls.length; anim.t0 = ts + 500;
    $('#world-status').innerHTML = LEG_TEXT[anim.leg];
  }
  anim.raf = requestAnimationFrame(frame);
}
function replay() {
  cancelAnimationFrame(anim.raf); anim = { leg: 0, t0: 0, raf: 0 };
  $('#world-status').innerHTML = LEG_TEXT[0];
  if (reduce) { placeMover(0, .5); return; }
  anim.raf = requestAnimationFrame(frame);
}

// ---------------- City map ----------------
function drawMap() {
  const c = cur.city, d = cur.day, box = $('#mapbox');
  const P = localProj(c.bbox, 600);
  const W = P.W, H = P.H, pad = 18;
  const inB = (lat, lon) => lat <= c.bbox.n && lat >= c.bbox.s && lon >= c.bbox.w && lon <= c.bbox.e;
  const clampPt = (lat, lon) => { const [x, y] = P.p(lat, lon); return [Math.min(W - pad, Math.max(pad, x)), Math.min(H - pad, Math.max(pad, y))]; };
  const line = pts => 'M' + pts.map(([la, lo]) => P.p(la, lo).map(v => v.toFixed(1)).join(',')).join('L');
  let s = `<svg viewBox="0 0 ${W.toFixed(0)} ${H.toFixed(0)}" role="img" aria-label="Map of ${esc(d.label)} in ${esc(c.name)}">`;
  s += `<rect width="100%" height="100%" fill="${c.regional ? 'var(--map-water)' : 'var(--map-land)'}"/>`;
  if (c.regional) s += `<path d="${GEO.scot.land}" fill="var(--map-land)" stroke="#d9ccb2" stroke-width="1"/>`;
  c.parks.forEach(p => s += `<path d="${line(p)}Z" fill="var(--map-park)"/>`);
  c.water.forEach(p => s += `<path d="${line(p)}Z" fill="var(--map-water)"/>`);
  c.rivers.forEach(p => s += `<path d="${line(p)}" fill="none" stroke="var(--map-water)" stroke-width="${c.id === 'LON' || c.id === 'ROM' ? 16 : 6}" stroke-linecap="round" stroke-linejoin="round"/>`);
  c.transit.forEach(t => s += `<path d="${line(t.pts)}" fill="none" stroke="${t.color}" stroke-width="${c.regional ? 3 : 3.5}" ${t.dash ? 'stroke-dasharray="6 5"' : ''} stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>`);
  c.transit.forEach(t => { const [la, lo] = t.pts[Math.floor(t.pts.length / 2)]; const [x, y] = P.p(la, lo); if (!c.regional) s += `<text class="transit-lbl" x="${x + 8}" y="${y - 6}" fill="${t.color}">${esc(t.name)}</text>`; });
  c.labels.forEach(([txt, la, lo, kind]) => { const [x, y] = P.p(la, lo); s += `<text class="lbl ${kind || ''}" x="${x}" y="${y}" text-anchor="middle">${esc(txt)}</text>`; });
  // route
  const pts = d.stops.filter(x => x.lat != null && !x.nopin);
  if (pts.length > 1) {
    const r = pts.map(x => clampPt(x.lat, x.lon));
    s += `<path id="route" d="M${r.map(p => p.map(v => v.toFixed(1)).join(',')).join('L')}" fill="none" stroke="var(--city)" stroke-width="3" stroke-dasharray="${d.train ? '9 5' : '1 7'}" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  // home
  if (c.home) { const [x, y] = clampPt(c.home.lat, c.home.lon); s += `<g transform="translate(${x},${y})"><rect x="-13" y="-13" width="26" height="26" rx="8" fill="var(--navy)" stroke="#fff" stroke-width="2.5"/><g transform="translate(-8,-8)" color="#fff">${I.bed.replace('<svg ', '<svg width="16" height="16" ')}</g></g>`; }
  // pins (reverse so #1 sits on top)
  const pinHtml = [];
  pts.forEach(x => {
    if (x.kind === 'stay' && c.home && Math.abs(x.lat - c.home.lat) < 1e-3) return;
    const off = !inB(x.lat, x.lon);
    const [px, py] = clampPt(x.lat, x.lon);
    const col = x.kind === 'med' ? '#5d4e70' : x.kind === 'stay' ? 'var(--navy)' : off ? '#6b7788' : 'var(--city)';
    let g = `<g class="pin" data-i="${x._i}" transform="translate(${px},${py})" tabindex="0" role="button" aria-label="${esc(x.name)}"><circle class="halo" r="22"/><circle class="b" r="13" fill="${col}"/><text text-anchor="middle" y="4">${x._n ?? ''}</text></g>`;
    if (off) { const right = px > W / 2; g += `<text class="edge-lbl" x="${px + (right ? -18 : 18)}" y="${py + 4}" text-anchor="${right ? 'end' : 'start'}">${esc(x.off || x.name)} →</text>`; }
    pinHtml.push(g);
  });
  s += pinHtml.reverse().join('');
  if (d.train) s += `<g id="mapTrain"><circle r="15" fill="#2f5d46" stroke="#fff" stroke-width="2.5"/><g transform="translate(-10,-10)" color="#fff" fill="#fff">${I.trainR.replace('<svg ', '<svg width="20" height="20" ')}</g><text class="dragon" x="18" y="-12">choo choo</text></g>`;
  if (cur.me && d.me) { const m = pts.find(x => x._n === d.me) || pts[0]; const [x, y] = clampPt(m.lat + 0.0006, m.lon - 0.0008); s += `<circle class="me-ring" cx="${x}" cy="${y}" r="9"/><circle class="me" cx="${x}" cy="${y}" r="8"/>`; }
  s += '</svg>';
  const tools = `<div class="map-tools">${c.home ? `<button class="btn" type="button" id="btn-home">${I.home}Take me home</button>` : `<button class="btn ghost" type="button" id="btn-home">${I.home}No bed booked</button>`}${d.me ? `<button class="btn ghost" type="button" id="btn-me">${I.locate}${cur.me ? 'Hide me' : 'Where am I?'}</button>` : ''}</div>`;
  let note = '';
  if (cur.me && d.me) {
    const i = pts.findIndex(x => x._n === d.me); const nx = pts[i + 1] || pts[i];
    note = `<div class="map-note">Preview: you’re near <b>${esc(pts[i].name)}</b>. Next is <b>${esc(nx.name)}</b>, ${pts[i].go ? pts[i].go[1] + ' min ' + (pts[i].go[0] === 'walk' ? 'walk' : 'by ' + pts[i].go[0]) : 'nearby'}.</div>`;
  } else if (!pts.some(x => inB(x.lat, x.lon))) {
    note = `<div class="map-note">Nothing pinned on this day yet.</div>`;
  }
  box.innerHTML = s + tools + note;
  box.querySelectorAll('.pin').forEach(p => {
    const go = () => selectStop(+p.dataset.i, true);
    p.addEventListener('click', go); p.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  });
  $('#btn-home').addEventListener('click', openHome);
  $('#btn-me')?.addEventListener('click', () => { cur.me = !cur.me; drawMap(); });
  if (d.train) runMapTrain();
  if (cur.stop != null) markStop(cur.stop);
}

function runMapTrain() {
  const route = $('#route'), tr = $('#mapTrain'); if (!route || !tr) return;
  const L = route.getTotalLength(); let t0 = 0;
  const step = ts => {
    if (!document.body.contains(route)) return;
    if (!t0) t0 = ts;
    const f = reduce ? .35 : ((ts - t0) % 9000) / 9000;
    const p = route.getPointAtLength(f * L);
    tr.setAttribute('transform', `translate(${p.x},${p.y})`);
    if (!reduce) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function markStop(i) {
  document.querySelectorAll('.stop').forEach(el => el.classList.toggle('is-on', +el.dataset.i === i));
  document.querySelectorAll('.pin').forEach(el => el.classList.toggle('is-on', +el.dataset.i === i));
}
function selectStop(i, fromMap) {
  cur.stop = i; markStop(i);
  if (fromMap) document.querySelector(`.stop[data-i="${i}"]`)?.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' });
  else if (innerWidth < 900) $('#mapbox').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'nearest' });
}

// ---------------- Sheets ----------------
function sheet(html) {
  const back = document.createElement('div');
  back.className = 'sheet-back';
  back.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}<div class="row"><button class="btn ghost" type="button" data-close>Close</button></div></div>`;
  back.addEventListener('click', e => { if (e.target === back || e.target.closest('[data-close]')) back.remove(); });
  document.addEventListener('keydown', function esc(e) { if (e.key === 'Escape') { back.remove(); document.removeEventListener('keydown', esc); } });
  document.body.appendChild(back);
  back.querySelector('button')?.focus();
  return back;
}
function openHome() {
  const c = cur.city, h = c.home;
  if (!h) { sheet(`<h3>No bed booked in ${c.name} yet</h3><p>Once you add a stay, this button shows the address in the local language, a line to show the driver, and directions from wherever you are.</p>`); return; }
  const link = c.id === 'SEL' ? nmaps(h.lat, h.lon, h.name) : `https://www.google.com/maps/dir/?api=1&destination=${h.lat},${h.lon}`;
  sheet(`<h3>Take me home</h3><p>Show this screen to a driver, or open directions.</p>
    <div class="driver"><div class="big">${esc(h.name)}</div><div class="addr">${esc(h.addr)}</div>${h.phone ? `<div class="addr num" style="opacity:.8">${esc(h.phone)}</div>` : ''}
    ${h.phrase ? `<div class="phrase">${esc(h.phrase[0])}<small>${esc(h.phrase[1])}</small></div>` : ''}</div>
    <div class="row"><a class="btn" href="${link}" target="_blank" rel="noopener">${I.walk}Directions</a><button class="btn ghost" type="button" id="copy-addr">Copy address</button></div>`);
  $('#copy-addr').addEventListener('click', () => navigator.clipboard?.writeText(h.addr).then(() => toast('Address copied'), () => toast('Select the address above to copy it')));
}
$('#btn-share').addEventListener('click', () => {
  const url = 'life-hub.adam-russell.com/t/sydney-to-seoul-k7m2';
  sheet(`<h3>Public link</h3><p>Anyone with this link can follow along.</p><div class="linkbox">${url}</div>
    <p style="margin-bottom:0"><b style="color:var(--ink)">They see:</b> the route map, which city you’re in, the day plans and your last check-in.<br><b style="color:var(--ink)">Hidden:</b> booking codes, costs, the Stelara plan and your diary.</p>
    <div class="row"><button class="btn" type="button" id="copy-link">Copy link</button><button class="btn ghost" type="button" id="kill-link">Turn link off</button></div>`);
  $('#copy-link').addEventListener('click', () => navigator.clipboard?.writeText('https://' + url).then(() => toast('Link copied'), () => toast('Select the link above to copy it')));
  $('#kill-link').addEventListener('click', () => toast('Mockup: the link would stop working straight away.'));
});
document.addEventListener('click', e => { if (e.target.closest('[data-ticket]')) { e.preventDefault(); toast('Opens the saved ticket or booking PDF, available offline.'); } });

// ---------------- Boot ----------------
selectCity('KUL', false, '2');
replay();
</script>
