<!doctype html>
<html lang="en" data-hub="life">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Medical Overview v2 — demo fixture</title>
  <link rel="stylesheet" href="/packages/design-kit/tokens.css">
  <link rel="stylesheet" href="/packages/design-kit/overlays.css">
  <link rel="stylesheet" href="/packages/design-kit/chrome.css">
  <link rel="stylesheet" href="/apps/life/css/app.css">
  <style>
    body { margin: 0; background: var(--bg, #faf8f3); }
    .demo-shell { max-width: 1180px; margin: 0 auto; padding: 24px 16px 80px; }
    .page-header__eyebrow { font: 600 12px/1 system-ui; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    h1 { margin: 4px 0 16px; font-size: var(--text-2xl, 1.75rem); }
  </style>
</head>
<body>
  <div class="demo-shell">
    <p class="page-header__eyebrow">History</p>
    <h1>Medical Overview</h1>
    <section id="body-medical-dashboard" class="dashboard" aria-label="Medical Overview">
      <div class="bloods-top">
        <button type="button" id="medical-back" class="btn btn--secondary">← Body</button>
        <button type="button" id="medical-today" class="btn btn--ghost">Today</button>
      </div>
      <div id="medical-brief-row" class="medical-brief-row" aria-label="Health brief"></div>
      <div id="medical-strip" class="medical-strip" aria-label="Health threads"></div>
      <div class="medical-toolbar">
        <label class="hub-search">
          <span class="visually-hidden">Search visits</span>
          <input id="medical-search" class="hub-search__input" type="search" placeholder="Search visits" autocomplete="off">
        </label>
        <div id="medical-type-host"></div>
        <div id="medical-provider-host"></div>
        <div id="medical-density" class="hub-pills" role="group" aria-label="Timeline zoom">
          <button type="button" class="hub-pills__btn" data-medical-density="weeks">Weeks</button>
          <button type="button" class="hub-pills__btn is-active" data-medical-density="months">Months</button>
          <button type="button" class="hub-pills__btn" data-medical-density="years">Years</button>
        </div>
        <button type="button" id="medical-show-minor" class="btn btn--ghost" aria-pressed="false">Show minor</button>
        <button type="button" id="medical-places" class="btn btn--secondary">Places</button>
        <button type="button" id="medical-add" class="btn btn--primary">Add</button>
      </div>
      <div id="medical-chips" class="hub-chips"></div>
      <p id="medical-empty" class="metric-caption" hidden></p>
      <div class="medical-layout">
        <div id="medical-timeline" class="medical-timeline" aria-label="Medical timeline"></div>
        <aside id="medical-sheet" class="medical-sheet" aria-label="Medical overview" hidden></aside>
      </div>
      <button type="button" id="medical-sheet-close" class="medical-sheet__close" aria-label="Close details">×</button>
    </section>
  </div>
  <script type="module">
    import { buildMedicalModel } from '/apps/life/js/app/medical-model.js';
    import { renderMedical } from '/apps/life/js/app/render-medical.js';

    const cold = { id: 'ep-head-cold', title: 'Head cold', status: 'active', started: '2026-09-23' };
    const today = '2026-09-26';
    const events = [
      {
        record: {
          type: 'medical', id: 'mrcp', date: '2026-09-26', title: 'MRCP — liver / bile ducts',
          record_type: 'Imaging', lane: 'imaging', weight: 'major', status: 'to_book', date_precision: 'tbd',
          notes: 'Ordered 24 Sep'
        }
      },
      {
        record: {
          type: 'medical', id: 'stelara-v', date: '2026-10-22', title: 'Stelara 90mg — maintenance dose',
          record_type: 'Prescription', lane: 'prescription', weight: 'major', status: 'planned',
          cadence_days: 56, notes: 'virtual suppressed in fixture — real upcoming'
        }
      },
      {
        record: {
          type: 'medical', id: 'colo', date: '2027-02-01', title: 'Colonoscopy',
          record_type: 'Surgery/Hospital', lane: 'hospital', weight: 'major', status: 'planned', date_precision: 'month'
        }
      },
      {
        record: {
          type: 'medical', id: 's26', date: '2026-09-26', title: 'Still congested, throat better',
          record_type: 'Symptom', lane: 'symptom', weight: 'minor', episode: cold,
          notes: 'still congested, throat better — sleep poor'
        }
      },
      {
        record: {
          type: 'medical', id: 's24', date: '2026-09-24', title: 'Sore throat, sniffles, poor sleep',
          record_type: 'Symptom', lane: 'symptom', weight: 'minor', episode: cold,
          notes: 'Sore throat, sniffles'
        }
      },
      {
        record: {
          type: 'medical', id: 's23', date: '2026-09-23', title: 'Feeling run down',
          record_type: 'Symptom', lane: 'symptom', weight: 'minor', episode: cold,
          notes: 'possible viral'
        }
      },
      {
        record: {
          type: 'medical', id: 'gastro', date: '2026-09-24', title: 'Gastro follow-up — biologics & liver',
          record_type: 'Consultation', lane: 'appointment', weight: 'major', provider: 'Dr Chris Keily',
          notes: 'Calprotectin 15 — GGT still main concern — MRCP ordered'
        }
      },
      {
        record: {
          type: 'medical', id: 'stelara', date: '2026-08-27', title: 'Stelara 90mg SC',
          record_type: 'Prescription', lane: 'prescription', weight: 'major', cadence_days: 56,
          notes: 'first maintenance dose'
        }
      },
      {
        record: {
          type: 'medical', id: 'bloods-visit', date: '2026-09-17', title: 'Bloods — comprehensive panel',
          record_type: 'Lab Work', lane: 'lab', weight: 'major'
        }
      },
      {
        record: {
          type: 'bloods', id: 'bloods-1', date: '2026-09-17',
          markers: [
            { key: 'ggt', label: 'GGT', value: 233, status: 'High', unit: 'U/L', ref_low: 0, ref_high: 50 },
            { key: 'alt', label: 'ALT', value: 68, status: 'High', unit: 'U/L', ref_low: 0, ref_high: 40 },
            { key: 'calprotectin', label: 'Calprotectin', value: 15, status: 'Normal', unit: 'ug/g', ref_low: 0, ref_high: 50 },
            { key: 'crp', label: 'CRP', value: 2, status: 'Normal', unit: 'mg/L', ref_low: 0, ref_high: 5 }
          ]
        }
      }
    ];

    let selectedId = 'bloods-visit';
    let showMinor = true;
    const root = document;

    function paint() {
      const model = buildMedicalModel({
        events, today, selectedId, showMinor, density: 'months'
      });
      renderMedical(root, model, {
        onSelect: id => { selectedId = id; paint(); },
        onShowMinor: v => { showMinor = v; paint(); },
        onSearch() {},
        onTypeChange() {},
        onProviderChange() {},
        onDensityChange() {},
        onToday() {},
        onAdd() {},
        onClose() { selectedId = null; paint(); },
        onEdit() {},
        onSave() {},
        onCancel() {},
        onAddToTasks() {},
        onJumpUpcoming() {
          document.querySelector('.medical-upcoming')?.scrollIntoView({ block: 'start' });
        },
        onOpenEpisode() {
          document.querySelector('details.medical-band')?.setAttribute('open', '');
          document.querySelector('details.medical-band')?.scrollIntoView({ block: 'center' });
        }
      });
      document.getElementById('body-medical-dashboard').hidden = false;
    }
    paint();
    // Expose for screenshot automation
    window.__medicalDemo = { paint, setSelected(id) { selectedId = id; paint(); } };
  </script>
</body>
</html>
