<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team match — game mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="games.css">
<style>
/* Two more team tokens so 24 students make six teams of four (proposed for the kit) */
:root { --tm-team-5: #3fa9a3; --tm-team-5-soft: #d6efec; --tm-team-6: #d0678e; --tm-team-6-soft: #f6dde6; }

/* ── Board: lobby ─────────────────────────────── */
.tm-title { position: absolute; left: 120px; right: 120px; top: 140px; text-align: center; }
.tm-title h2 { margin: 0; font-size: 104px; font-weight: 800; letter-spacing: -.035em; line-height: 1; }
.tm-title p { margin: 22px auto 0; max-width: 1200px; font-size: 32px; color: var(--stage-muted); text-wrap: balance; }
.tm-teams { position: absolute; left: 120px; right: 120px; top: 440px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
.tm-tcard { border-radius: 28px; padding: 24px 28px 28px; background: var(--stage-card); box-shadow: var(--stage-glow); display: grid; gap: 20px; position: relative; overflow: hidden; }
.tm-tcard::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 8px; background: var(--c); }
.tm-tcard h3 { margin: 0; display: flex; align-items: center; gap: 16px; font-size: 36px; }
.tm-badge { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; background: var(--c); color: #fff; font-weight: 800; font-size: 28px; flex: none; }
.tm-mem { display: flex; gap: 12px; }
.tm-mem .b-avatar { width: 62px; height: 62px; font-size: 22px; }

/* ── Board: race ──────────────────────────────── */
.tm-head { position: absolute; left: 120px; top: 128px; width: 1000px; }
.tm-head .tm-h { margin: 0; font-size: 44px; font-weight: 700; letter-spacing: -.01em; line-height: 1.15; }
.tm-feed { position: absolute; right: 120px; top: 120px; width: 620px; height: 170px; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; overflow: hidden; }
.tm-feed .b-pill { font-size: 24px; flex: none; }
.tm-feed .b-pill i { width: 18px; height: 18px; border-radius: 6px; background: var(--c); }
.tm-feed .b-pill.bad { box-shadow: inset 0 0 0 2px var(--game-wrong); }
.tm-feed .b-pill.win { box-shadow: inset 0 0 0 2px var(--game-gold); }
.tm-ends { position: absolute; left: 400px; width: 1000px; top: 296px; display: flex; justify-content: space-between; font-size: 22px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--stage-muted); }
.tm-track { position: absolute; left: 120px; top: 336px; width: 1280px; display: grid; gap: 12px; }
.tm-lane { display: grid; grid-template-columns: 260px 1fr; align-items: center; gap: 20px; height: 92px; }
.tm-name { display: flex; align-items: center; gap: 14px; min-width: 0; }
.tm-name b { display: block; font-size: 30px; line-height: 1.1; }
.tm-name small { display: block; font-size: 22px; color: var(--stage-muted); letter-spacing: .06em; white-space: nowrap; }
.tm-road { position: relative; height: 92px; border-radius: 24px; background: var(--stage-card); box-shadow: var(--stage-glow); display: grid; grid-template-columns: 64px repeat(12, 1fr) 64px; align-items: center; padding: 0 6px; transition: box-shadow .35s; }
.tm-start { justify-self: center; width: 14px; height: 14px; border-radius: 50%; background: var(--stage-line); }
.tm-cell { height: 46px; margin: 0 3px; border-radius: 12px; background: var(--stage-line); position: relative; overflow: hidden; }
.tm-cell::after { content: ""; position: absolute; inset: 0; background: var(--c); opacity: 0; transform: scaleX(.2); transform-origin: left; transition: opacity .35s, transform .45s var(--ease); }
.tm-cell.on::after { opacity: .6; transform: none; }
.tm-cell:nth-child(5)::before, .tm-cell:nth-child(9)::before { content: ""; position: absolute; right: 6px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: var(--stage-muted); opacity: .5; }
.tm-flag { justify-self: center; color: var(--stage-muted); display: grid; }
.tm-tok { position: absolute; left: 0; top: 14px; width: 64px; height: 64px; z-index: 2; transition: transform .75s var(--ease-spring); }
.tm-tok-in { width: 100%; height: 100%; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 28px; box-shadow: 0 0 0 4px rgba(255,255,255,.9), 0 10px 24px rgba(0,0,0,.35); }
.tm-tok.won .tm-tok-in { font-size: 22px; box-shadow: 0 0 0 5px var(--game-gold), 0 0 36px rgba(242,193,78,.6); }
.tm-ghost { position: absolute; left: 0; top: 14px; width: 64px; height: 64px; border-radius: 50%; background: var(--c); opacity: 0; pointer-events: none; z-index: 1; }
.tm-lane.crash .tm-road { box-shadow: 0 0 0 4px var(--game-wrong), 0 0 50px rgba(212,84,79,.5); }
.tm-boom { position: absolute; top: -26px; left: 0; padding: 4px 16px; border-radius: 999px; background: var(--game-wrong); color: #fff; font-size: 22px; font-weight: 800; white-space: nowrap; z-index: 3; pointer-events: none; }
.tm-stand-h { position: absolute; left: 1460px; top: 296px; font-size: 22px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--stage-muted); }
.tm-stand { position: absolute; left: 1460px; right: 120px; top: 336px; display: grid; gap: 12px; }
.tm-srow { height: 92px; display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 14px; padding: 0 22px 0 18px; border-radius: 24px; background: var(--stage-card); box-shadow: var(--stage-glow); font-size: 28px; font-weight: 700; }
.tm-srow .rk { width: 52px; height: 52px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font-size: 24px; font-weight: 800; }
.tm-srow .st { font-variant-numeric: tabular-nums; color: var(--stage-muted); font-size: 26px; }
.tm-srow.done { box-shadow: 0 0 0 3px var(--game-gold), var(--stage-glow); }
.tm-srow.done .st { color: var(--game-gold); }
[data-board-theme="light"] .tm-srow.done .st { color: var(--pastel-gold-ink); }
.tm-set { position: absolute; left: 120px; bottom: 40px; z-index: 20; display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 0 26px; border-radius: 999px; border: 2px dashed var(--stage-line); background: transparent; color: var(--stage-ink); font-size: 24px; font-weight: 600; }
.tm-set span { font-size: 20px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--stage-muted); }
.tm-set b { color: var(--high-sea); }
.tm-set:hover { background: var(--stage-card); }
.tm-cover { position: absolute; inset: 0; z-index: 16; display: grid; place-items: center; pointer-events: none; }
.tm-cover.paused { background: rgba(10,21,54,.42); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); pointer-events: auto; }
[data-board-theme="light"] .tm-cover.paused { background: rgba(251,248,242,.55); }
.tm-cover b { font-size: 96px; font-weight: 800; letter-spacing: -.03em; }
.tm-count { font-size: 300px; font-weight: 800; line-height: 1; letter-spacing: -.04em; text-shadow: 0 20px 60px rgba(0,0,0,.3); }

/* Teacher insight */
.tm-ins { position: absolute; left: 120px; right: 120px; top: 120px; }
.tm-ins h2 { margin: 0 0 26px; font-size: 48px; letter-spacing: -.01em; }
.tm-ins-grid { display: grid; grid-template-columns: 1fr 640px; gap: 48px; }
.tm-pair { display: grid; gap: 8px; padding: 16px 26px; border-radius: 22px; background: var(--stage-card); box-shadow: var(--stage-glow); margin-bottom: 12px; }
.tm-pair .ln { display: flex; align-items: baseline; gap: 14px; font-size: 28px; flex-wrap: wrap; }
.tm-pair .ln em { font-style: normal; color: var(--stage-muted); font-size: 24px; }
.tm-pair .meta { display: flex; align-items: center; gap: 18px; font-size: 24px; color: var(--stage-muted); }
.tm-pair .bar { flex: 1; height: 14px; border-radius: 14px; background: var(--stage-line); overflow: hidden; }
.tm-pair .bar i { display: block; height: 100%; border-radius: inherit; background: var(--game-wrong); transform-origin: left; }
.tm-tbl { display: grid; gap: 6px; font-size: 26px; }
.tm-tbl div { display: grid; grid-template-columns: 120px 1fr 1fr 1fr; align-items: center; gap: 10px; padding: 8px 18px; border-radius: 14px; font-variant-numeric: tabular-nums; }
.tm-tbl div:not(.th):nth-child(even) { background: var(--stage-card); }
.tm-tbl .th { font-size: 20px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--stage-muted); }
.tm-tbl .hot { color: var(--game-wrong); font-weight: 700; }
.tm-tbl .who { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.tm-tbl .who i { width: 14px; height: 14px; border-radius: 4px; background: var(--c); }
.tm-foot { margin: 18px 0 0; font-size: 26px; line-height: 1.3; color: var(--stage-muted); max-width: 1040px; }
.tm-anon { position: absolute; left: 160px; right: 160px; top: 160px; text-align: center; }
.tm-anon h2 { margin: 0 0 40px; font-size: 56px; }
.tm-anon .row { display: flex; justify-content: center; align-items: center; gap: 26px; margin: 0 0 24px; font-size: 44px; font-weight: 700; }
.tm-anon .row span { padding: 14px 30px; border-radius: 22px; background: var(--stage-card); box-shadow: var(--stage-glow); }
.tm-anon .row em { font-style: normal; font-size: 30px; color: var(--stage-muted); }

/* ── Phone ────────────────────────────────────── */
.tm-tag { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--soft); color: var(--ink); }
.tm-tag i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.tm-mini { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; }
.tm-mini i { height: 8px; border-radius: 4px; background: rgba(23,55,94,.1); transition: background .3s; }
.tm-mini i.on { background: var(--c); }
.tm-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tm-mate { display: grid; justify-items: center; gap: 3px; padding: 8px 2px; border-radius: 16px; background: #fff; box-shadow: 0 0 0 1px rgba(23,55,94,.08); font-size: 12px; color: var(--muted); transition: transform .3s var(--ease-spring), box-shadow .3s; }
.tm-mate .av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.tm-mate b { font-size: 13px; color: var(--ink); }
.tm-mate.me { box-shadow: 0 0 0 2px var(--c); }
.tm-mate.good { transform: translateY(-4px); box-shadow: 0 0 0 2px var(--game-right); background: #e3f4ea; }
.tm-mate.bad { transform: translateY(-4px); box-shadow: 0 0 0 2px var(--game-wrong); background: #fbe7e6; }
.tm-q { padding: 18px; border-radius: 22px; background: #fff; box-shadow: 0 0 0 1px rgba(23,55,94,.08), 0 8px 24px rgba(20,35,70,.06); }
.tm-q .eb { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--high-sea-ink); }
.tm-q p { margin: 8px 0 0; font-size: 20px; font-weight: 700; line-height: 1.3; color: var(--navy); }
.tm-hint { margin: 0; font-size: 14px; color: var(--muted); text-align: center; }
.tm-dock-l { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.tm-opt { justify-content: center; text-align: center; font-size: 18px; min-height: 60px; }
.tm-flash { position: absolute; inset: 0; pointer-events: none; z-index: 25; opacity: 0; }
.tm-flash.good { background: radial-gradient(circle at 50% 85%, rgba(63,174,115,.55), rgba(63,174,115,.12) 70%); }
.tm-flash.bad { background: radial-gradient(circle at 50% 85%, rgba(212,84,79,.6), rgba(212,84,79,.14) 70%); }
.tm-wait { flex: 1; display: grid; place-items: center; text-align: center; gap: 12px; }
.tm-big { font-size: 56px; font-weight: 800; color: var(--navy); line-height: 1; letter-spacing: -.02em; }
.tm-you { display: grid; justify-items: center; gap: 14px; padding: 28px 20px; border-radius: 28px; background: var(--soft); text-align: center; }
.tm-you .tm-badge { width: 84px; height: 84px; border-radius: 24px; font-size: 40px; }
.tm-bob { animation: tmBob 2.8s ease-in-out infinite; }
@keyframes tmBob { 50% { transform: translateY(-8px); } }
.tm-break { display: grid; gap: 8px; padding: 16px; border-radius: 20px; background: #fff; box-shadow: 0 0 0 1px rgba(23,55,94,.1); font-size: 15px; }
.tm-break div { display: flex; justify-content: space-between; gap: 12px; }
.tm-break div span:last-child { font-weight: 700; text-align: right; }
.tm-paused { position: absolute; inset: 0; z-index: 28; display: grid; place-items: center; background: rgba(251,248,242,.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-size: 24px; font-weight: 700; color: var(--navy); }
</style>
</head>
<body>
<script src="games.js"></script>
<script>
const TEAMS = [...GM.teams,
  { id: 't5', name: 'Wrens', colour: 'var(--tm-team-5)', soft: 'var(--tm-team-5-soft)' },
  { id: 't6', name: 'Magpies', colour: 'var(--tm-team-6)', soft: 'var(--tm-team-6-soft)' }
].map((t) => ({ ...t, mark: t.name[0] }));
const T = (id) => TEAMS.find((t) => t.id === id);
const MY = 't1', GOAL = 12;
const PACE = { t2: 1.25, t3: 1, t4: .8, t5: 1.1, t6: .7 };
const ITEMS = [
  { p: '“The lamps guttered and sighed as Doctor Hask walked past.”', a: 'Personification', lures: ['Pathetic fallacy', 'Onomatopoeia'] },
  { p: 'The storm breaks on the night Ellis disappears from the house.', a: 'Pathetic fallacy', lures: ['Foreshadowing', 'Personification'] },
  { p: 'Mira swears she hides nothing, then keeps Ellis’s letter from us for three chapters.', a: 'Unreliable narrator', lures: ['Dramatic irony', 'Direct address'] },
  { p: 'We know the cellar door is unlocked. Sister Agnes does not.', a: 'Dramatic irony', lures: ['Foreshadowing', 'Unreliable narrator'] },
  { p: 'Old Tobin’s spade leans by the gate in chapter 1. In chapter 9, he digs.', a: 'Foreshadowing', lures: ['Symbolism', 'Analepsis'] },
  { p: 'Mira counts twelve stairs every night. Tonight there are thirteen.', a: 'The uncanny', lures: ['Foreshadowing', 'Paradox'] },
  { p: '“Silent, sullen, the stone stairs slept.” Which sound device leads?', a: 'Sibilance', lures: ['Onomatopoeia', 'Personification'] },
  { p: '“A house full of light that keeps us all in the dark.”', a: 'Paradox', lures: ['Metaphor', 'Symbolism'] },
  { p: '“Doctor Hask’s cure was a cage with softer bars.”', a: 'Metaphor', lures: ['Symbolism', 'Paradox'] },
  { p: 'Mira’s lantern burns brightest whenever she thinks of escape.', a: 'Symbolism', lures: ['Metaphor', 'Pathetic fallacy'] },
  { p: 'Chapter 6 drops us back into the night of the fire, years before.', a: 'Analepsis', lures: ['Foreshadowing', 'The uncanny'] },
  { p: 'Ellis runs from the house. Mira stays to keep its lamps lit.', a: 'Foil', lures: ['Paradox', 'Symbolism'] },
  { p: '“Reader, I should have run while the gate still opened.”', a: 'Direct address', lures: ['Unreliable narrator', 'Foreshadowing'] },
  { p: '“Clack. The shutter. Clack again.” What are the words “clack” doing?', a: 'Onomatopoeia', lures: ['Sibilance', 'Personification'] }
];
const ANSWERS = ITEMS.map((i) => i.a);
const FLAG = '<svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true"><path d="M5 3v18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M6 4h6v4H6zM12 8h6v4h-6z" fill="currentColor"/><path d="M12 4h6v4h-6zM6 8h6v4H6z" fill="currentColor" opacity=".35"/></svg>';
const ORD = (n) => n + (['st', 'nd', 'rd'][n - 1] || 'th');

let S;
function fresh() {
  if (S) { S.timers.forEach(clearTimeout); clearInterval(S.sim); }
  S = { gen: (S ? S.gen : 0) + 1, phase: 'lobby', mode: 'back3', step: {}, places: [], busy: {}, members: {}, timers: [], paused: false, my: { round: 0, queue: GM.shuffle(ITEMS), log: [], cur: null } };
  TEAMS.forEach((t) => { S.step[t.id] = 0; });
  dealTeams();
}
// Timers that die on restart and wait while paused
function later(fn, ms) {
  const g = S.gen;
  const run = () => { if (g !== S.gen) return; if (S.paused) { S.timers.push(setTimeout(run, 300)); return; } fn(); };
  S.timers.push(setTimeout(run, ms));
}
function dealTeams() {
  const others = GM.shuffle(GM.class.filter((c) => c !== GM.me));
  TEAMS.forEach((t, i) => { S.members[t.id] = i === 0 ? [GM.me, ...others.slice(0, 3)] : others.slice(3 + (i - 1) * 4, 3 + i * 4); });
}
const backLabel = () => (S.mode === 'back3' ? 'Back 3' : 'Back to start');

const { board, phone } = GM.scaffold({
  title: '<b>Team match</b> · The Lantern House',
  note: '<b>How to use:</b> you are JW on the Kestrels. Your team sees the same question; the 12 answers are split across four phones and you hold 3. If the answer is on your phone, tap it. If it isn’t, leave it: a teammate will tap theirs. A wrong tap by anyone sends the team back (the dashed teacher chip switches Back 3 / Back to start). The other five teams are simulated.',
  onRestart: () => { fresh(); renderLobby(true); renderPhone('lobby'); }
});

// ── Board helpers ─────────────────────────────────
const clear = () => board.querySelectorAll('.stage-x').forEach((n) => n.remove());
function setControls(html) {
  board.querySelector('.board-controls')?.remove();
  if (html) board.insertAdjacentHTML('beforeend', `<div class="stage-x board-controls">${html}</div>`);
}
const chipHTML = () => `<button class="stage-x tm-set" data-a="mode" title="Teacher setting"><span>Teacher setting</span>Wrong tap: <b>${backLabel()}</b></button>`;
function cover(html, cls = '') {
  board.querySelector('.tm-cover')?.remove();
  if (html != null) board.insertAdjacentHTML('beforeend', `<div class="stage-x tm-cover ${cls}">${html}</div>`);
  return board.querySelector('.tm-cover');
}
function flipOrder(box, nodes) {
  const s = (board.getBoundingClientRect().width / 1920) || 1;
  const first = new Map(nodes.map((n) => [n, n.getBoundingClientRect().top]));
  nodes.forEach((n) => box.appendChild(n));
  if (GM.calm()) return;
  nodes.forEach((n) => { const dy = (first.get(n) - n.getBoundingClientRect().top) / s; if (Math.abs(dy) > 1) n.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }], { duration: 650, easing: 'cubic-bezier(.22,1,.36,1)' }); });
}

// ── Lobby ─────────────────────────────────────────
function renderLobby(anim) {
  clear();
  board.insertAdjacentHTML('beforeend', `<div class="stage-x tm-title"><span class="b-eyebrow">Teams of four · race to ${GOAL}</span><h2>Team match</h2><p>Same question on every phone in your team. Only one phone holds the answer. Talk first, then tap.</p></div>
    <div class="stage-x tm-teams">${TEAMS.map((t) => `<div class="tm-tcard" style="--c:${t.colour}"><h3><span class="tm-badge">${t.mark}</span>${t.name}</h3><div class="tm-mem">${S.members[t.id].map((c) => `<span class="b-avatar" style="${GM.avatarStyle(c)}">${c}</span>`).join('')}</div></div>`).join('')}</div>
    ${chipHTML()}`);
  setControls('<button class="bctl" data-a="shuffle">Shuffle teams</button><button class="bctl primary" data-a="start">Start race</button>');
  if (anim && !GM.calm()) {
    board.querySelector('.tm-title').animate([{ opacity: 0, transform: 'translateY(30px) scale(.96)' }, { opacity: 1, transform: 'none' }], { duration: 700, easing: 'cubic-bezier(.22,1,.36,1)' });
    board.querySelectorAll('.tm-tcard').forEach((n, k) => n.animate([{ opacity: 0, transform: 'translateY(40px)' }, { opacity: 1, transform: 'none' }], { duration: 600, delay: 150 + k * 80, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'backwards' }));
    board.querySelectorAll('.tm-mem .b-avatar').forEach((n, k) => n.animate([{ opacity: 0, transform: 'translateY(-60px) scale(.4)' }, { opacity: 1, transform: 'none' }], { duration: 650, delay: 400 + k * 45, easing: 'cubic-bezier(.34,1.56,.64,1)', fill: 'backwards' }));
  }
}

async function startRace() {
  S.phase = 'count'; setControls(''); renderPhone('count');
  const g = S.gen;
  for (const n of ['3', '2', '1', 'Go']) {
    if (g !== S.gen) return;
    const c = cover(`<span class="tm-count">${n}</span>`);
    if (!GM.calm()) c.firstElementChild.animate([{ opacity: 0, transform: 'scale(1.6)' }, { opacity: 1, transform: 'scale(1)', offset: .35 }, { opacity: 0, transform: 'scale(.85)' }], { duration: 760, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'forwards' });
    n === 'Go' ? GM.sound.ding() : GM.sound.tick();
    await GM.sleep(780);
  }
  if (g !== S.gen) return;
  cover(null);
  S.phase = 'race'; renderRace();
  S.sim = setInterval(simTick, 1100);
  nextRound();
}

// ── Race ──────────────────────────────────────────
const laneEl = (id) => board.querySelector(`.tm-lane[data-t="${id}"]`);
const laneHTML = (t) => `<div class="tm-lane" data-t="${t.id}" style="--c:${t.colour}">
  <div class="tm-name"><span class="tm-badge">${t.mark}</span><span><b>${t.name}</b><small>${S.members[t.id].join(' ')}</small></span></div>
  <div class="tm-road"><i class="tm-start"></i>${Array.from({ length: GOAL }, (_, k) => `<i class="tm-cell ${k < S.step[t.id] ? 'on' : ''}"></i>`).join('')}<i class="tm-flag">${FLAG}</i>
  <div class="tm-tok"><div class="tm-tok-in">${t.mark}</div></div></div></div>`;
function renderRace() {
  S.view = 'race'; clear();
  board.insertAdjacentHTML('beforeend', `<div class="stage-x tm-head"><span class="b-eyebrow">Race to ${GOAL}</span><p class="tm-h">Talk first. Only one phone on each team holds the answer.</p></div>
    <div class="stage-x tm-feed"></div>
    <div class="stage-x tm-ends"><span>Start</span><span>Finish</span></div>
    <div class="stage-x tm-track">${TEAMS.map(laneHTML).join('')}</div>

function nextRound() {
  if (S.phase !== 'race' || S.places.includes(MY)) return;
  const it = S.my.queue[S.my.round % S.my.queue.length]; S.my.round++;
  const fill = GM.shuffle(ANSWERS.filter((a) => a !== it.a && !it.lures.includes(a))).slice(0, 12 - 1 - it.lures.length);
  const opts = GM.shuffle([it.a, ...it.lures, ...fill]);
  const hands = [0, 1, 2, 3].map((k) => opts.slice(k * 3, k * 3 + 3));
  let holder = hands.findIndex((h) => h.includes(it.a));
  // When the answer is elsewhere, make sure a near-miss sits on your phone: that is the talk
  if (holder !== 0 && !hands[0].some((o) => it.lures.includes(o))) {
    const lure = it.lures[0], hi = hands.findIndex((h) => h.includes(lure)), j = hands[hi].indexOf(lure);
    [hands[0][0], hands[hi][j]] = [hands[hi][j], hands[0][0]];
    holder = hands.findIndex((h) => h.includes(it.a));

  const cur = S.my.cur = { it, hands, holder, done: false };
  renderPhone('play', true);
  const mates = S.members[MY];
  if (S.my.round === 4 && holder !== 0) {
    // scripted: a teammate believes their own option is right
    const k = [1, 2, 3].find((x) => x !== holder);
    later(() => teamTap(k, hands[k].find((o) => it.lures.includes(o)) || hands[k][0]), 2300);
  } else if (holder !== 0) later(() => teamTap(holder, it.a), 2600 + GM.rand() * 1800);
  else later(() => { if (!cur.done && S.my.cur === cur) GM.toast(phone, `<span>${mates[1 + Math.floor(GM.rand() * 3)]}: “Not on mine. JW, check yours.”</span>`); }, 4200);

function teamTap(k, opt) {

  cur.done = true;

function insightData() {

  if (a === 'anon') anon();
  if (a === 'back') { if (S.phase === 'end') podium(); else { S.view = 'race'; renderRace(); } }
  if (a === 'again') { fresh(); renderLobby(true); renderPhone('lobby'); }
});

fresh(); renderLobby(true); renderPhone('lobby');
</script>
