<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wheel — game mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="games.css">
<style>
/* Board: wheel */
.wf-wheel { position: absolute; left: 80px; top: 170px; width: 640px; height: 640px; transition: opacity .45s, transform .6s var(--ease); }
.wf-wheel svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 24px 50px rgba(0,0,0,.35)); }
.board.wf-dim .wf-wheel { opacity: .04; transform: scale(.92); }
.wf-ptr { transform-box: fill-box; transform-origin: 50% 0; }
.wf-hl { animation: wfHl 1s ease-in-out 3; }
@keyframes wfHl { 50% { opacity: .55; } }
.wf-stamp { position: absolute; left: 50%; top: 50%; padding: 18px 36px; border-radius: 22px; background: var(--depth); color: #fff; font-size: 64px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; box-shadow: 0 0 0 6px var(--game-wrong), 0 30px 60px rgba(0,0,0,.4); transform: translate(-50%, -50%) rotate(-8deg); opacity: 0; pointer-events: none; }

/* Board: side panel (letter question, solved card, explain) */
.wf-panel { position: absolute; left: 80px; top: 140px; width: 640px; height: 690px; border-radius: 32px; padding: 30px 32px; background: var(--stage-card-hi); box-shadow: var(--stage-glow); display: none; flex-direction: column; gap: 16px; z-index: 3; }
.wf-panel.show { display: flex; }
.wf-panel .ring { position: absolute; right: 24px; top: 22px; width: 96px; height: 96px; }
.wf-panel .ring span { font-size: 34px; }
.wf-panel .ring { transition: opacity .4s; }
.wf-panel.closed .ring { opacity: .25; }
.wf-panel .eb { font-size: 22px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--high-sea); padding-right: 110px; display: flex; align-items: center; gap: 10px; }
.wf-panel .eb i { width: 18px; height: 18px; border-radius: 50%; background: var(--tc); flex: none; }
.wf-panel .q { margin: 0; font-size: 32px; font-weight: 700; line-height: 1.2; padding-right: 100px; text-wrap: balance; }
.wf-opts { display: grid; gap: 12px; }
.wf-opt { display: grid; grid-template-columns: 48px 1fr auto; gap: 16px; align-items: center; min-height: 72px; padding: 10px 18px; border-radius: 20px; background: var(--stage-card); box-shadow: inset 0 0 0 1px var(--stage-line); transition: transform .6s var(--ease-spring), opacity .5s, box-shadow .5s, background .5s; }
.wf-opt .key { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; font-size: 24px; font-weight: 700; color: #fff; }
.wf-opt .txt { font-size: 26px; font-weight: 600; line-height: 1.2; }
.wf-opt .n { font-size: 24px; font-weight: 700; color: var(--stage-muted); opacity: 0; transition: opacity .4s; }
.wf-panel.revealed .wf-opt .n { opacity: 1; }
.wf-opt.is-right { transform: scale(1.03); background: rgba(63,174,115,.26); box-shadow: 0 0 0 4px var(--game-right), 0 0 50px rgba(63,174,115,.4); }
.wf-opt.is-wrong { opacity: .35; transform: scale(.97); }
.wf-dots { margin-top: auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 24px; color: var(--stage-muted); }
.wf-dots i { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--stage-line); transition: background .3s, transform .4s var(--ease-spring); }
.wf-dots i.on { background: var(--tc, var(--game-gold)); box-shadow: none; transform: scale(1.15); }
.wf-dots b { color: var(--stage-ink); margin-left: 8px; }
.wf-split { margin-top: auto; display: grid; gap: 12px; }
.wf-split div { display: grid; grid-template-columns: 300px 1fr 80px; gap: 14px; align-items: center; font-size: 22px; color: var(--stage-muted); }
.wf-split div b { color: var(--stage-ink); font-size: 26px; text-align: right; font-variant-numeric: tabular-nums; }
.wf-split .bar { height: 16px; border-radius: 16px; background: var(--stage-line); overflow: hidden; }
.wf-split .bar i { display: block; height: 100%; border-radius: inherit; background: var(--game-right); transform-origin: left; }
.wf-solved { flex: 1; display: grid; place-content: center; justify-items: center; text-align: center; gap: 12px; }
.wf-solved .big { font-size: 110px; font-weight: 700; line-height: 1; letter-spacing: -.03em; color: var(--game-gold); }
[data-board-theme="light"] .wf-solved .big { color: var(--high-sea-ink); }
.wf-solved .who { font-size: 34px; font-weight: 700; display: flex; align-items: center; gap: 12px; }
.wf-solved .who i { width: 24px; height: 24px; border-radius: 50%; background: var(--tc); }
.wf-solved .bank { font-size: 60px; font-weight: 700; font-variant-numeric: tabular-nums; }
.wf-solved p { margin: 0; font-size: 26px; color: var(--stage-muted); max-width: 520px; }
.wf-solved .ring { position: static; }

/* Board: puzzle */
.wf-frame { position: absolute; left: 760px; top: 150px; width: 1080px; height: 416px; padding: 20px 26px; border-radius: 28px; background: linear-gradient(160deg, #1d4a86, #10295a); box-shadow: 0 0 0 4px rgba(242,193,78,.55), 0 30px 70px rgba(0,0,0,.35); overflow: hidden; }
[data-board-theme="light"] .wf-frame { box-shadow: 0 0 0 4px var(--game-gold), 0 20px 50px rgba(20,35,70,.18); }
.wf-grid { display: grid; grid-template-columns: repeat(14, 66px); grid-auto-rows: 88px; gap: 8px; }
.wf-cell { perspective: 700px; }
.wf-cell.e { border-radius: 8px; background: rgba(255,255,255,.06); }
.wf-cell .in { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .7s var(--ease-spring); }
.wf-cell .f, .wf-cell .b { position: absolute; inset: 0; border-radius: 8px; display: grid; place-items: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.wf-cell .f { background: #eef3fb; box-shadow: inset 0 -5px 0 rgba(10,21,54,.14); transition: background .25s, box-shadow .25s; }
.wf-cell .b { background: #fff; color: var(--ink); font-size: 56px; font-weight: 700; transform: rotateY(180deg); box-shadow: inset 0 -5px 0 rgba(10,21,54,.1); }
.wf-cell.lit .f { background: var(--wave); box-shadow: 0 0 30px rgba(91,143,214,.9); }
.wf-cell.on .in { transform: rotateY(180deg); }
.wf-sweep { position: absolute; top: -20px; bottom: -20px; left: -360px; width: 300px; background: linear-gradient(100deg, transparent, rgba(255,240,200,.55), transparent); pointer-events: none; opacity: 0; }
.wf-cat { position: absolute; left: 760px; width: 1080px; top: 590px; display: flex; justify-content: center; }
.wf-cat span { padding: 10px 28px; border-radius: 999px; background: var(--stage-card-hi); box-shadow: var(--stage-glow); font-size: 28px; font-weight: 700; }
.wf-used { position: absolute; left: 760px; width: 1080px; top: 662px; display: flex; justify-content: center; gap: 3px; }
.wf-used span { width: 37px; height: 48px; border-radius: 8px; display: grid; place-items: center; font-size: 26px; font-weight: 700; color: var(--stage-ink); background: var(--stage-card); transition: opacity .3s, background .3s; }
.wf-used span.v { box-shadow: inset 0 -3px 0 var(--game-gold); }
.wf-used span.hit { background: var(--game-gold); color: var(--depth); }
.wf-used span.miss { opacity: .25; text-decoration: line-through; }
.wf-status { position: absolute; left: 760px; width: 1080px; top: 736px; text-align: center; font-size: 30px; color: var(--stage-muted); }
.wf-status b { color: var(--stage-ink); }
.wf-slog { position: absolute; left: 760px; width: 1080px; top: 786px; text-align: center; font-size: 24px; color: var(--stage-muted); }
.wf-slog b { color: var(--stage-ink); }

/* Board: teams */
.wf-teams { position: absolute; left: 80px; top: 856px; width: 1340px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
.wf-team { position: relative; padding: 14px 20px 14px 28px; border-radius: 22px; background: var(--stage-card); box-shadow: var(--stage-glow); display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px; transition: box-shadow .4s, transform .4s var(--ease); }
.wf-team::before { content: ""; position: absolute; left: 0; top: 16px; bottom: 16px; width: 7px; border-radius: 0 7px 7px 0; background: var(--tc); }
.wf-team .nm { font-size: 28px; font-weight: 700; }
.wf-team .cap { display: flex; align-items: center; gap: 8px; font-size: 20px; color: var(--stage-muted); }
.wf-team .cap span { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; box-shadow: 0 0 0 3px var(--game-gold); }
.wf-team .rd { font-size: 44px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.wf-team .bk { font-size: 22px; color: var(--stage-muted); text-align: right; font-variant-numeric: tabular-nums; }
.wf-team.turn { box-shadow: 0 0 0 4px var(--tc), 0 0 40px color-mix(in srgb, var(--tc) 50%, transparent); transform: translateY(-6px); }

/* Board: totals, podium, insight */
.wf-lb { position: absolute; left: 420px; right: 420px; top: 220px; }
.wf-lb h2 { text-align: center; font-size: 44px; margin: 0 0 28px; }
.wf-lb .lb-row { grid-template-columns: 56px 28px 1fr auto auto; }
.wf-lb .sw { width: 28px; height: 28px; border-radius: 50%; background: var(--tc); }
.wf-sum { position: absolute; left: 0; right: 0; top: 150px; text-align: center; font-size: 30px; color: var(--stage-muted); }
.wf-sum b { color: var(--stage-ink); }
.pod .b-avatar.tm { color: #fff; font-size: 48px; }
.wf-ins { position: absolute; left: 100px; right: 100px; top: 120px; }
.wf-ins h2 { margin: 0 0 4px; font-size: 44px; letter-spacing: -.01em; }
.wf-ins .lede { margin: 0; font-size: 26px; color: var(--stage-muted); max-width: 1200px; }
.wf-heat { position: absolute; left: 0; top: 196px; display: grid; grid-template-columns: 1fr 1fr; gap: 0 44px; width: 900px; }
.wf-heat .row { display: grid; grid-template-columns: 40px repeat(3, 1fr); gap: 8px; align-items: center; height: 46px; }
.wf-heat .row .b-avatar { width: 38px; height: 38px; font-size: 14px; }
.wf-heat .row i { height: 38px; border-radius: 9px; display: grid; place-items: center; font-style: normal; font-size: 21px; font-weight: 700; color: var(--depth); font-variant-numeric: tabular-nums; position: relative; }
.wf-heat .row i.no { background: repeating-linear-gradient(135deg, var(--stage-line) 0 6px, transparent 6px 12px); color: var(--stage-muted); }
.wf-heat .row i.out { outline: 3px dashed var(--game-wrong); outline-offset: -3px; background: var(--stage-card-hi); color: var(--stage-ink); }
.wf-heat .row i.sample::after { content: ""; position: absolute; right: 6px; top: 6px; width: 7px; height: 7px; border-radius: 50%; background: rgba(10,21,54,.45); }
.wf-heat .row.hd i { background: none; height: 30px; color: var(--stage-muted); font-size: 20px; }
.wf-side { position: absolute; left: 960px; right: 0; top: 196px; display: grid; gap: 14px; }
.wf-side h3 { margin: 0; font-size: 28px; }
.wf-side .card { padding: 18px 22px; border-radius: 22px; background: var(--stage-card); box-shadow: var(--stage-glow); font-size: 24px; color: var(--stage-muted); display: grid; gap: 10px; }
.wf-side .card b { color: var(--stage-ink); }
.wf-side .pair { display: grid; grid-template-columns: 110px 1fr 70px; gap: 12px; align-items: center; font-size: 22px; }
.wf-side .pair .bar { height: 14px; border-radius: 14px; background: var(--stage-line); overflow: hidden; }
.wf-side .pair .bar i { display: block; height: 100%; border-radius: inherit; }
.wf-legend { position: absolute; left: 0; top: 800px; display: flex; gap: 18px; flex-wrap: wrap; font-size: 20px; color: var(--stage-muted); }
.wf-legend span { display: flex; align-items: center; gap: 8px; }
.wf-legend i { width: 22px; height: 22px; border-radius: 6px; }

/* Phone */
.wf-tp { display: inline-flex; align-items: center; gap: 8px; }
.wf-tp i { width: 12px; height: 12px; border-radius: 50%; background: var(--tc); }
.wf-minibox { background: linear-gradient(160deg, #1d4a86, #10295a); border-radius: 18px; padding: 12px 8px 10px; display: grid; gap: 8px; justify-items: center; }
.wf-minibox > span { color: rgba(255,255,255,.8); font-size: 13px; font-weight: 600; }
.wf-mini { display: grid; gap: 3px; justify-items: center; }
.wf-mini .r { display: flex; gap: 2px; }
.wf-mini i { width: 21px; height: 28px; border-radius: 4px; background: #c9d6ea; font-style: normal; font-weight: 700; font-size: 15px; display: grid; place-items: center; color: var(--ink); }
.wf-mini i.sp { background: none; width: 9px; }
.wf-mini i.on { background: #fff; }
.wf-mini i.new { animation: wfNew .7s var(--ease-spring); }
@keyframes wfNew { from { transform: rotateY(90deg); background: var(--wave); } }
.wf-solve { justify-content: center; text-align: center; color: var(--navy); }
.wf-mysolve { min-height: 48px; display: flex; align-items: center; justify-content: center; text-align: center; border-radius: 16px; background: #e3f4ea; color: var(--success); font-weight: 600; font-size: 15px; padding: 8px 14px; }
.wf-wait { flex: 1; display: grid; place-items: center; text-align: center; gap: 8px; color: var(--muted); padding: 8px 0; }
.wf-wait .big { font-size: 52px; font-weight: 700; color: var(--navy); line-height: 1.05; font-variant-numeric: tabular-nums; }
.wf-wait .mid { font-size: 22px; font-weight: 700; color: var(--navy); line-height: 1.25; }
.wf-hold { position: relative; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; min-height: 64px; font-size: 18px; }
.wf-hold .pw { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: rgba(10,21,54,.18); transform-origin: left; transform: scaleX(0); }
.wf-hold span { position: relative; }
.wf-keys { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.wf-keys button { min-height: 46px; border-radius: 12px; border: 0; background: #fff; box-shadow: 0 0 0 1px rgba(23,55,94,.14); font-size: 18px; font-weight: 700; color: var(--navy); }
.wf-keys button.sel { background: var(--navy); color: #fff; }
.wf-keys button[disabled] { opacity: .3; }
.wf-keys.vw { grid-template-columns: repeat(5, 1fr); }
.wf-keys.vw button { background: var(--pastel-gold); color: var(--pastel-gold-ink); box-shadow: none; }
.wf-keys.vw button.sel { background: var(--navy); color: #fff; }
.wf-lbl { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.wf-break { display: grid; gap: 8px; padding: 16px; border-radius: 20px; background: #fff; box-shadow: 0 0 0 1px rgba(23,55,94,.1); font-size: 15px; }
.wf-break div { display: flex; justify-content: space-between; gap: 12px; }
.wf-break .tot { border-top: 1px solid rgba(23,55,94,.12); padding-top: 8px; font-weight: 700; font-size: 17px; }
.wf-meter { height: 10px; border-radius: 10px; background: rgba(23,55,94,.1); overflow: hidden; }
.wf-meter i { display: block; height: 100%; border-radius: inherit; background: var(--success); }
</style>
</head>
<body>
<script src="games.js"></script>
<script>
const PUZ = [
  { text: 'EVERY LAMP I LIT WAS A DOOR I COULD NOT CLOSE', cat: 'Quote · Mira, chapter 2', line: 'Every lamp I lit was a door I could not close.', short: 'Q1 Mira',
    explain: { q: '“Every lamp I lit was a door I could not close.” Which technique carries the line?', opts: ['Metaphor', 'Paradox', 'Personification', 'Simile'], right: 0, lure: 1 } },
  { text: 'THE DEAD DO NOT WANDER, CHILD. THEY WAIT.', cat: 'Quote · Old Tobin, chapter 5', line: 'The dead do not wander, child. They wait.', short: 'Q2 Tobin',
    explain: { q: 'What does Old Tobin’s line most suggest about him?', opts: ['He is trying to comfort Mira', 'He knows more about the house than he says', 'He does not believe in ghosts', 'He is threatening Mira'], right: 1, lure: 0 } },
  { text: 'A MIND KEPT IN THE DARK GROWS ITS OWN LIGHT', cat: 'Quote · Doctor Hask, chapter 8', line: 'A mind kept in the dark grows its own light.', short: 'Q3 Hask',
    explain: { q: 'Why is Doctor Hask’s line unsettling in context?', opts: ['It promises his patients will recover', 'It hints that Ellis will escape', 'It dresses up keeping patients in the dark as a gift', 'It shows Hask is losing his sight'], right: 2, lure: 0 } }
];
const BANK = [
  { q: '“The corridor swallowed the lamplight.” Which technique?', opts: ['Hyperbole', 'Personification', 'Simile', 'Onomatopoeia'], right: 1, lure: 0 },
  { q: 'Mira hears the stairs creak behind her but sees no one. What does this build?', opts: ['Dramatic irony', 'Suspense', 'Comic relief', 'Resolution'], right: 1, lure: 0 },
  { q: '“Cold as a chapel floor.” Which technique?', opts: ['Metaphor', 'Imagery', 'Simile', 'Personification'], right: 2, lure: 0 },
  { q: 'The lanterns keep returning, dimmer each chapter. What are they?', opts: ['A symbol only once', 'A motif', 'An allegory', 'A red herring'], right: 1, lure: 2 },
  { q: 'Mira says she fears nothing, then cannot open the cellar door. What kind of narrator does this suggest?', opts: ['Naive', 'Omniscient', 'Unreliable', 'Intrusive'], right: 2, lure: 0 },
  { q: '“The house held its breath.” Which technique?', opts: ['Pathetic fallacy', 'Personification', 'Metaphor', 'Hyperbole'], right: 1, lure: 0 },
  { q: 'Mira’s winter story sits inside the story of her old age. What is this?', opts: ['Flashback', 'Subplot', 'Frame narrative', 'Prologue'], right: 2, lure: 0 },
  { q: 'Who warns Mira away from the east wing?', opts: ['Sister Agnes', 'Old Tobin', 'Doctor Hask', 'Ellis Crane'], right: 1, lure: 0 }
];
const SEGS = [300, 700, 400, 'B', 500, 900, 200, 600, 'L', 350, 800, 250, 1000, 450, 150, 550];
const SEGC = ['var(--game-team-1)', 'var(--game-gold)', 'var(--game-team-2)', 'var(--depth)', 'var(--game-team-3)', 'var(--game-team-4)', 'var(--game-team-1)', 'var(--game-team-2)', 'var(--warm-white)', 'var(--game-gold)', 'var(--game-team-3)', 'var(--game-team-4)', 'var(--game-gold)', 'var(--game-team-1)', 'var(--game-team-2)', 'var(--game-team-3)'];
const KEYS = ['k1', 'k2', 'k3', 'k4'], LET = ['A', 'B', 'C', 'D'];
const OFFLINE = ['XN'], ORDER = [1, 2, 3, 0];
const SA = 22.5, R = 300, DT = 1 / 120, FC = 55, FK = .6;
const VOW = 'AEIOU', ALPHA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', VOWEL_COST = 250, SOLVE_BONUS = 500, LOCK_MS = 20000;
const fmt = (n) => (n < 0 ? '−' : '') + Math.abs(n).toLocaleString();
const lettersOf = (s) => [...s].filter((ch) => /[A-Z]/.test(ch));
const normSolve = (s) => String(s || '').toUpperCase().replace(/[^A-Z]/g, '');
const skill = Object.fromEntries(GM.class.map((c) => [c, .45 + GM.rand() * .5]));
let S;

function fresh() {
  if (S) { S.gen++; S.cur?.timer?.stop(); S.solvedRing?.stop(); }
  S = { gen: (S?.gen || 0) + 1, tok: 0, p: 0, theta: 0, turn: 0, simSpins: 0, bankI: 0, firstJWSpin: true, hist: [],
    teams: GM.teams.map((t, i) => ({ ...t, members: GM.class.filter((_, k) => k % 4 === i), round: 0, total: 0, prevTotal: 0, capN: 0 })) };
  newPuzzle();
}
function newPuzzle() {
  Object.assign(S, { shown: new Set(), used: new Set(), solves: {}, locks: {}, first: null, wrong: 0, ex: {}, me: {}, solveOpen: false, pendingSolve: false, cur: null, phase: 'turn' });
  S.teams.forEach((t) => { t.round = 0; });
}
const P = () => PUZ[S.p];
const total = () => lettersOf(P().text).length;
const shownCount = () => lettersOf(P().text).filter((ch) => S.shown.has(ch)).length;
const allShown = () => shownCount() === total();
const teamOf = (c) => S.teams.find((t) => t.members.includes(c));
const myTeam = () => teamOf(GM.me);
const spinTeam = () => S.teams[ORDER[S.turn % 4]];
const live = (t) => t.members.filter((m) => !OFFLINE.includes(m));
// Mockup: JW captains the Otters every turn so you can try spinning and calling; other teams rotate.
const captainOf = (t) => t.id === 't2' ? GM.me : live(t)[t.capN % live(t).length];
const lockLeft = (c = GM.me) => Math.max(0, Math.ceil(((S.locks[c] || 0) - Date.now()) / 1000));
const solvePhase = () => ['turn', 'spinning', 'question', 'qclosed', 'letter', 'revealing', 'solved'].includes(S.phase);

const { board, phone } = GM.scaffold({
  title: '<b>Wheel</b> · The Lantern House',
  note: '<b>How to use:</b> you are JW, captain of the Otters. Hold and release <b>Spin</b> on the phone, answer the letter question with your team, then call a letter. Tap <b>Solve the quote</b> on the phone at any time: a wrong guess locks it for 20 s, and the letters showing when you get it are recorded. Other teams play themselves; the board buttons are the teacher’s.',
  onRestart: restart
});

// ── Wheel SVG ─────────────────────────────────────
const pt = (a, r) => `${(r * Math.sin(a * Math.PI / 180)).toFixed(1)} ${(-r * Math.cos(a * Math.PI / 180)).toFixed(1)}`;
function wheelSvg() {
  const segs = SEGS.map((v, i) => {
    const a0 = i * SA, a1 = a0 + SA, mid = a0 + SA / 2;
    const ink = v === 'B' ? '#fff' : 'var(--depth)';
    const label = v === 'B' ? 'BANKRUPT' : v === 'L' ? 'LOSE A TURN' : v;
    const fs = typeof v === 'number' ? 40 : 22;
    return `<path d="M0 0 L${pt(a0, R)} A${R} ${R} 0 0 1 ${pt(a1, R)} Z" fill="${SEGC[i]}" stroke="rgba(10,21,54,.35)" stroke-width="2"/>
      <text transform="rotate(${mid}) translate(0 ${-R * .6}) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="${fs}" font-weight="700" letter-spacing="${typeof v === 'number' ? -1 : 1}" fill="${ink}">${label}</text>`;
  }).join('');
  const pegs = SEGS.map((_, i) => `<circle cx="${pt(i * SA, R - 10).split(' ')[0]}" cy="${pt(i * SA, R - 10).split(' ')[1]}" r="7" fill="#fff" stroke="rgba(10,21,54,.4)" stroke-width="2"/>`).join('');
  return `<svg viewBox="-330 -340 660 670" role="img" aria-label="Prize wheel">
    <circle r="${R + 16}" fill="var(--depth)" stroke="var(--game-gold)" stroke-width="8"/>

// ── Turn flow ─────────────────────────────────────

  if (p === 'cancel') { S.solveOpen = false; renderPhone(); }
  if (p === 'submit') submitSolve();
  if (b.dataset.ans != null) { S.me.ans = +b.dataset.ans; GM.sound.click(); renderPhone(); }
  if (p === 'lockq' && S.phase === 'question' && S.me.ans != null) { GM.sound.lock(); qAnswered(GM.me, S.me.ans); renderPhone(); }
  if (p === 'lockex' && S.phase === 'explain' && S.me.ans != null) { GM.sound.lock(); qAnswered(GM.me, S.me.ans); renderPhone(); }
  if (b.dataset.l && S.phase === 'letter') { S.me.letter = b.dataset.l; GM.sound.click(); renderPhone(); }
  if (p === 'call' && S.me.letter) callLetter(S.me.letter);
});

function restart() { fresh(); renderStage(true); startTurn(); }
restart();
</script>
