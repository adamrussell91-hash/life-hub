<!doctype html>
<html lang="en" data-hub="tasks">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timeline reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Real kit files. Open this page from the repo (docs/proposals/timeline-reference/) so the paths resolve. -->
<link rel="stylesheet" href="../../../packages/design-kit/tokens.css">
<link rel="stylesheet" href="../../../packages/design-kit/overlays.css">
<link rel="stylesheet" href="../../../packages/design-kit/actions.css">
<link rel="stylesheet" href="../../../packages/design-kit/filters.css">
<style>
/*
 * Timeline reference styles. Every value is a kit token or derives from one with color-mix().
 * In the hub these rules move to apps/tasks/src/styles/timeline.css unchanged (class names too).
 */
*{box-sizing:border-box}
body{margin:0;overflow-x:hidden;font-family:var(--font-ui);color:var(--ink);background:var(--warm-white);-webkit-font-smoothing:antialiased}
.page{max-width:1180px;margin:0 auto;padding:var(--space-8) var(--space-6) var(--space-16)}
.page-header__eyebrow{font-size:var(--text-2xs);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--muted);font-weight:var(--weight-semibold);margin:0}
.page-header__title{font-size:var(--text-xl);letter-spacing:var(--tracking-tight);margin:var(--space-1) 0 var(--space-5);color:var(--navy);font-weight:var(--weight-semibold)}
.ref-controls{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center;margin:0 0 var(--space-4);font-size:var(--text-xs);color:var(--muted)}
.ref-controls .btn{min-height:2rem;font-size:var(--text-xs);padding:var(--space-1) var(--space-3)}

/* Toolbar */
.tl-toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-3)}
.tl-toolbar__group{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2)}
.tl-toggle{border:1px solid var(--line);background:var(--glass);border-radius:var(--radius-full);min-height:2.2rem;padding:0 var(--space-3);font:var(--weight-medium) var(--text-sm)/1 var(--font-ui);color:var(--muted);cursor:pointer;transition:background-color .12s,color .12s,border-color .12s}
.tl-toggle:hover{color:var(--ink)}
.tl-toggle[aria-pressed="true"]{border-color:color-mix(in srgb,var(--wave) 45%,transparent);background:color-mix(in srgb,var(--pastel-blue) 55%,#fff);color:var(--pastel-blue-ink);font-weight:var(--weight-semibold)}
.tl-toggle--critical[aria-pressed="true"]{color:var(--high-sea-ink);background:color-mix(in srgb,var(--high-sea) 14%,transparent);border-color:color-mix(in srgb,var(--high-sea) 30%,transparent)}
.tl-plus{width:2.5rem;height:2.5rem;border-radius:var(--radius-full);border:1px solid var(--line);background:var(--glass);color:var(--navy);display:inline-grid;place-items:center;cursor:pointer;box-shadow:var(--elev-1)}
.tl-plus svg{width:1.125rem;height:1.125rem;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}

/* Banner and Hammond tray */
.tl-banner{display:flex;align-items:center;gap:var(--space-3);margin:0 0 var(--space-3);padding:var(--space-3) var(--space-4);border-radius:var(--radius-sm);background:var(--warning-surface);border:1px solid color-mix(in srgb,var(--high-sea-ink) 18%,transparent);font-size:var(--text-sm);color:var(--ink)}
.tl-banner b{font-weight:var(--weight-semibold)}
.tl-banner span{flex:1;min-width:12rem}
.tl-banner .btn{min-height:2.25rem;font-size:var(--text-sm)}
.tl-tray{display:flex;align-items:center;gap:var(--space-3);margin:0 0 var(--space-3);padding:var(--space-3) var(--space-4);border-radius:var(--radius-sm);background:var(--paper);border:1px solid var(--line);box-shadow:var(--elev-2);opacity:0;transform:translateY(-6px);transition:opacity .22s cubic-bezier(.2,.8,.2,1),transform .22s cubic-bezier(.2,.8,.2,1)}
.tl-tray.is-in{opacity:1;transform:none}
.tl-avatar{width:28px;height:28px;flex:0 0 28px;border-radius:50%;background:var(--navy);color:#fff;font:var(--weight-semibold) var(--text-xs)/28px var(--font-ui);text-align:center}
.tl-tray__text{flex:1;min-width:12rem;font-size:var(--text-sm);line-height:var(--leading-snug)}
.tl-tray__text b{font-weight:var(--weight-semibold)}
.tl-tray__text span{color:var(--muted)}
.tl-tray .btn{min-height:2.25rem;font-size:var(--text-sm)}

/* Card and frame */
.tl-card{position:relative;background:var(--hub-glass-fill);border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--hub-elev-card);backdrop-filter:blur(var(--hub-glass-blur));overflow:hidden}
.tl-view[hidden],.tl-banner[hidden],.tl-tray[hidden]{display:none}
.tl-frame{display:grid;grid-template-columns:var(--tl-label-w,208px) minmax(0,1fr)}
.tl-labels{position:relative;border-right:1px solid var(--line);background:color-mix(in srgb,var(--paper) 55%,transparent);z-index:2}
.tl-labels__head{position:absolute;top:0;left:0;right:0;height:64px;display:flex;align-items:flex-end;padding:0 var(--space-4) 10px;font-size:var(--text-2xs);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--muted);font-weight:var(--weight-semibold);border-bottom:1px solid var(--line)}
.tl-label{position:absolute;left:0;right:0;top:var(--tl-top,72px);display:flex;align-items:center;gap:6px;padding:0 var(--space-3) 0 calc(var(--space-2) + var(--depth,0) * 14px);font-size:var(--text-sm);color:var(--ink);white-space:nowrap;will-change:transform}
.tl-label__text{overflow:hidden;text-overflow:ellipsis;min-width:0}
.tl-label--goal .tl-label__text,.tl-label--group .tl-label__text{font-size:var(--text-2xs);letter-spacing:var(--tracking-caps);text-transform:uppercase;font-weight:var(--weight-semibold);color:var(--navy)}
.tl-label--project .tl-label__text{font-weight:var(--weight-semibold)}
.tl-label--step .tl-label__text,.tl-label--milestone .tl-label__text{color:var(--muted)}
.tl-label--dream .tl-label__text{color:var(--pastel-gold-ink);font-weight:var(--weight-medium)}
.tl-label__dot{width:8px;height:8px;border-radius:3px;flex:0 0 8px}
.tl-label__tag{font-size:var(--text-2xs);font-weight:var(--weight-semibold);letter-spacing:var(--tracking-caps);text-transform:uppercase;background:var(--pastel-gold);color:var(--pastel-gold-ink);border-radius:var(--radius-xs);padding:2px 6px}
.tl-label__count{margin-left:auto;font-size:var(--text-xs);color:var(--muted);font-variant-numeric:tabular-nums}
.tl-chev,.tl-chev-space{width:20px;height:20px;flex:0 0 20px}
.tl-chev{border:0;background:none;padding:0;border-radius:6px;color:var(--shallow);cursor:pointer;display:grid;place-items:center}
.tl-chev:hover{color:var(--muted);background:color-mix(in srgb,var(--navy) 5%,transparent)}
.tl-chev svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.tl-chev.is-open svg{transform:rotate(90deg)}
.tl-scroller{overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scrollbar-width:thin;position:relative}
.tl-svg{display:block;font-family:var(--font-ui);touch-action:pan-y}

/* SVG parts. transform-box is REQUIRED so scale pivots on the mark, not the SVG origin. */
.tl-pop{transform-box:fill-box;transform-origin:center}
.tl-grid{stroke:var(--line);stroke-width:1}
.tl-term{fill:var(--pastel-sage)}
.tl-term--hol{fill:none}
.tl-term__label{font:var(--weight-semibold) var(--text-2xs)/1 var(--font-ui);letter-spacing:var(--tracking-caps);text-transform:uppercase;fill:var(--pastel-sage-ink)}
.tl-term__label--hol{fill:var(--muted)}
.tl-week__label{font:var(--weight-semibold) var(--text-xs)/1 var(--font-ui);fill:var(--ink)}
.tl-week__date{font:var(--weight-regular) var(--text-xs)/1 var(--font-ui);fill:var(--muted);font-variant-numeric:tabular-nums}
.tl-today__line{stroke:var(--wave);stroke-width:1.5;stroke-dasharray:3 3}
.tl-today__pill{fill:var(--wave)}
.tl-today__text{font:var(--weight-semibold) var(--text-xs)/1 var(--font-ui);fill:#fff}

.tl-bar__face{stroke:color-mix(in srgb,var(--navy) 12%,transparent);stroke-width:1;transition:stroke .12s}
.tl-bar__title{font:var(--weight-medium) var(--text-sm)/1 var(--font-ui);fill:var(--ink);pointer-events:none}
.tl-bar__sub{font:var(--weight-regular) var(--text-xs)/1 var(--font-ui);fill:var(--muted);pointer-events:none}
[data-state="blocked"] .tl-bar__sub{fill:var(--danger);font-weight:var(--weight-medium)}
.tl-bar__grip{fill:color-mix(in srgb,var(--navy) 22%,transparent);opacity:0;transition:opacity .12s}
.tl-halo{fill:none;stroke:none}
[data-part="bar"],[data-part="step-bar"]{cursor:grab;outline:none}
[data-part="bar"]:hover .tl-bar__face{stroke:color-mix(in srgb,var(--navy) 28%,transparent)}
[data-part="bar"]:hover .tl-bar__grip{opacity:1}
[data-part="bar"][data-state="done"] .tl-pop{opacity:.45}
[data-part="bar"].is-selected .tl-halo,[data-part="bar"]:focus-visible .tl-halo{fill:color-mix(in srgb,var(--wave) 16%,transparent)}
[data-part="bar"].is-selected .tl-bar__face,[data-part="bar"]:focus-visible .tl-bar__face{stroke:var(--wave);stroke-width:2}
[data-part="bar"].is-dragging{cursor:grabbing}
[data-part="bar"].is-dragging .tl-bar__face{stroke:var(--wave);stroke-width:2}
.tl-pop.is-critical .tl-bar__face{stroke:var(--high-sea-ink);stroke-width:2}
.tl-pop.is-dim{opacity:.35}
.tl-ms{stroke:#fff;stroke-width:2}
.tl-ms__label{font:var(--weight-semibold) var(--text-xs)/1 var(--font-ui);fill:var(--ink)}
.tl-dream{fill:#fff;stroke:var(--pastel-gold-ink);stroke-width:2}
.tl-dream__line{stroke:var(--pastel-gold-ink);stroke-width:2;stroke-dasharray:1 5;stroke-linecap:round;opacity:.7}
.tl-dream__label{font:var(--weight-medium) var(--text-xs)/1 var(--font-ui);fill:var(--pastel-gold-ink)}
.tl-proj__title{font:var(--weight-semibold) var(--text-sm)/1 var(--font-ui);fill:var(--ink);pointer-events:none}
.tl-proj__baseline{fill:var(--muted)}
.tl-band__label{font:var(--weight-medium) var(--text-xs)/1 var(--font-ui);fill:var(--muted)}
.tl-undated{fill:color-mix(in srgb,var(--paper) 70%,transparent);stroke:var(--shallow);stroke-width:1;stroke-dasharray:3 3}
.tl-undated__label{font:var(--weight-medium) var(--text-xs)/1 var(--font-ui);fill:var(--muted)}
[data-part="undated"]{cursor:pointer}
[data-part="undated"]:hover .tl-undated{stroke:var(--muted)}
.tl-curve{stroke:var(--shallow);stroke-width:1.5}
.tl-curve--critical{stroke:var(--high-sea-ink);stroke-width:2.5}
[data-part="curve"].is-dim{opacity:.35}

.tl-wall__edge{stroke:color-mix(in srgb,var(--navy) 30%,transparent);stroke-width:1.5}
.tl-wall__pill rect{fill:var(--navy)}
.tl-wall__pill text{font:var(--weight-semibold) var(--text-xs)/1 var(--font-ui);fill:#fff}
.tl-wall__lock{fill:none;stroke:#fff;stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}

.tl-shadow__edge{fill:color-mix(in srgb,var(--navy) 40%,transparent)}
[data-part="shadow"][data-warn="true"] .tl-shadow{stroke:var(--high-sea-ink);stroke-width:1.5}
[data-part="shadow"][data-warn="true"] .tl-shadow__edge{fill:var(--high-sea-ink)}
.tl-shadow__label{font:var(--weight-medium) var(--text-sm)/1 var(--font-ui);fill:var(--ink)}
.tl-shadow__warn{font:var(--weight-medium) var(--text-xs)/1 var(--font-ui);fill:var(--high-sea-ink)}

.tl-rib--none{fill:color-mix(in srgb,var(--navy) 6%,transparent)}
.tl-rib--some{fill:var(--pastel-gold)}
.tl-rib--evidenced{fill:var(--pastel-sage)}
.tl-rib__n{font:var(--weight-semibold) var(--text-2xs)/1 var(--font-ui)}
.tl-rib__n--none{fill:var(--muted)}
.tl-rib__n--some{fill:var(--pastel-gold-ink)}
.tl-rib__n--evidenced{fill:var(--pastel-sage-ink)}

.tl-load{fill:var(--pastel-blue)}
.tl-load--over{fill:var(--warning-surface);stroke:var(--high-sea-ink);stroke-width:1.5}
.tl-load--wall{fill:url(#tl-hatch)}
.tl-load__val{font:var(--weight-medium) var(--text-xs)/1 var(--font-ui);fill:var(--muted);font-variant-numeric:tabular-nums}
.tl-load__val--over{fill:var(--high-sea-ink);font-weight:var(--weight-semibold)}
.tl-rowtitle{font:var(--weight-semibold) var(--text-2xs)/1 var(--font-ui);letter-spacing:var(--tracking-caps);text-transform:uppercase;fill:var(--navy);paint-order:stroke;stroke:var(--warm-white);stroke-width:4px;stroke-linejoin:round}
.tl-rowtitle--project{font-size:var(--text-sm);letter-spacing:0;text-transform:none;fill:var(--ink)}
.tl-rowtitle--dream{fill:var(--pastel-gold-ink);letter-spacing:0;text-transform:none;font-size:var(--text-xs)}
.tl-card.is-compact .tl-band__label,.tl-card.is-compact .tl-dream__label{opacity:0}
.tl-load-divider{stroke:var(--line);stroke-width:1}
.tl-cap{stroke:var(--navy);stroke-width:1.5;stroke-dasharray:4 3}
[data-part="load-col"]{transform-box:fill-box;transform-origin:50% 100%}
.tl-labels__load{position:absolute;left:0;right:0;padding:0 var(--space-4);display:grid;gap:4px;align-content:start}
.tl-labels__load b{font-size:var(--text-2xs);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--navy);font-weight:var(--weight-semibold)}
.tl-labels__load span{display:flex;align-items:center;gap:6px;font-size:var(--text-xs);color:var(--muted)}
.tl-labels__load i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--pastel-blue)}
.tl-labels__load i.is-cap{height:0;width:14px;border-top:1.5px dashed var(--navy);border-radius:0}
.tl-labels__load i.is-over{background:var(--warning-surface);outline:1.5px solid var(--high-sea-ink);outline-offset:-1.5px}
.tl-labels__load small{font-size:var(--text-xs);color:var(--muted);margin-top:2px}
.tl-load-head{position:absolute;left:0;right:0;display:flex;align-items:center;gap:var(--space-3);padding:0 var(--space-4);font-size:var(--text-2xs);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--muted);font-weight:var(--weight-semibold)}
.tl-load-head small{font-size:var(--text-xs);letter-spacing:0;text-transform:none;font-weight:var(--weight-regular)}

.tl-ghost{stroke:var(--navy);stroke-width:1.5;stroke-dasharray:4 3}
.tl-ghost__chip circle{fill:var(--navy)}
.tl-ghost__chip text{font:var(--weight-semibold) var(--text-2xs)/1 var(--font-ui);fill:#fff}
.tl-garrow{stroke:var(--navy);stroke-width:1.25}
.tl-ripple{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 3}
.tl-ripple--slip{stroke:var(--danger);transform:rotate(45deg);transform-box:fill-box;transform-origin:center}
.tl-ripple__label{font:var(--weight-semibold) var(--text-xs)/1 var(--font-ui);fill:var(--danger)}

/* Lines view inside the card (port of graph-reference/lines.html) */
.tl-lines{padding:var(--space-2) var(--space-6) var(--space-6)}
.tl-line{padding:22px 0 4px;border-top:1px solid var(--line)}
.tl-line:first-child{border-top:0}
.tl-line__name{font:var(--weight-semibold) var(--text-md)/1.2 var(--font-ui);color:var(--ink);margin:0;display:flex;align-items:center;gap:8px}
.tl-line__name i{width:10px;height:10px;border-radius:3px;display:block}
.tl-line__svg{display:block;overflow:visible;margin-top:6px}
.tl-line__lbl{font:var(--weight-medium) 13px/1 var(--font-ui);fill:var(--ink)}
.tl-line__sub{font:var(--weight-regular) 12px/1 var(--font-ui);fill:var(--muted)}
.tl-line__sub.is-here{fill:var(--wave);font-weight:var(--weight-semibold)}
.tl-line__sub.is-danger{fill:var(--danger);font-weight:var(--weight-medium)}
.tl-line__term{font:var(--weight-semibold) 13px/1 var(--font-ui);fill:#fff}

.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (prefers-reduced-motion:reduce){.tl-tray,.tl-chev svg,.tl-toggle{transition:none}}
@media (max-width:720px){
  .page{padding:var(--space-5) var(--space-4) var(--space-12)}
  .tl-frame{grid-template-columns:0 minmax(0,1fr)}
  .tl-labels{overflow:hidden;border-right:0}
  .tl-toolbar{flex-direction:column;flex-wrap:nowrap;align-items:stretch;gap:var(--space-2)}
  .tl-toolbar__group{flex-wrap:nowrap;min-width:0}
  .tl-toolbar__group:first-child{flex-wrap:wrap}
  .tl-toolbar__group:first-child #tl-zoom{flex:1 1 100%;width:100%;min-width:0}
  #tl-zoom .hub-pills__btn{min-width:0;padding-inline:var(--space-1)}
  .tl-toolbar{min-width:0;max-width:100%}
  .tl-toolbar__group:last-child{overflow-x:auto;margin:0 calc(var(--space-4) * -1);padding:0 var(--space-4) var(--space-1);scrollbar-width:none}
  .tl-toolbar__group:last-child>*{flex:0 0 auto}
  .tl-toolbar__group:last-child .tl-plus{margin-left:auto}
  .ref-controls{flex-direction:column;align-items:stretch}
  .tl-banner,.tl-tray{flex-wrap:wrap}
  .tl-tray .btn--primary{margin-left:40px}
  .tl-lines{padding:var(--space-2) var(--space-4) var(--space-4)}
}
</style>
</head>
<body>
<div class="page">
  <p class="page-header__eyebrow">Views</p>
  <h1 class="page-header__title">Timeline</h1>

  <div class="ref-controls">Reference controls (not part of the product):
    <button class="btn btn--secondary" id="ref-live" type="button">Simulate an edit on the Board</button>
    <button class="btn btn--secondary" id="ref-drag" type="button">Simulate dragging Book bus +6 days</button>
  </div>

  <div class="tl-toolbar" data-part="toolbar">
    <div class="tl-toolbar__group">
      <div class="hub-pills" id="tl-zoom" role="group" aria-label="Zoom" data-part="zoom-pills"></div>
      <div class="hub-pills" id="tl-view" role="group" aria-label="View" data-part="view-toggle">
        <span class="hub-pills__thumb"></span>
        <button class="hub-pills__btn" type="button" data-view="bars">Bars</button>
        <button class="hub-pills__btn" type="button" data-view="lines">Lines</button>
      </div>
    </div>
    <div class="tl-toolbar__group">
      <button class="tl-toggle tl-toggle--critical" id="tl-critical" type="button" aria-pressed="false">Critical path</button>
      <button class="tl-toggle" id="tl-load" type="button" aria-pressed="true">Load</button>
      <button class="tl-toggle" id="tl-holidays" type="button">Holidays: compressed</button>
      <button class="tl-toggle" id="tl-today-btn" type="button">Today</button>
      <button class="btn btn--secondary" id="tl-hammond" type="button" style="min-height:2.2rem;font-size:var(--text-sm)">Ask Hammond</button>
      <button class="tl-plus" type="button" aria-label="Add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
  </div>

  <div class="tl-banner" id="tl-banner" data-part="ripple-banner" hidden>
    <span><b>Finals would slip to 09/10/26.</b> Book bus pushes Excursion form past the milestone.</span>
    <button class="btn btn--ghost" type="button">Drop anyway</button>
    <button class="btn btn--primary" type="button">Suggest a fix</button>
  </div>

  <div class="tl-tray" id="tl-tray" data-part="ghost-tray" hidden>
    <div class="tl-avatar" aria-hidden="true">H</div>
    <div class="tl-tray__text"><b>Hammond suggests 3 changes.</b> <span>Clears T4 W2 · nothing moves into a wall · no hard deadlines move</span></div>
    <button class="btn btn--primary" id="tl-apply" type="button">Apply all</button>
    <button class="btn btn--secondary" type="button">Review</button>
    <button class="btn btn--ghost" id="tl-dismiss" type="button">Dismiss</button>
  </div>

  <section class="tl-card" id="tl-card" data-view="bars" data-part="timeline-card">
    <div class="tl-view" id="tl-bars">
      <div class="tl-frame">
        <div class="tl-labels" id="tl-labels"><div class="tl-labels__head">Plan</div>
          <div class="tl-labels__load" id="tl-load-label" data-part="load-legend"><b>Load</b><span><i></i>Committed</span><span><i class="is-cap"></i>Free time</span><span><i class="is-over"></i>Over</span><small>Learning your term rhythm</small></div></div>
        <div class="tl-scroller" id="tl-scroller">
          <svg class="tl-svg" id="tl-svg" role="group" aria-label="Timeline"></svg>
        </div>
      </div>
    </div>
    <div class="tl-view tl-lines" id="tl-lines" hidden></div>
  </section>
  <p class="visually-hidden" id="tl-live" aria-live="polite"></p>
</div>
<script>
/* Generated from ref-src/timeline-ref.ts + apps/tasks/src/views/timeline-motion.ts, timeline-morph.ts and src/domain/school-time.ts. */
(() => {
  // apps/tasks/src/views/timeline-motion.ts
  var MOTION = {
    settle: 420,
    // live update: an entity moves because data changed elsewhere
    zoom: 280,
    // day width changes (zoom pills, wheel, pinch)
    release: 220,
    // a dragged bar settles onto its snapped day
    cascadeStagger: 30,
    // dependants follow a released bar, one after another
    enter: 320,
    // a new bar, curve or chip appears
    exit: 160,
