<!doctype html>
<html lang="en" data-hub="life">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day Dial reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Real kit files. Open from the repo (docs/proposals/calendar-reference/day-dial/) so the paths resolve. -->
<link rel="stylesheet" href="../../../../packages/design-kit/tokens.css">
<link rel="stylesheet" href="../../../../packages/design-kit/overlays.css">

<style>
/* Day Dial reference styles. PORT VERBATIM (from `.dd{` down) to packages/design-kit/calendar-day-dial.css. Tokens only. */
*{box-sizing:border-box}
body{margin:0;overflow-x:hidden;font-family:var(--font-ui);color:var(--ink);background:var(--warm-white);-webkit-font-smoothing:antialiased}
/* Harness only: a stand-in for the Life rail (330px), so every width here matches the app at that width. */
body{display:grid;grid-template-columns:330px minmax(0,1fr)}
.shell-rail{background:var(--navy);color:color-mix(in srgb,#fff 75%,transparent);padding:var(--space-8) var(--space-6);font-size:var(--text-xs);letter-spacing:var(--tracking-caps);text-transform:uppercase;font-weight:var(--weight-semibold)}
.page{width:100%;max-width:1280px;margin:0 auto;padding:var(--space-8) var(--space-6) var(--space-16)}
.page-shell{display:grid;grid-template-columns:1fr}
.page-header__eyebrow{font-size:var(--text-2xs);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--muted);font-weight:var(--weight-semibold);margin:0}
.page-header__title{font-size:var(--text-xl);letter-spacing:var(--tracking-tight);margin:var(--space-1) 0 var(--space-5);color:var(--navy);font-weight:var(--weight-semibold)}
.ref-controls{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center;margin:0 0 var(--space-4);font-size:var(--text-xs);color:var(--muted)}
.ref-controls .btn{min-height:2rem;font-size:var(--text-xs);padding:var(--space-1) var(--space-3)}
@media (max-width:719px){body{display:block}.shell-rail{display:none}.page{padding:var(--space-4) var(--space-4) var(--space-12)}}

.dd{
  --dd-school:color-mix(in srgb,var(--pastel-blue) 80%,#fff);
  --dd-yours:var(--pastel-peach);
  --dd-quiet:color-mix(in srgb,var(--navy) 5%,transparent);
  --dd-track:color-mix(in srgb,var(--navy) 6%,transparent);
  --dd-rule:color-mix(in srgb,var(--navy) 10%,transparent);
  --dd-ghost-fill:color-mix(in srgb,var(--wave) 6%,transparent);
  --dd-ghost-line:color-mix(in srgb,var(--navy) 55%,transparent);
  --dd-health:color-mix(in srgb,var(--sand) 34%,#fff);
  --dd-health-line:color-mix(in srgb,var(--sand),var(--ink) 38%);
  --dd-lilac-line:color-mix(in srgb,var(--pastel-lilac-ink) 72%,#fff);
  position:relative;font-family:var(--font-ui);color:var(--ink);min-width:0;contain:inline-size
}
/* nav */
.dd__nav{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-3);flex-wrap:wrap}
.dd__round{width:2.25rem;height:2.25rem;border-radius:var(--radius-full);border:1px solid var(--line);background:var(--glass);display:inline-grid;place-items:center;color:var(--navy);cursor:pointer}
.dd__round svg{width:1rem;height:1rem;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dd__period{display:grid;line-height:1.2;padding:0 var(--space-1);min-width:0}
.dd__period b{font-size:var(--text-md);font-weight:var(--weight-semibold);color:var(--navy);letter-spacing:var(--tracking-tight);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd__period span{font-size:var(--text-xs);color:var(--muted)}
.dd__spacer{flex:1}
/* card */
.dd__card{background:var(--hub-glass-fill);border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--hub-elev-card);backdrop-filter:blur(var(--hub-glass-blur));-webkit-backdrop-filter:blur(var(--hub-glass-blur));overflow:hidden}
.dd__body{display:grid;grid-template-columns:minmax(0,1fr) 340px}
.dd__dialcell{display:grid;place-items:start center;padding:var(--space-5) 0;min-width:0}
.dd__side{border-left:1px solid var(--line);padding:var(--space-5);display:grid;gap:var(--space-5);align-content:start;min-width:0}
.dd-dial{display:block;font-family:var(--font-ui)} /* width/height set in px at mount: laid out, never scaled */
/* dial parts */
.dd-disc{fill:color-mix(in srgb,#fff 55%,transparent);stroke:var(--dd-rule)}
.dd-ctx--sleep{fill:url(#dd-hatch)}
.dd-ctx--morning,.dd-ctx--after,.dd-ctx--day{fill:var(--dd-quiet)}
.dd-ctx--school{fill:var(--dd-school)}
.dd-ctx--yours{fill:var(--dd-yours)}
.dd-track{fill:none;stroke:var(--dd-track)}
.dd-arc{stroke:#fff;stroke-width:1.5;cursor:pointer}
.dd-arc.k-teaching,.dd-arc.k-fitness{fill:var(--pastel-blue)}
.dd-arc.k-professional{fill:var(--pastel-lilac);stroke:var(--dd-lilac-line);stroke-width:1.2}
.dd-arc.k-health{fill:var(--dd-health);stroke:var(--dd-health-line);stroke-width:1.2}
.dd-arc.k-corey{fill:var(--pastel-peach);stroke:var(--pastel-peach-ink);stroke-width:1.4}
.dd-arc.is-class{fill:color-mix(in srgb,var(--pastel-blue) 70%,#fff)}
.dd-arc.is-proposal{stroke:var(--dd-ghost-line);stroke-width:1.5;stroke-dasharray:4 3}
.dd-arc.is-ghost{fill:var(--dd-ghost-fill);stroke:var(--dd-ghost-line);stroke-width:1.4;stroke-dasharray:3 3}
.dd-arc.is-skipped{opacity:.35}
.dd-arc:focus-visible{outline:none;stroke:var(--wave);stroke-width:2.5;stroke-dasharray:none}
.dd-left{fill:var(--high-sea);opacity:.85}
.dd-log{stroke-width:1.6}
.dd-log.is-meal{fill:var(--pastel-gold);stroke:var(--pastel-gold-ink)}
.dd-log.is-symptom{fill:#fff;stroke:var(--high-sea-ink)}
.dd-log.is-missing{fill:#fff;stroke:var(--pastel-gold-ink);stroke-dasharray:2 2}
.dd-log.is-skin{fill:var(--pastel-sage);stroke:var(--pastel-sage-ink)}
.dd-logring{fill:none;stroke:color-mix(in srgb,var(--navy) 8%,transparent);stroke-dasharray:1 5;stroke-linecap:round}
.dd-tick{stroke:color-mix(in srgb,var(--navy) 30%,transparent)}
.dd-tick.is-major{stroke-width:1.5}
.dd-t-hour{font-size:11.5px;font-weight:600;fill:var(--navy);text-anchor:middle}
.dd-t-ring{font-size:10.5px;font-weight:500;text-anchor:middle}
.dd-t-ring.is-sleep{fill:var(--navy)}.dd-t-ring.is-school{fill:var(--pastel-blue-ink)}.dd-t-ring.is-yours{fill:var(--pastel-peach-ink)}
.dd-lead{stroke:color-mix(in srgb,var(--navy) 22%,transparent);fill:none}
.dd-t-call{font-size:12px;font-weight:600;fill:var(--ink)}
.dd-t-call.is-corey{fill:var(--pastel-peach-ink)}
.dd-t-call.is-symptom{fill:var(--high-sea-ink)}
.dd-t-call.is-meal{fill:var(--pastel-gold-ink)}
.dd-t-sub{font-size:11px;fill:var(--muted)}
.dd-gauge-track{fill:none;stroke:color-mix(in srgb,var(--navy) 8%,transparent)}
.dd-gauge{fill:none;stroke-linecap:round}
.dd-t-caps{font-size:11px;font-weight:600;letter-spacing:.08em;fill:var(--muted);text-anchor:middle}
.dd-t-pct{font-weight:700;letter-spacing:-1.5px;text-anchor:middle;font-variant-numeric:tabular-nums}
.dd-t-note{font-size:12px;fill:var(--muted);text-anchor:middle}
.dd-hand{stroke:var(--danger);stroke-width:2.5;stroke-linecap:round}
.dd-hand-dot{fill:var(--danger)}
.dd-t-now{font-size:11.5px;font-weight:700;fill:var(--danger)}

.dd-tag{display:inline-block;margin-left:6px;font-size:var(--text-2xs);font-weight:var(--weight-semibold);padding:1px 7px;border-radius:6px;background:var(--pastel-gold);color:var(--pastel-gold-ink);vertical-align:2px}
.dd-rows{display:grid}
.dd-row{display:grid;grid-template-columns:56px minmax(0,1fr);gap:var(--space-3);padding:var(--space-3) 0;border-top:1px solid var(--line)}
.dd-row__t{font-size:var(--text-xs);font-weight:var(--weight-semibold);color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px}
.dd-row__w b{display:block;font-size:var(--text-sm);font-weight:var(--weight-semibold);line-height:1.3}
.dd-row__w > span{font-size:var(--text-xs);color:var(--muted)}
.dd-row.is-struck .dd-row__w b{text-decoration:line-through;color:var(--muted)}
.dd-row.k-corey .dd-row__w b{color:var(--pastel-peach-ink)}
.dd-suggest{display:flex;gap:var(--space-2);align-items:flex-start;margin-top:6px;padding:6px 8px;border-radius:10px;background:var(--dd-ghost-fill);border:1.5px dashed var(--dd-ghost-line);font-size:var(--text-xs)}
.dd-acts{display:flex;gap:6px;margin-top:6px}
.dd-acts .btn{min-height:1.75rem;padding:2px var(--space-3);font-size:var(--text-xs)}

.dd-av--sara{background:var(--pastel-sage-ink)}
.dd-mark{display:inline-block;width:14px;height:9px;position:relative;margin-right:3px}
.dd-mark::before,.dd-mark::after{content:"";position:absolute;top:0;width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor}
.dd-mark::before{left:0}.dd-mark::after{left:5px}

.dd-pop__acts{display:flex;gap:var(--space-2);margin-top:var(--space-3)}
.dd-pop__acts .btn{min-height:2rem;padding:var(--space-1) var(--space-3);font-size:var(--text-sm)}

.dd-toast b{font-weight:var(--weight-semibold)}
.dd-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.dd__card{container-type:inline-size}

  .dd__nav .hub-pills[data-part="zoom-pills"]{display:none}
  .dd-toast{left:var(--space-3);right:var(--space-3);bottom:var(--space-3)}
  .dd-pop{left:var(--space-3)!important;right:var(--space-3);width:auto}
  .dd-wd span{display:none}
}
</style>

    engine.to("__toast", { opacity: 1, y: 0 }, { duration: DD.toastInMs });
    clearTimeout(toastTimer);
    toastTimer = window.setTimeout(() => engine.to("__toast", { opacity: 0, y: DD.toastRise }, { duration: DD.toastInMs }), DD.toastHoldMs);
  }
  function ghostInput(g) {
    const { label, meta, chip, overItem, status, ...rest } = g;
    return rest;
  }
  var wait = (ms) => new Promise((r) => setTimeout(r, ms));
  function openPop(arcId) {
    const pop = nodes.get("__pop");
    const item = ITEMS.find((i) => i.id === arcId);
    const g = ghostsNow().find((x) => (x.id === arcId || x.overItem === arcId) && x.status === "pending");
    let html = `<b>${item?.title ?? g?.label ?? ""}</b><p class="dd-pop__meta">${item?.meta ?? g?.meta ?? ""}</p>`;
    if (g) {
      if (g.overItem) html += `<p class="dd-pop__label">${g.agent === "sara" ? "Sara" : "Hammond"} suggests</p><p class="dd-pop__meta">${g.label} \xB7 ${g.meta}</p>`;
      html += `<p class="dd-pop__label">Accept writes</p><p class="dd-pop__writes" data-part="write-preview">${acceptPlan(ghostInput(g), { today: NOW.date }).receipt}</p>`;
      html += `<div class="dd-pop__acts"><button type="button" class="btn btn--primary" data-accept="${g.id}">Accept</button>${g.kind === "bedtime" ? "" : `<button type="button" class="btn btn--ghost" data-dismiss="${g.id}">Dismiss</button>`}</div>`;
    }
    pop.innerHTML = html;
    pop.hidden = false;
    const r = root.getBoundingClientRect();
    const b = nodes.get(`arc:${arcId}`).getBoundingClientRect();
    const room = r.right - b.right;
    pop.style.left = `${Math.max(0, room > DD.popWidth + DD.popGap ? b.right - r.left + DD.popGap : b.left - r.left - DD.popWidth - DD.popGap)}px`;
    pop.style.top = `${b.top - r.top}px`;
    popFor = arcId;
    engine.place("__pop", { opacity: 0, y: DD.popRise });
    engine.to("__pop", { opacity: 1, y: 0 }, { duration: DD.popMs });
  }
  function closePop() {
    if (!popFor) return;
    popFor = null;
    engine.to("__pop", { opacity: 0, y: DD.popRise }, { duration: DD.popMs });
    window.setTimeout(() => {
      if (!popFor) nodes.get("__pop").hidden = true;
    }, DD.popMs);
  }
  async function decide(ghostId, decision) {
    const g = GHOSTS.find((x) => x.id === ghostId);
    if (!g || state.accepted.has(ghostId) || state.dismissed.has(ghostId)) return;
    closePop();
    root.querySelectorAll(`[data-accept="${ghostId}"],[data-dismiss="${ghostId}"]`).forEach((b) => {
      b.disabled = true;
      if (b.dataset.accept) b.textContent = "Saving\u2026";
    });
    const plan = decision === "accept" ? acceptPlan(ghostInput(g), { today: NOW.date }) : null;
    await wait(DD.saveLatencyMs);
    (decision === "accept" ? state.accepted : state.dismissed).add(ghostId);
    const host = root.parentElement;
    mount(host, mountOptions, { entrance: false });
    showToast(plan ? `<b>Written.</b> ${plan.receipt}` : "<b>Dismissed.</b> Nothing written.");
    nodes.get("__live").textContent = plan ? plan.receipt : "Dismissed. Nothing written.";
  }
  function setDay(date) {
    if (!WEEK.includes(date) || date === state.day) return;
    state.day = date;
    const host = root.parentElement;
    mount(host, mountOptions, { entrance: false });
    engine.place("__sweep", { h: 0 });
    engine.to("__sweep", { h: 24 }, { duration: DD.daySwitchMs, easing: EASE });
    engine.place("__gauge", { v: 0 });
    engine.to("__gauge", { v: CAP.get(date).pct }, { duration: DD.daySwitchMs, easing: EASE });
    nodes.get("__live").textContent = `${dayLabel(date)}, capacity ${CAP.get(date).pct}%`;
    nodes.get(`wd:${date}`)?.focus({ preventScroll: true });
  }
  function wire(r) {
    r.addEventListener("click", (e) => {
      const t = e.target;
      const acc = t.closest("[data-accept]");
      if (acc) return void decide(acc.dataset.accept, "accept");
      const dis = t.closest("[data-dismiss]");
      if (dis) return void decide(dis.dataset.dismiss, "dismiss");
      const day = t.closest("[data-day]");
      if (day) return setDay(day.dataset.day);
      const step = t.closest("[data-step]");
      if (step) return setDay(WEEK[WEEK.indexOf(state.day) + Number(step.dataset.step)]);
      if (t.closest("[data-today]")) return setDay(NOW.date);
      if (t.closest("[data-linear]")) return showToast("<b>Linear</b> opens the Tideline one-day view in the hub.");
      const arc = t.closest(".dd-arc[data-id]");
      if (arc) {
        const id = arc.getAttribute("data-id");
        return id === popFor ? closePop() : openPop(id);
      }
      if (!t.closest('[data-part="popover"]')) closePop();
    });
    r.addEventListener("keydown", (e) => {
      const t = e.target;
      if (e.key === "Escape") closePop();
      if ((e.key === "Enter" || e.key === " ") && t.classList?.contains("dd-arc")) {
        openPop(t.getAttribute("data-id"));
        e.preventDefault();
      }
      if (e.key === "ArrowLeft" && !t.closest("input")) setDay(WEEK[WEEK.indexOf(state.day) - 1]);
      if (e.key === "ArrowRight" && !t.closest("input")) setDay(WEEK[WEEK.indexOf(state.day) + 1]);
    });
  }
  var slow = 1;
  var reduced = false;
  var clock = { now: () => performance.now() / slow, request: (cb) => requestAnimationFrame(cb), cancel: (id) => cancelAnimationFrame(id) };
  function boot() {
    const host = document.getElementById("app");
    const start = (entrance = true) => mount(host, { clock, reducedMotion: () => reduced || matchMedia("(prefers-reduced-motion: reduce)").matches }, { entrance });
    (document.fonts?.ready ?? Promise.resolve()).then(() => start(true));
    document.getElementById("ref-reset")?.addEventListener("click", () => {
      state.accepted.clear();
      state.dismissed.clear();
      state.day = NOW.date;
      start(true);
    });
    document.getElementById("ref-slow")?.addEventListener("click", (e) => {
      slow = slow === 1 ? 5 : 1;
      e.currentTarget.setAttribute("aria-pressed", String(slow === 5));
    });
    document.getElementById("ref-reduced")?.addEventListener("click", (e) => {
      reduced = !reduced;
      e.currentTarget.setAttribute("aria-pressed", String(reduced));
    });
    let lastW = 0;
    new ResizeObserver((entries) => {
      const w = Math.round(entries[0].contentRect.width);
      if (lastW && Math.abs(w - lastW) > 2) requestAnimationFrame(() => start(false));
      lastW = w;
    }).observe(host);
    window.__dayDial = {
      state,
      DD,
      capacity: Object.fromEntries([...CAP].map(([d, c]) => [d, c.pct])),
      rings: () => rings,
      setDay,
      decide,
      openPop,
      closePop,
      finish: () => engine.finish(),
      stats: () => engine.stats()
    };
  }
  boot();
})();
</script>
