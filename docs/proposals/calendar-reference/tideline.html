<!doctype html>
<html lang="en" data-hub="life">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tideline reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Real kit files. Open this page from the repo (docs/proposals/calendar-reference/) so the paths resolve. -->
<link rel="stylesheet" href="../../../packages/design-kit/tokens.css">
<link rel="stylesheet" href="../../../packages/design-kit/overlays.css">
<link rel="stylesheet" href="../../../packages/design-kit/actions.css">
<link rel="stylesheet" href="../../../packages/design-kit/filters.css">
<style>
/*
 * Tideline reference styles. PORT VERBATIM to packages/design-kit/calendar-tideline.css,
 * same class names (cal-*). Every colour is a kit token or a color-mix() of tokens.
 * The named surfaces below are the only derived colours; keep them named.
 */
*{box-sizing:border-box}
body{margin:0;overflow-x:hidden;font-family:var(--font-ui);color:var(--ink);background:var(--warm-white);-webkit-font-smoothing:antialiased}
.page{width:100%;max-width:1280px;margin:0 auto;padding:var(--space-8) var(--space-6) var(--space-16)}
.page-header__eyebrow{font-size:var(--text-2xs);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--muted);font-weight:var(--weight-semibold);margin:0}
.page-header__title{font-size:var(--text-xl);letter-spacing:var(--tracking-tight);margin:var(--space-1) 0 var(--space-5);color:var(--navy);font-weight:var(--weight-semibold)}
.ref-controls{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center;margin:0 0 var(--space-4);font-size:var(--text-xs);color:var(--muted)}
.page-shell{display:grid;grid-template-columns:1fr} /* reference harness: sized like the Life shell's content column */
/* Harness only: a stand-in for the Life rail (330px), so every width here matches the app at that width. */
body{display:grid;grid-template-columns:330px minmax(0,1fr)}
.shell-rail{background:var(--navy);color:color-mix(in srgb,#fff 75%,transparent);padding:var(--space-8) var(--space-6);font-size:var(--text-xs);letter-spacing:var(--tracking-caps);text-transform:uppercase;font-weight:var(--weight-semibold)}
@media (max-width:719px){body{display:block}.shell-rail{display:none}}
.ref-controls .btn{min-height:2rem;font-size:var(--text-xs);padding:var(--space-1) var(--space-3)}

/* ---------- named surfaces (derived; do not add kit tokens) ---------- */
.cal{
  --cal-label:104px;
  --cal-school-wash:color-mix(in srgb,var(--pastel-blue) 45%,transparent);
  --cal-yours-wash:color-mix(in srgb,var(--pastel-peach) 32%,transparent);
  --cal-hatch:repeating-linear-gradient(45deg,color-mix(in srgb,var(--navy) 10%,transparent) 0 2px,color-mix(in srgb,var(--navy) 3.5%,transparent) 2px 8px);
  --cal-wall-hatch:repeating-linear-gradient(45deg,color-mix(in srgb,var(--navy) 9%,transparent) 0 2px,color-mix(in srgb,var(--navy) 3%,transparent) 2px 9px);
  --cal-ghost-fill:color-mix(in srgb,var(--wave) 6%,transparent);
  --cal-ghost-line:color-mix(in srgb,var(--navy) 55%,transparent);
  --cal-health:color-mix(in srgb,var(--sand) 34%,#fff);
  --cal-health-stripe:color-mix(in srgb,var(--sand),var(--ink) 38%);
  --cal-lilac-stripe:color-mix(in srgb,var(--pastel-lilac-ink) 72%,#fff);
  --cal-sage-stripe:color-mix(in srgb,var(--pastel-sage-ink) 70%,#fff);
  --cal-over:var(--warning-surface);
  font-family:var(--font-ui);color:var(--ink);position:relative;
  min-width:0;contain:inline-size /* the calendar takes its container's width; nowrap text inside can never widen the page */
}

/* ---------- nav ---------- */
.cal__nav{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-3);flex-wrap:wrap}
.cal__round{width:2.25rem;height:2.25rem;border-radius:var(--radius-full);border:1px solid var(--line);background:var(--glass);display:inline-grid;place-items:center;color:var(--navy);cursor:pointer}
.cal__round svg{width:1rem;height:1rem;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.cal__period{display:grid;line-height:1.2;padding:0 var(--space-1)}
.cal__period b{font-size:var(--text-md);font-weight:var(--weight-semibold);color:var(--navy);letter-spacing:var(--tracking-tight)}
.cal__period span{font-size:var(--text-xs);color:var(--muted);font-variant-numeric:tabular-nums}
.cal__spacer{flex:1}
.cal__focus{display:flex;align-items:center;gap:var(--space-2);font-size:var(--text-xs);color:var(--muted)}

/* ---------- agent tray ---------- */
.cal__tray{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-3);margin-bottom:var(--space-3);background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-sm);box-shadow:var(--elev-2);font-size:var(--text-sm)}
.cal__tray b{font-weight:var(--weight-semibold)}
.cal__tray span.cal__tray-detail{color:var(--muted)}
.cal__tray > span:nth-child(2){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal__tray .btn{white-space:nowrap;flex:none;min-height:2rem;padding:var(--space-1) var(--space-3);font-size:var(--text-sm)}
.cal-av{width:1.75rem;height:1.75rem;border-radius:var(--radius-full);background:var(--navy);color:#fff;font-size:var(--text-xs);font-weight:var(--weight-semibold);display:inline-grid;place-items:center;flex:none}
.cal-av--sara{background:var(--pastel-sage-ink)}
.cal-av--clare{background:var(--pastel-lilac-ink)}
.cal-av--sm{width:1.125rem;height:1.125rem;font-size:0.625rem}

/* ---------- sources ---------- */
.cal__sources{display:flex;gap:var(--space-2);flex-wrap:wrap;margin-bottom:var(--space-3)}
.cal-src{display:inline-flex;align-items:center;gap:6px;font-size:var(--text-xs);font-weight:var(--weight-medium);padding:3px 10px 3px 8px;border-radius:var(--radius-full);background:var(--glass);border:1px solid var(--line);color:var(--ink)}
.cal-src i{width:8px;height:8px;border-radius:50%;background:var(--k-stripe)}
.cal-src--ambient{background:transparent;border-style:dashed;color:var(--muted)}
.cal-src--corey{color:var(--pastel-peach-ink)}

/* ---------- card + grid ---------- */
.cal__card{background:var(--hub-glass-fill);border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--hub-elev-card);backdrop-filter:blur(var(--hub-glass-blur));-webkit-backdrop-filter:blur(var(--hub-glass-blur));overflow:hidden}
.cal__grid{display:grid;grid-template-columns:var(--cal-label) repeat(var(--cal-days),minmax(0,1fr))}
.cal-head{padding:var(--space-3) var(--space-2) var(--space-2) var(--space-3);border-left:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;gap:6px;min-height:108px;align-content:start}
.cal-head.is-over{background:var(--cal-over)}
.cal-corner{border-bottom:1px solid var(--line);padding:var(--space-3);font-size:var(--text-2xs);color:var(--muted);line-height:1.35;display:flex;align-items:flex-end}
.cal-head__name{display:flex;align-items:center;flex-wrap:wrap;gap:2px var(--space-2);min-width:0}
.cal-head__dow{font-size:var(--text-2xs);font-weight:var(--weight-semibold);letter-spacing:var(--tracking-caps);color:var(--muted)}
.cal-head__num{font-size:var(--text-base);font-weight:var(--weight-semibold);width:1.875rem;height:1.875rem;display:grid;place-items:center;border-radius:var(--radius-full);font-variant-numeric:tabular-nums}
.cal-head.is-today .cal-head__num{background:var(--danger);color:#fff}
.cal-tag{max-width:100%;overflow:hidden;text-overflow:ellipsis;margin-left:auto;font-size:var(--text-2xs);font-weight:var(--weight-semibold);padding:1px 7px;border-radius:6px;background:var(--pastel-sage);color:var(--pastel-sage-ink);white-space:nowrap}
.cal-tag--term{background:var(--pastel-gold);color:var(--pastel-gold-ink)}
.cal-cap{display:grid;gap:3px}
.cal-cap__bar{height:6px;border-radius:3px;background:color-mix(in srgb,var(--navy) 8%,transparent);position:relative;overflow:hidden}
.cal-cap__fill{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--cap)}
.cal-cap.is-forecast .cal-cap__fill{background:repeating-linear-gradient(90deg,var(--cap) 0 4px,transparent 4px 7px);opacity:.6}
.cal-cap__text{font-size:var(--text-xs);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-cap__text b{color:var(--ink);font-weight:var(--weight-semibold);font-variant-numeric:tabular-nums}
.is-over .cal-cap__text b{color:var(--high-sea-ink)}
.cal-over{margin-left:auto;font-size:var(--text-2xs);font-weight:var(--weight-semibold);color:var(--high-sea-ink);background:color-mix(in srgb,var(--high-sea) 22%,#fff);border-radius:6px;padding:1px 7px}
.cal-over + .cal-tag{margin-left:4px}
.cal-vit{display:flex;flex-wrap:wrap;row-gap:2px;gap:2px var(--space-2);font-size:var(--text-2xs);color:var(--muted);align-items:center;white-space:nowrap;overflow:hidden}
.cal-vit span{display:inline-flex;gap:3px;align-items:center;max-width:100%;min-width:0}
.cal-vit > span:only-child{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-vit svg{width:12px;height:12px;flex:none;stroke:currentColor;fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.cal-vit .is-low{color:var(--high-sea-ink)}
.cal-vit .is-symptom{color:var(--high-sea-ink);font-weight:var(--weight-medium)}
.cal-allday{border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;min-height:56px;display:grid;gap:4px;align-content:start}
.cal-allday.cal-corner{border-left:0;align-items:flex-start;padding-top:10px}
.cal-due{font-size:var(--text-xs);border-radius:8px;padding:5px 8px;background:color-mix(in srgb,var(--pastel-sage) 80%,#fff);border:1px solid color-mix(in srgb,var(--pastel-sage-ink) 18%,transparent);display:grid;gap:3px;line-height:1.3}
.cal-due b{font-weight:var(--weight-semibold);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cal-due__move{display:flex;align-items:center;gap:4px;white-space:nowrap;color:var(--navy);font-weight:var(--weight-semibold);font-size:var(--text-2xs)}
.cal-due__move button{margin-left:auto}
.cal-due.is-moved{opacity:.55}

/* ---------- band labels ---------- */
.cal-bands{position:relative}
.cal-band{position:absolute;left:0;right:0;display:block;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:6px 10px;cursor:pointer;font:inherit;overflow:hidden;color:inherit}
.cal-band:hover{background:color-mix(in srgb,var(--wave) 6%,transparent)}
.cal-band:focus-visible{outline:2px solid var(--wave);outline-offset:-2px}
.cal-band b{display:flex;align-items:center;gap:4px;font-size:var(--text-xs);font-weight:var(--weight-semibold);color:var(--navy)}
.cal-band span{display:block;font-size:var(--text-2xs);color:var(--muted);line-height:1.3;opacity:var(--sub,1)}
.cal-band svg{width:10px;height:10px;opacity:.6;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.cal-band[aria-expanded="true"]{background:color-mix(in srgb,var(--wave) 8%,transparent)}
.cal-band[aria-expanded="true"] b{color:var(--wave)}
.cal-band[aria-expanded="true"] svg{transform:rotate(180deg)}
.cal-sleeplab{position:absolute;left:0;right:0;padding:6px 10px;border-top:1px solid var(--line);background:var(--cal-hatch);font-size:var(--text-xs);font-weight:var(--weight-semibold);color:var(--navy)}

/* ---------- day body ---------- */
.cal-body{position:relative;border-left:1px solid var(--line);container-type:inline-size}
.cal-head,.cal-allday,.cal-body{min-width:0}
.cal-head{container-type:inline-size}
.cal-bg{position:absolute;left:0;right:0}
.cal-bg--school{background:var(--cal-school-wash);cursor:zoom-in}
.cal-bg--yours{background:var(--cal-yours-wash);cursor:zoom-in}
.cal-line{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.cal-sleep{position:absolute;left:0;right:0;background:var(--cal-hatch);border-top:1px solid color-mix(in srgb,var(--navy) 25%,transparent);display:flex;align-items:center;justify-content:center;gap:4px;font-size:var(--text-2xs);color:var(--navy);font-weight:var(--weight-medium)}
.cal-sleep svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.2}
.cal-free{position:absolute;left:6px;right:6px;border:1px dashed color-mix(in srgb,var(--navy) 18%,transparent);border-radius:9px;display:grid;place-items:center;color:var(--muted);font-size:var(--text-2xs);text-align:center;line-height:1.35;padding:var(--space-2)}
.cal-free b{color:var(--pastel-sage-ink);font-weight:var(--weight-semibold);display:block;font-size:var(--text-xs)}
.cal-now{position:absolute;left:-5px;right:0;height:0;border-top:2px solid var(--danger);z-index:4;pointer-events:none}
.cal-now::before{content:"";position:absolute;left:0;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
.cal-now span{position:absolute;right:4px;top:-18px;font-size:var(--text-2xs);font-weight:var(--weight-semibold);color:var(--danger);background:color-mix(in srgb,#fff 90%,transparent);padding:0 4px;border-radius:4px;font-variant-numeric:tabular-nums}
.cal-wall{position:absolute;left:0;right:0;top:0;background:var(--cal-wall-hatch);z-index:1;display:flex;justify-content:center;padding-top:14px;pointer-events:none}
.cal-wall__pill{max-width:calc(100% - 12px);white-space:nowrap;overflow:hidden;display:inline-flex;align-items:center;gap:5px;height:20px;background:var(--navy);color:#fff;font-size:var(--text-2xs);font-weight:var(--weight-semibold);padding:0 9px;border-radius:10px}
.cal-wall svg{width:10px;height:10px;stroke:#fff;fill:none;stroke-width:1.3}
.cal-body.is-past .cal-chip:not(.is-ghost){--past:.72}

/* ---------- chips ---------- */
.cal-chip{
  --chip-bg:color-mix(in srgb,var(--k-bg) 70%,#fff);
  position:absolute;left:6px;right:6px;z-index:2;border-radius:9px;overflow:hidden;
  padding:var(--py,5px) 8px var(--py,5px) 10px;
  background:color-mix(in srgb,var(--k-stripe) calc((1 - var(--t,1)) * 60%),var(--chip-bg));
  border:1px solid color-mix(in srgb,var(--navy) calc(var(--t,1) * 10%),transparent);
  box-shadow:0 1px 2px color-mix(in srgb,var(--navy) 5%,transparent);
  display:grid;align-content:start;gap:1px;opacity:calc(var(--o,1) * var(--past,1));
  transform:translateY(calc(var(--y,0) * 1px)) scale(var(--s,1));transform-origin:center top
}
.cal-chip{grid-auto-rows:min-content}
/* Below 38px the meta/proposal/action rows are already at opacity 0 (see CAL.fade); remove them from layout so the title keeps its line. */
.cal-chip[data-density="line"] > :is(.cal-chip__meta,.cal-chip__proposal,.cal-chip__acts),
.cal-chip[data-density="sliver"] > :is(.cal-chip__title,.cal-chip__meta,.cal-chip__proposal,.cal-chip__acts){display:none}
.cal-chip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--k-stripe);opacity:var(--solid,1)}
.cal-chip__title{font-size:var(--text-xs);font-weight:var(--weight-semibold);line-height:1.25;color:var(--k-ink,var(--ink));display:-webkit-box;-webkit-line-clamp:var(--lines,2);-webkit-box-orient:vertical;overflow:hidden;opacity:var(--t,1);padding-right:var(--chip-pad-r,0px)}
.cal-chip__meta{font-size:var(--text-2xs);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:var(--m,1)}
.cal-chip__acts{display:flex;gap:4px;margin-top:4px;opacity:var(--a,1)}
.cal-chip__acts button{white-space:nowrap}
.cal-chip__acts[data-off]{visibility:hidden}
.cal-chip__acts button,.cal-due__move button{font:var(--weight-semibold) 0.65625rem/1 var(--font-ui);padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--navy);cursor:pointer}
.cal-chip__acts button.is-yes,.cal-due__move button{background:var(--navy);color:#fff;border-color:var(--navy)}
.cal-chip__acts button:disabled{opacity:.6;cursor:progress}
.cal-chip__agent{position:absolute;right:5px;top:5px;opacity:calc(var(--t,1) * (1 - var(--solid,0)))}
.cal-chip.has-proposal{--chip-pad-r:20px;outline:1.5px dashed var(--cal-ghost-line);outline-offset:2px}
.cal-chip.has-proposal .cal-chip__agent{opacity:var(--t,1)}
.cal-chip__proposal{font-size:var(--text-2xs);font-weight:var(--weight-semibold);color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:var(--m,1);margin-top:2px}
.cal-chip.is-ghost{--chip-pad-r:20px;background:color-mix(in srgb,var(--chip-bg) calc(var(--solid,0) * 100%),var(--cal-ghost-fill));border-color:color-mix(in srgb,var(--navy) calc(var(--solid,0) * 10%),transparent);box-shadow:none;z-index:3}
.cal-chip.is-ghost::after{content:"";position:absolute;inset:0;border:1.5px dashed var(--cal-ghost-line);border-radius:inherit;opacity:calc(1 - var(--solid,0));pointer-events:none}
.cal-chip.is-ghost:not(.is-accepted)::before{opacity:var(--solid,0)}
.cal-chip.is-over-item{background:color-mix(in srgb,var(--warm-white) 88%,transparent)}
.cal-chip.is-skipped .cal-chip__title{text-decoration:line-through;color:var(--muted)}
.cal-chip.is-class{box-shadow:none;--chip-bg:color-mix(in srgb,#fff 80%,transparent);border-color:color-mix(in srgb,var(--wave) calc(var(--t,1) * 18%),transparent)}
.cal-chip.is-corey{--chip-bg:color-mix(in srgb,var(--pastel-peach) 80%,#fff);background:linear-gradient(135deg,color-mix(in srgb,var(--pastel-peach) 62%,#fff),var(--pastel-peach));border-color:color-mix(in srgb,var(--pastel-peach-ink) 22%,transparent)}
.cal-chip.is-corey.is-ghost{background:color-mix(in srgb,var(--pastel-peach) calc(35% + var(--solid,0) * 45%),transparent)}
.cal-chip.is-corey.is-ghost::after{border-color:color-mix(in srgb,var(--pastel-peach-ink) 60%,transparent)}
.cal-mark{display:inline-block;width:14px;height:9px;position:relative;margin-right:3px;vertical-align:0}
.cal-mark::before,.cal-mark::after{content:"";position:absolute;top:0;width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor}
.cal-mark::before{left:0}.cal-mark::after{left:5px}

/* chip kinds */
.k-teaching,.k-fitness{--k-bg:var(--pastel-blue);--k-stripe:var(--wave)}
.k-professional{--k-bg:var(--pastel-lilac);--k-stripe:var(--cal-lilac-stripe)}
.k-task{--k-bg:var(--pastel-sage);--k-stripe:var(--cal-sage-stripe)}
.k-health{--k-bg:var(--cal-health);--k-stripe:var(--cal-health-stripe)}
.k-study{--k-bg:var(--pastel-gold);--k-stripe:var(--pastel-gold-ink)}
.k-corey{--k-bg:var(--pastel-peach);--k-stripe:var(--pastel-peach-ink);--k-ink:var(--pastel-peach-ink)}

/* ---------- chip popover ---------- */
.cal-chip{cursor:pointer}
.cal-chip:focus-visible{outline:2px solid var(--wave);outline-offset:1px}
.cal-pop{position:absolute;z-index:30;width:288px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-sm);box-shadow:var(--elev-2);padding:var(--space-3) var(--space-4) var(--space-4);font-size:var(--text-sm)}
.cal-pop[hidden]{display:none}
.cal-pop__head{display:flex;align-items:center;gap:var(--space-2)}
.cal-pop__head b{font-weight:var(--weight-semibold);line-height:1.3}
.cal-pop__dot{width:10px;height:10px;border-radius:3px;background:var(--k-stripe);flex:none}
.cal-pop__meta{margin:4px 0 0;color:var(--muted);font-size:var(--text-xs)}
.cal-pop__meta--strong{color:var(--ink);font-weight:var(--weight-medium)}
.cal-pop__label{margin:var(--space-3) 0 4px;font-size:var(--text-2xs);letter-spacing:var(--tracking-caps);text-transform:uppercase;font-weight:var(--weight-semibold);color:var(--muted)}
.cal-pop__writes{margin:0;padding:var(--space-2) var(--space-3);border-radius:10px;background:color-mix(in srgb,var(--wave) 6%,transparent);border:1.5px dashed var(--cal-ghost-line);font-size:var(--text-xs);line-height:1.45}
.cal-pop__acts{display:flex;gap:var(--space-2);margin-top:var(--space-3)}
.cal-pop__acts .btn{min-height:2rem;padding:var(--space-1) var(--space-3);font-size:var(--text-sm)}

/* ---------- toast (receipt) ---------- */
.cal-toast{position:absolute;right:var(--space-6);bottom:var(--space-6);max-width:30rem;background:var(--navy);color:#fff;border-radius:var(--radius-sm);padding:var(--space-3) var(--space-4) var(--space-3) 2.5rem;font-size:var(--text-sm);line-height:1.45;box-shadow:0 12px 32px color-mix(in srgb,var(--depth) 28%,transparent);opacity:var(--o,0);transform:translateY(calc(var(--y,6) * 1px));pointer-events:none;z-index:20}
.cal-toast::before{content:"✓";position:absolute;left:14px;top:12px;width:18px;height:18px;border-radius:50%;background:var(--pastel-sage);color:var(--pastel-sage-ink);font-weight:var(--weight-bold);font-size:0.6875rem;display:grid;place-items:center}
.cal-toast b{font-weight:var(--weight-semibold)}
.cal-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- phone (< 720px): one day, week strip on top ---------- */
.cal-strip{display:none}
@media (max-width:719px){
  .page{padding:var(--space-4) var(--space-4) var(--space-12)}
  .cal{--cal-label:72px}
  .cal__nav .cal__focus,.cal__nav .hub-pills[data-part="zoom-pills"]{display:none}
  .cal__tray{flex-wrap:wrap}
  .cal__tray .cal__tray-detail{display:none}
  .cal-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:var(--space-3)}
  .cal-strip button{border:1px solid var(--line);background:var(--glass);border-radius:10px;padding:6px 2px;font:inherit;display:grid;justify-items:center;gap:3px;cursor:pointer;color:var(--ink)}
  .cal-strip button[aria-pressed="true"]{border-color:color-mix(in srgb,var(--wave) 45%,transparent);background:color-mix(in srgb,var(--pastel-blue) 55%,#fff)}
  .cal-strip small{font-size:0.625rem;letter-spacing:var(--tracking-caps);color:var(--muted);font-weight:var(--weight-semibold)}
  .cal-strip b{font-size:var(--text-sm);font-variant-numeric:tabular-nums}
  .cal-strip i{width:70%;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--cap) var(--pct),color-mix(in srgb,var(--navy) 8%,transparent) var(--pct))}
  .cal-toast{left:var(--space-3);right:var(--space-3);bottom:var(--space-3)}
}
/* ---------- narrow day columns (the Life shell at 1280px gives each day ~115px) ---------- */
@container (max-width:96px){
  .cal-wall__first{display:none}
  .cal-wall__pill{padding:0 6px}
}
@container (max-width:150px){
  .cal-wall__more{display:none}
  /* Two buttons don't fit: proposals are accepted from the chip popover instead. */
  .cal-chip__acts{display:none}
  .cal-chip{padding-right:6px}
  .cal-head__num{width:1.625rem;height:1.625rem;font-size:var(--text-sm)}
}
@media (prefers-reduced-motion:reduce){.cal-band svg{transition:none}}

      n.style.setProperty("--sub", String(fadeIn(p.height, [38, 48])));
      return;
    }
    if (id.startsWith("free:")) {
      n.style.opacity = String(p.fade);
      return;
    }
    if (id.startsWith("chip:")) {
      const h = p.height;
      n.style.setProperty("--t", String(fadeIn(h, CAL.fade.title)));
      n.style.setProperty("--m", String(fadeIn(h, CAL.fade.meta)));
      n.style.setProperty("--lines", h >= CAL.twoLinesAt ? "2" : "1");
      n.style.setProperty("--py", `${h >= CAL.cardAt ? 5 : Math.max(0, (h - 2 - CAL.lineBox) / 2)}px`);
      const acts = n.querySelector(".cal-chip__acts");
      if (acts) {
        const a = fadeIn(h, CAL.fade.actions);
        acts.style.setProperty("--a", String(a));
        acts.toggleAttribute("data-off", a < 0.5);
      }
      if (p.solid != null) n.style.setProperty("--solid", String(p.solid));
      if (p.opacity != null) n.style.setProperty("--o", String(p.opacity));
      if (p.scale != null) n.style.setProperty("--s", String(p.scale));
      n.dataset.density = h < 14 ? "sliver" : h < 38 ? "line" : "card";
    }
  }
  function setBand(next) {
    state.expanded = next;
    const target = bandTargets(BANDS, next);
    engine.to("__bands", Object.fromEntries(target.map((h, i) => [`h${i}`, h])), { duration: CAL.bandMs, easing: EASE });
    root.querySelectorAll(".cal-band").forEach((b) => b.setAttribute("aria-expanded", String(Number(b.dataset.band) === next)));
    const focus = root.querySelector('[data-part="focus-pills"]');
    focus.querySelectorAll(".hub-pills__btn").forEach((b) => {
      const on = b.dataset.band === "none" && next == null || Number(b.dataset.band) === next;
      b.classList.toggle("is-active", on);
      b.setAttribute("aria-pressed", String(on));
    });
    focus.classList.add("is-animated");
    applyHubPillsThumb(focus);
    nodes.get("__live").textContent = next == null ? "All bands balanced." : `${BANDS[next].label} expanded.`;
  }
  function toggleBand(i) {
    setBand(state.expanded === i ? null : i);
  }
  function showToast(html) {
    const t = nodes.get("__toast");
    t.innerHTML = html;
    engine.to("__toast", { opacity: 1, y: 0 }, { duration: CAL.toastInMs });
    clearTimeout(toastTimer);
    toastTimer = window.setTimeout(() => engine.to("__toast", { opacity: 0, y: CAL.toastRise }, { duration: CAL.toastInMs }), CAL.toastHoldMs);
  }
  var wait = (ms) => new Promise((r) => setTimeout(r, ms));
  async function accept(ghostId, { quiet = false } = {}) {
    const g = GHOSTS.find((x) => x.id === ghostId);
    if (!g || state.accepted.has(ghostId) || state.dismissed.has(ghostId) || state.busy.has(ghostId)) return null;
    const plan = acceptPlan(ghostInput(g), { today: NOW.date });
    state.busy.add(ghostId);
    const buttons = root.querySelectorAll(`[data-accept="${ghostId}"],[data-dismiss="${ghostId}"]`);
    buttons.forEach((b) => {
      b.disabled = true;
      if (b.dataset.accept) b.textContent = "Saving\u2026";
    });
    await wait(CAL.saveLatencyMs);
    state.busy.delete(ghostId);
    state.accepted.add(ghostId);
    if (g.kind === "move_task") {
      const due = nodes.get(`due:${g.taskId}`);
      due.classList.add("is-moved");
      due.querySelector(".cal-due__move").innerHTML = "Moved to T4 W1 Tue";
    } else if (g.overItem) {
      const item = nodes.get(`chip:${g.overItem}`);
      item.classList.remove("has-proposal");
      item.classList.add("is-skipped");
      item.querySelector(".cal-chip__agent")?.remove();
      item.querySelector(".cal-chip__proposal")?.remove();
      item.querySelector(".cal-chip__meta").textContent = "Skipped \xB7 Sara";
    } else {
      const chip = nodes.get(`chip:${ghostId}`);
      chip.classList.add("is-accepted");
      chip.querySelector(".cal-chip__acts")?.remove();
      chip.dataset.part = "chip";
      engine.to(`chip:${ghostId}`, { solid: 1 }, { duration: CAL.acceptMs });
    }
    if (!quiet) showToast(`<b>Written.</b> ${plan.receipt}`);
    nodes.get("__live").textContent = plan.receipt;
    return plan;
  }
  function dismiss(ghostId) {
    const g = GHOSTS.find((x) => x.id === ghostId);
    if (!g || state.accepted.has(ghostId) || state.dismissed.has(ghostId)) return;
    const plan = dismissPlan(ghostInput(g));
    state.dismissed.add(ghostId);
    if (g.overItem) {
      const item = nodes.get(`chip:${g.overItem}`);
      item.classList.remove("has-proposal");
      item.querySelector(".cal-chip__agent")?.remove();
      item.querySelector(".cal-chip__proposal")?.remove();
      showToast(`<b>${plan.receipt}</b> Sara notes the \u201Cno\u201D, so she asks less often.`);
      return;
    }
    engine.to(`chip:${ghostId}`, { scale: 0.96 }, { duration: CAL.exitMs });
    engine.exit(`chip:${ghostId}`, () => {
      nodes.get(`chip:${ghostId}`)?.remove();
      nodes.delete(`chip:${ghostId}`);
    }, { duration: CAL.exitMs });
    showToast(`<b>${plan.receipt}</b> ${g.agent === "sara" ? "Sara" : "Hammond"} notes the \u201Cno\u201D, so it asks less often.`);
  }
  async function applyAll() {
    const pending = GHOSTS.filter((g) => !state.accepted.has(g.id) && !state.dismissed.has(g.id));
    const plans = await Promise.all(pending.map(async (g, i) => {
      await wait(i * CAL.applyAllStagger);
      return accept(g.id, { quiet: true });
    }));
    const done = plans.filter(Boolean);
    if (done.length) showToast(`<b>${done.length} change${done.length === 1 ? "" : "s"} written.</b> Receipts are in Central Node \u203A Recent Agent Actions.`);
  }
  var popFor = null;
  function openPop(chipId) {
    const chip = nodes.get(`chip:${chipId}`);
    const pop = nodes.get("__pop");
    if (!chip) return;
    const g = GHOSTS.find((x) => (x.id === chipId || x.overItem === chipId) && !state.accepted.has(x.id) && !state.dismissed.has(x.id));
    const item = ITEMS.find((x) => x.id === chipId);
    const title = g && !g.overItem ? g.label : item?.title ?? chip.title;
    const meta = g && !g.overItem ? g.meta : item?.meta ?? "";
    let html = `<div class="cal-pop__head">${g ? `<span class="cal-av cal-av--sm ${g.agent === "sara" ? "cal-av--sara" : ""}">${AGENT_INITIAL[g.agent]}</span>` : `<i class="cal-pop__dot k-${chip.dataset.kind}"></i>`}<b>${title}</b></div><p class="cal-pop__meta">${meta}</p>`;
    if (g) {
      if (g.overItem) html += `<p class="cal-pop__label">${g.agent === "sara" ? "Sara" : "Hammond"} suggests</p><p class="cal-pop__meta cal-pop__meta--strong">${g.label} \xB7 ${g.meta}</p>`;
      html += `<p class="cal-pop__label">Accept writes</p><p class="cal-pop__writes" data-part="write-preview">${acceptPlan(ghostInput(g), { today: NOW.date }).receipt}</p>`;
      html += `<div class="cal-pop__acts"><button type="button" class="btn btn--primary" data-accept="${g.id}">Accept</button>${g.kind === "bedtime" ? "" : `<button type="button" class="btn btn--ghost" data-dismiss="${g.id}">Dismiss</button>`}</div>`;
    }
    pop.innerHTML = html;
    pop.hidden = false;
    const r = root.getBoundingClientRect();
    const c = chip.getBoundingClientRect();
    const roomRight = r.right - c.right;
    const left = roomRight >= CAL.popWidth + CAL.popGap ? c.right - r.left + CAL.popGap : c.left - r.left - CAL.popWidth - CAL.popGap;
    pop.style.left = `${Math.max(0, left)}px`;
    pop.style.top = `${c.top - r.top}px`;
    popFor = chipId;
    engine.place("__pop", { opacity: 0, y: CAL.popRise });
    engine.to("__pop", { opacity: 1, y: 0 }, { duration: CAL.popMs });
    pop.querySelector("button")?.focus({ preventScroll: true });
  }
  function closePop() {
    if (!popFor) return;
    popFor = null;
    engine.to("__pop", { opacity: 0, y: CAL.popRise }, { duration: CAL.popMs });
    window.setTimeout(() => {
      if (!popFor) nodes.get("__pop").hidden = true;
    }, CAL.popMs);
  }
  function wire(r) {
    r.addEventListener("click", (e) => {
      const t = e.target;
      const acc = t.closest("[data-accept]");
      if (acc) {
        closePop();
        return void accept(acc.dataset.accept);
      }
      const dis = t.closest("[data-dismiss]");
      if (dis) {
        closePop();
        return dismiss(dis.dataset.dismiss);
      }
      const chip = t.closest(".cal-chip");
      if (chip) return chip.dataset.id === popFor ? closePop() : openPop(chip.dataset.id);
      if (!t.closest('[data-part="chip-popover"]')) closePop();
      if (t.closest('[data-action="apply-all"]')) return void applyAll();
      const day = t.closest("[data-day]");
      if (day) {
        state.phoneDay = day.dataset.day;
        return mount(r.parentElement);
      }
      const band = t.closest("[data-band]");
      if (band && !t.closest(".cal-chip")) {
        if (band.dataset.band === "none") return setBand(null);
        return band.closest('[data-part="focus-pills"]') ? setBand(Number(band.dataset.band)) : toggleBand(Number(band.dataset.band));
      }
    });
    r.addEventListener("keydown", (e) => {
      if (e.target.closest("input,textarea")) return;
      if (/^[1-4]$/.test(e.key)) {
        toggleBand(Number(e.key) - 1);
        e.preventDefault();
      }
      if (e.key === "Escape" && popFor) {
        closePop();
        return;
      }
      if (e.key === "0" || e.key === "Escape") {
        setBand(null);
      }
      if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("cal-chip")) {
        openPop(e.target.dataset.id);
        e.preventDefault();
      }
    });
  }
  var slow = 1;
  var reduced = false;
  var clock = {
    now: () => performance.now() / slow,
    request: (cb) => requestAnimationFrame(cb),
    cancel: (id) => cancelAnimationFrame(id)
  };
  function boot() {
    const host = document.getElementById("app");
    const start = () => mount(host, { clock, reducedMotion: () => reduced || matchMedia("(prefers-reduced-motion: reduce)").matches });
    (document.fonts?.ready ?? Promise.resolve()).then(start);
    document.getElementById("ref-reset")?.addEventListener("click", () => {
      state.expanded = null;
      state.accepted.clear();
      state.dismissed.clear();
      state.phoneDay = NOW.date;
      start();
    });
    document.getElementById("ref-slow")?.addEventListener("click", (e) => {
      slow = slow === 1 ? 5 : 1;
      e.currentTarget.setAttribute("aria-pressed", String(slow === 5));
    });
    document.getElementById("ref-reduced")?.addEventListener("click", (e) => {
      reduced = !reduced;
      e.currentTarget.setAttribute("aria-pressed", String(reduced));
    });
    let wasPhone = matchMedia("(max-width: 719px)").matches;
    matchMedia("(max-width: 719px)").addEventListener("change", (ev) => {
      if (ev.matches !== wasPhone) {
        wasPhone = ev.matches;
        start();
      }
    });
    window.__tideline = {
      state,
      CAL,
      heights: () => heights.slice(),
      total: TOTAL,
      capacity: Object.fromEntries([...CAP].map(([d, c]) => [d, c.pct])),
      setBand,
      accept,
      dismiss,
      openPop,
      closePop,
      finish: () => engine.finish(),
      stats: () => engine.stats()
    };
  }
  boot();
})();
</script>
</body>
