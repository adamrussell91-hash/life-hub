<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Person profile — three phone options</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --warm-white: #fbf8f2;
    --cotton: #f5f1e9;
    --paper: #fbf8f2;
    --depth: #0a1536;
    --marine: #142b51;
    --navy: #17375e;
    --shallow: #a7abb9;
    --wave: #376fb7;
    --ink: #13233a;
    --muted: #6b7788;
    --line: rgba(23, 55, 94, 0.10);
    --glass: rgba(255, 255, 255, 0.70);
    --pastel-blue: #dceafa;
    --pastel-sage: #dfe9e1;
    --pastel-sage-ink: #3c5949;
    --text-2xs: 11px;
    --text-xs: 12px;
    --text-sm: 13px;
    --text-base: 15px;
    --text-md: 17px;
    --text-lg: 21px;
    --text-xl: 32px;
    --radius-sm: 14px;
    --radius-md: 20px;
    --radius-full: 999px;
    --elev-1: 0 1px 2px rgba(20, 35, 70, 0.06);
    --elev-2: 0 1px 2px rgba(20, 35, 70, 0.05), 0 2px 6px rgba(20, 35, 70, 0.06);
    --elev-3: 0 18px 48px rgba(39, 55, 74, 0.10), inset 0 1px 0 rgba(255, 255, 255, 0.96);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Inter, ui-sans-serif, sans-serif;
    color: var(--ink);
    background: #e6e1d6;
    -webkit-font-smoothing: antialiased;
  }
  .board {
    display: flex;
    gap: 28px;
    padding: 36px 36px 28px;
    align-items: flex-start;
  }
  figure { margin: 0; width: 390px; }
  figcaption { margin-top: 14px; }
  figcaption b {
    display: block;
    font-size: 15px;
    color: var(--depth);
    letter-spacing: -0.015em;
  }
  figcaption span {
    display: block;
    margin-top: 2px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.35;
  }
  .phone {
    width: 390px;
    height: 844px;
    border-radius: 28px;
    overflow: hidden;
    position: relative;
    background-color: var(--cotton);
    background-image:
      radial-gradient(760px 540px at 4% 0%, rgba(207, 223, 241, 0.62), transparent 70%),
      radial-gradient(720px 500px at 98% 8%, rgba(237, 216, 197, 0.5), transparent 72%),
      linear-gradient(145deg, var(--cotton), var(--paper) 48%, var(--cotton));
    box-shadow: 0 18px 48px rgba(39, 55, 74, 0.16);
    border: 1px solid rgba(23, 55, 94, 0.12);
  }
  .canvas {
    height: 100%;
    padding: 20px 16px 108px;
    overflow: hidden;
  }
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 32px;
  }
  .eyebrow {
    margin: 0;
    font-size: var(--text-2xs);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .back {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    color: var(--wave);
    font-size: var(--text-sm);
    font-weight: 600;
    text-decoration: none;
  }
  .utils { display: flex; gap: 2px; color: var(--shallow); }
  .utils svg { width: 18px; height: 18px; display: block; }
  h1 {
    margin: 8px 0 0;
    font-size: var(--text-xl);
    line-height: 1.15;
    letter-spacing: -0.015em;
    color: var(--navy);
    font-weight: 700;
  }
  .fact {
    margin: 8px 0 0;
    font-size: var(--text-base);
    line-height: 1.35;
    color: var(--ink);
  }
  .fact b { font-weight: 600; }
  .meta {
    margin: 4px 0 0;
    font-size: var(--text-sm);
    color: var(--muted);
  }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 40px;
    margin-top: 16px;
    padding: 0 16px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--navy);
    background: var(--navy);
    color: #fff;
    font: 600 var(--text-sm) Inter, sans-serif;
    box-shadow: var(--elev-2);
  }
  .btn.secondary {
    background: rgba(255, 255, 255, 0.62);
    color: var(--marine);
    border-color: var(--line);
    box-shadow: var(--elev-1);
  }
  .tabs {
    display: flex;
    gap: 18px;
    margin: 22px -16px 0;
    padding: 0 16px;
    overflow: hidden;
    border-bottom: 1px solid var(--line);
    -webkit-mask-image: linear-gradient(90deg, #000 0 78%, transparent);
    mask-image: linear-gradient(90deg, #000 0 78%, transparent);
  }
  .tab {
    flex: none;
    padding: 8px 0 10px;
    font-size: var(--text-sm);
    font-weight: 600;
    color: var(--muted);
    border-bottom: 2px solid transparent;
  }
  .tab.on { color: var(--navy); border-bottom-color: var(--navy); }
  .section {
    margin: 22px 0 0;
    font-size: var(--text-2xs);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }
  .row strong {
    display: block;
    font-size: var(--text-md);
    font-weight: 600;
    letter-spacing: -0.015em;
    color: var(--depth);
  }
  .row em {
    display: block;
    margin-top: 2px;
    font-style: normal;
    font-size: var(--text-sm);
    color: var(--muted);
  }
  .edit {
    flex: none;
    color: var(--wave);
    font-size: var(--text-sm);
    font-weight: 600;
    text-decoration: none;
  }
  .nav {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    min-height: 74px;
    padding: 8px 8px 12px;
    border-top: 1px solid rgba(255, 255, 255, 0.75);
    background: rgba(250, 248, 242, 0.92);
  }
  .nav span {
    display: grid;
    place-items: center;
    align-content: center;
    gap: 3px;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
  }
  .nav span.on {
    color: var(--depth);
    background: rgba(55, 111, 183, 0.08);
    border-radius: var(--radius-sm);
  }
  .nav svg { width: 20px; height: 20px; }

  /* B — one card */
  .card {
    margin-top: 16px;
    padding: 18px 16px 6px;
    border-radius: var(--radius-md);
    border: 1px solid var(--line);
    background: var(--glass);
    box-shadow: var(--elev-3);
  }
  .card .kicker {
    font-size: var(--text-2xs);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .card .org {
    margin: 4px 0 0;
    font-size: var(--text-lg);
    font-weight: 700;
    letter-spacing: -0.015em;
    color: var(--depth);
    line-height: 1.2;
  }
  .card .roleline {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 6px;
    font-size: var(--text-sm);
    color: var(--muted);
  }
  .chip {
    display: inline-flex;
    margin-top: 12px;
    padding: 4px 10px;
    border-radius: var(--radius-full);
    background: var(--pastel-sage);
    color: var(--pastel-sage-ink);
    font-size: var(--text-xs);
    font-weight: 600;
  }
  .card .brief {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 14px -16px 0;
    padding: 14px 16px;
    border-top: 1px solid var(--line);
    color: var(--navy);
    font-size: var(--text-base);
    font-weight: 600;
    text-decoration: none;
  }
  .phone.b h1 { font-size: var(--text-lg); }
  .phone.b .tabs { margin-top: 18px; }

  /* C — sentence */
  .phone.c h1 { font-size: var(--text-lg); margin-top: 14px; }
  .sentence {
    margin: 10px 0 0;
    max-width: 34ch;
    font-size: var(--text-md);
    line-height: 1.45;
    color: var(--ink);
  }
  .pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .pair .btn { margin-top: 18px; }
  .defs { margin-top: 8px; }
  .defs .row { padding: 12px 0; }
  .defs .row strong {
    font-size: var(--text-base);
    font-weight: 500;
    color: var(--ink);
  }
  .defs dt {
    font-size: var(--text-2xs);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
</style>
</head>
<body>
<div class="board">
  <figure>
    <div class="phone">
      <div class="canvas">
        <div class="top">
          <a class="back" href="#">‹ People</a>
          <div class="utils" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M10 7V5a2 2 0 0 1 2-2h7v18h-7a2 2 0 0 1-2-2v-2"/><path d="M15 12H3m0 0 3-3m-3 3 3 3"/></svg>
          </div>
        </div>
        <h1>Rachel Logan</h1>
        <p class="fact"><b>Employee</b> at Trinity Catholic College</p>
        <p class="meta">Logan, Rachel · Active</p>
        <div class="btn">Open Person Brief</div>
        <div class="tabs">
          <span class="tab on">Overview</span>
          <span class="tab">Timeline</span>
          <span class="tab">Shared Work</span>
          <span class="tab">Network</span>
          <span class="tab">History</span>
          <span class="tab">Observations</span>
          <span class="tab">Evidence</span>
        </div>
        <p class="section">Current relationships</p>
        <div class="row">
          <div>
            <strong>Trinity Catholic College</strong>
            <em>Employee · No role set</em>
          </div>
          <a class="edit" href="#">Edit</a>
        </div>
      </div>
      <nav class="nav">
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/></svg>Home</span>
        <span class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="9" cy="8" r="3"/><path d="M3.5 20c.6-3 2.8-5 5.5-5s4.9 2 5.5 5"/></svg>People</span>
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 20V9l8-5 8 5v11"/><path d="M9 20v-6h6v6"/></svg>Organisations</span>
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="6" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18" cy="12" r="1.2"/></svg>More</span>
      </nav>
    </div>
    <figcaption><b>A · Contact</b><span>The name introduces where she works. One action. Edit is a link, not a second button.</span></figcaption>
  </figure>

  <figure>
    <div class="phone b">
      <div class="canvas">
        <div class="top">
          <p class="eyebrow">People</p>
          <div class="utils" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M10 7V5a2 2 0 0 1 2-2h7v18h-7a2 2 0 0 1-2-2v-2"/><path d="M15 12H3m0 0 3-3m-3 3 3 3"/></svg>
          </div>
        </div>
        <h1>Rachel Logan</h1>
        <p class="meta">Logan, Rachel</p>
        <div class="card">
          <div class="kicker">Employee</div>
          <p class="org">Trinity Catholic College</p>
          <div class="roleline"><span>No role set</span><a class="edit" href="#">Edit role</a></div>
          <span class="chip">Active</span>
          <a class="brief" href="#">Open Person Brief <span aria-hidden="true">→</span></a>
        </div>
        <div class="tabs">
          <span class="tab on">Overview</span>
          <span class="tab">Timeline</span>
          <span class="tab">Shared Work</span>
          <span class="tab">Network</span>
          <span class="tab">History</span>
          <span class="tab">Observations</span>
          <span class="tab">Evidence</span>
        </div>
      </div>
      <nav class="nav">
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/></svg>Home</span>
        <span class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="9" cy="8" r="3"/><path d="M3.5 20c.6-3 2.8-5 5.5-5s4.9 2 5.5 5"/></svg>People</span>
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 20V9l8-5 8 5v11"/><path d="M9 20v-6h6v6"/></svg>Organisations</span>
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="6" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18" cy="12" r="1.2"/></svg>More</span>
      </nav>
    </div>
    <figcaption><b>B · Card</b><span>One glass card holds the place, the role, and the brief. The page stops being a stack of buttons.</span></figcaption>
  </figure>

  <figure>
    <div class="phone c">
      <div class="canvas">
        <div class="top">
          <a class="back" href="#">‹ People</a>
          <div class="utils" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M10 7V5a2 2 0 0 1 2-2h7v18h-7a2 2 0 0 1-2-2v-2"/><path d="M15 12H3m0 0 3-3m-3 3 3 3"/></svg>
          </div>
        </div>
        <h1>Rachel Logan</h1>
        <p class="sentence">Employee at Trinity Catholic College. No role is set yet.</p>
        <div class="pair">
          <div class="btn">Open brief</div>
          <div class="btn secondary">Edit role</div>
        </div>
        <div class="tabs">
          <span class="tab on">Overview</span>
          <span class="tab">Timeline</span>
          <span class="tab">Shared Work</span>
          <span class="tab">Network</span>
          <span class="tab">History</span>
          <span class="tab">Observations</span>
          <span class="tab">Evidence</span>
        </div>
        <div class="defs">
          <div class="row"><div><dt>Sort name</dt><strong>Logan, Rachel</strong></div></div>
          <div class="row"><div><dt>Status</dt><strong>Active</strong></div></div>
          <div class="row"><div><dt>Organisation</dt><strong>Trinity Catholic College</strong></div></div>
        </div>
      </div>
      <nav class="nav">
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/></svg>Home</span>
        <span class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="9" cy="8" r="3"/><path d="M3.5 20c.6-3 2.8-5 5.5-5s4.9 2 5.5 5"/></svg>People</span>
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 20V9l8-5 8 5v11"/><path d="M9 20v-6h6v6"/></svg>Organisations</span>
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="6" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18" cy="12" r="1.2"/></svg>More</span>
      </nav>
    </div>
    <figcaption><b>C · Sentence</b><span>The overview is a sentence. Catalog fields drop into a quiet list underneath.</span></figcaption>
  </figure>
</div>
</body>
</html>
