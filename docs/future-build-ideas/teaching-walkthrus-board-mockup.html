<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WalkThrus board mockup</title>
<style>
  :root {
    --table: #4a3323; --table-2: #3a271a; --frame: #8a5a2e; --frame-dark: #5e3b1c;
    --sea: #2f6e9e; --sea-2: #3a7fb1; --sand: #e8d29a;
    --parch: #f6ead0; --parch-2: #ecdcb6; --ink: #2b1d12; --muted: #7a6650; --line: #d6c39b;
    --red: #b8322a; --red-dark: #7d1f19;
  }
  /* the board is a physical object on a table, so it keeps the same colours in dark mode */
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --table: #2c1f15; --table-2: #22170f; } }
  :root[data-theme="dark"] { --table: #2c1f15; --table-2: #22170f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--table); color: var(--ink); font: 14px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--table-2); color: var(--parch); flex-wrap: wrap; border-bottom: 3px solid var(--frame-dark); }
  header h1 { font-size: 19px; margin: 0; letter-spacing: .02em; font-family: "Palatino Linotype", Palatino, Georgia, serif; }
  header .sub { color: #c9b48f; font-size: 12.5px; }
  .tools { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  button { font: inherit; font-size: 13px; font-weight: 600; border: 1.5px solid var(--frame-dark); background: var(--parch); color: var(--ink); border-radius: 8px; padding: 6px 12px; cursor: pointer; transition: background .2s, transform .15s, box-shadow .2s; box-shadow: 0 2px 0 var(--frame-dark); }
  button:hover { background: #fff6e2; }
  button:active { transform: translateY(2px); box-shadow: none; }
  button.on { background: var(--red); color: #fff; border-color: var(--red-dark); box-shadow: 0 2px 0 var(--red-dark); }
  main { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  svg#board { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab;
    background: radial-gradient(ellipse at 50% 40%, #5a3f2b 0%, var(--table) 60%, var(--table-2) 100%); }
  svg#board.dragging { cursor: grabbing; }
  svg#board.drawing { cursor: crosshair; }

  .hex { cursor: pointer; transform-box: fill-box; transform-origin: center; transition: transform .25s cubic-bezier(.2,.8,.2,1), filter .25s, opacity .3s; }
  .hex:hover { transform: scale(1.05); filter: drop-shadow(0 5px 6px rgba(0,0,0,.35)); }
  .hex.pick { filter: drop-shadow(0 0 7px #fff); }
  .hex.dim { opacity: .4; }
  .tile-edge { fill: none; stroke: #f3e3b5; stroke-width: 2.6; }
  .token { fill: var(--parch); stroke: #6b4a2b; stroke-width: 1.4; }
  .tok-num { font-size: 12.5px; font-weight: 800; text-anchor: middle; fill: var(--ink); font-family: "Palatino Linotype", Palatino, Georgia, serif; }
  .tok-num.hot { fill: var(--red); }
  .tok-code { font-size: 5.2px; font-weight: 800; text-anchor: middle; fill: var(--muted); letter-spacing: .06em; }
  .pip { fill: var(--ink); }
  .pip.hot { fill: var(--red); }
  .name { font-size: 7.6px; font-weight: 800; text-anchor: middle; fill: var(--ink); paint-order: stroke; stroke: rgba(246,234,208,.95); stroke-width: 3px; stroke-linejoin: round; }
  .pop { animation: pop .5s cubic-bezier(.2,.9,.3,1.3) both; }
  @keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }

  .road { fill: none; stroke-linecap: round; pointer-events: stroke; }
  .road.casing { stroke: var(--red-dark); stroke-width: 9; }
  .road.edge { stroke: var(--red); stroke-width: 6; }
  .road.thin { stroke: var(--red); stroke-width: 3; stroke-dasharray: 7 5; }
  .road.casing.thin { stroke: rgba(0,0,0,.25); stroke-width: 5; stroke-dasharray: none; }
  .road.new { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw .7s ease-out forwards; }
  .road.thin.new { animation: draw .9s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .chev { fill: var(--parch); transform-box: fill-box; transform-origin: center; }
  .roadg { cursor: help; }
  .building { pointer-events: none; filter: drop-shadow(0 2px 1.5px rgba(0,0,0,.45)); }
  .building .place { animation: drop .6s cubic-bezier(.2,.9,.3,1.4) both; transform-box: fill-box; transform-origin: bottom center; }
  @keyframes drop { from { transform: translateY(-30px) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  .robber { cursor: pointer; transition: transform .6s cubic-bezier(.5,0,.2,1), opacity .4s; filter: drop-shadow(0 3px 2px rgba(0,0,0,.45)); }
  .robber.gone { opacity: 0; transform: translateY(-40px); }
  .harbour { cursor: pointer; }
  .harbour text { font-size: 8.5px; font-weight: 800; fill: var(--ink); text-anchor: middle; }
  .facedown .back { fill: #c9a96a; stroke: #f3e3b5; stroke-width: 2.6; }
  .facedown .q { font-size: 16px; font-weight: 700; fill: rgba(80,50,20,.45); text-anchor: middle; font-family: Palatino, Georgia, serif; }
  .table-label { font-size: 13px; font-weight: 700; letter-spacing: .06em; fill: #e7d3ad; text-anchor: middle; font-family: Palatino, Georgia, serif; }
  .table-sub { font-size: 10px; fill: #c4ab84; text-anchor: middle; }

  /* side panel: parchment */
  #panel { position: absolute; top: 0; right: 0; bottom: 0; width: min(380px, 100%); background: var(--parch); border-left: 4px solid var(--frame); transform: translateX(105%); transition: transform .45s cubic-bezier(.2,.8,.2,1); overflow-y: auto; padding: 18px 18px 28px; box-shadow: -10px 0 30px rgba(0,0,0,.35); }
  #panel.open { transform: none; }
  #panel .close { position: absolute; top: 12px; right: 12px; border-radius: 50%; width: 32px; height: 32px; padding: 0; }
  .p-head { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; padding-right: 36px; }
  .p-icon { width: 58px; height: 66px; flex: none; }
  .p-code { font-size: 11px; font-weight: 800; letter-spacing: .08em; color: var(--muted); }
  .p-name { font-size: 21px; font-weight: 700; line-height: 1.15; font-family: "Palatino Linotype", Palatino, Georgia, serif; }
  .p-sec { margin-top: 18px; }
  .p-sec h3 { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  .adapt { display: flex; gap: 4px; }
  .adapt span { flex: 1; text-align: center; padding: 7px 0 6px; border-radius: 8px; background: var(--parch-2); font-weight: 800; font-size: 13px; color: var(--muted); border: 1px solid var(--line); }
  .adapt span small { display: block; font-size: 9.5px; font-weight: 600; }
  .adapt span.done { background: color-mix(in srgb, var(--c) 35%, var(--parch)); color: var(--ink); border-color: transparent; }
  .adapt span.now { background: var(--c); color: #fff; border-color: transparent; box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 30%, transparent); }
  .steps { display: grid; gap: 8px; }
  .step { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start; }
  .step .n { width: 26px; height: 26px; border-radius: 50%; background: var(--parch-2); border: 1.5px solid #6b4a2b; font-weight: 800; display: grid; place-items: center; font-size: 12px; font-family: Palatino, Georgia, serif; }
  .step .book { height: 9px; border-radius: 4px; background: var(--line); margin: 3px 0 5px; }
  .step .book.short { width: 70%; }
  .step .mine { font-size: 12.5px; padding: 6px 8px; border-left: 3px solid var(--red); background: #fffaf0; border-radius: 0 6px 6px 0; }
  .note { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
  .reps { display: flex; gap: 4px; flex-wrap: wrap; }
  .reps span { font-size: 11.5px; padding: 3px 8px; border-radius: 999px; background: #fffaf0; border: 1px solid var(--line); }
  .ev { display: grid; gap: 6px; }
  .ev .row { display: grid; grid-template-columns: 70px 1fr 40px; align-items: center; gap: 8px; font-size: 12.5px; }
  .ev .bar { height: 12px; border-radius: 6px; background: #fffaf0; overflow: hidden; border: 1px solid var(--line); }
  .ev .bar i { display: block; height: 100%; background: var(--c); width: 0; transition: width .9s cubic-bezier(.2,.8,.2,1); }
  .p-actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .chain { font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .chain b { padding: 3px 8px; background: #fffaf0; border-radius: 6px; border: 1px solid var(--line); font-weight: 600; }

  #suggest { position: absolute; left: 16px; top: 16px; width: min(330px, calc(100% - 32px)); background: var(--parch); border: 2px solid var(--frame); border-radius: 12px; padding: 12px 14px; box-shadow: 0 10px 26px rgba(0,0,0,.4); transition: transform .5s cubic-bezier(.2,.8,.2,1), opacity .4s; }
  #suggest.gone { transform: translateY(-20px); opacity: 0; pointer-events: none; }
  #suggest .t { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 800; display: flex; gap: 6px; align-items: center; }
  #suggest p { margin: 6px 0 10px; font-size: 13px; }
  #hand { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; gap: 8px; max-width: calc(100% - 32px); overflow-x: auto; padding: 8px 4px 2px; transition: opacity .3s; }
  .card { flex: none; width: 96px; height: 120px; border-radius: 9px; background: var(--parch); border: 3px solid #fff; outline: 1.5px solid var(--frame-dark); padding: 8px 7px; cursor: pointer; transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s; box-shadow: 0 6px 12px rgba(0,0,0,.35); display: flex; flex-direction: column; margin-bottom: -56px; }
  .card:hover { transform: translateY(-50px) rotate(-1.5deg); box-shadow: 0 14px 22px rgba(0,0,0,.45); }
  .card .k { font-size: 8.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
  .card .v { font-weight: 700; font-size: 13px; margin-top: 3px; line-height: 1.15; font-family: Palatino, Georgia, serif; }
  .card .art { margin-top: auto; height: 34px; border-radius: 5px; background: repeating-linear-gradient(45deg, #e6d3a8 0 6px, #efe0bd 6px 12px); display: grid; place-items: center; font-size: 10px; color: var(--muted); }
  .card .u { font-size: 10px; color: var(--muted); margin-top: 4px; }
  #legend { position: absolute; right: 16px; top: 16px; background: var(--parch); border: 2px solid var(--frame); border-radius: 12px; padding: 10px 12px; font-size: 12px; display: grid; gap: 5px; transition: opacity .3s, transform .3s; box-shadow: 0 10px 26px rgba(0,0,0,.35); }
  #legend .lh { font-weight: 800; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
  #legend .terr { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; }
  #legend .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; border: 1px solid rgba(0,0,0,.2); }
  #legend svg { vertical-align: middle; margin-right: 6px; }
  #legend.hide, #hand.hide { opacity: 0; transform: translateY(10px); pointer-events: none; }
  .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--parch); font-size: 12px; padding: 6px 9px; border-radius: 8px; max-width: 240px; opacity: 0; transform: translateY(4px); transition: opacity .15s, transform .15s; z-index: 5; }
  .tip.show { opacity: 1; transform: none; }
  .zoom { position: absolute; left: 16px; bottom: 80px; display: grid; gap: 6px; }
  .zoom button { width: 36px; height: 36px; padding: 0; border-radius: 50%; font-size: 18px; }
  @media (max-width: 700px) {
    #legend { display: none; }
    #panel { top: auto; height: 72%; width: 100%; border-left: 0; border-top: 4px solid var(--frame); border-radius: 18px 18px 0 0; transform: translateY(105%); }
    #panel.open { transform: none; }
    header .sub { display: none; }
    main:has(#panel.open) #suggest { opacity: 0; pointer-events: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Professional learning · WalkThrus</h1>
  <span class="sub">Mockup. Placeholder art until the custom icons arrive. Book wording loads privately.</span>
  <div class="tools">
    <button id="drawBtn" title="Click one hex, then another">Build a road</button>
    <button id="seriesBtn">Show by series</button>
    <button id="keyBtn">Key</button>
    <button id="resetBtn">Reset view</button>
  </div>
</header>
<main>
  <svg id="board" aria-label="WalkThrus board"></svg>
  <div id="suggest">
    <div class="t"><svg width="12" height="16" viewBox="0 0 12 16"><circle cx="6" cy="4" r="3.4" fill="#6d6d6d"/><path d="M1.5 15c0-5 2-7.5 4.5-7.5S10.5 10 10.5 15z" fill="#6d6d6d"/></svg> The robber has moved</div>
    <p><b>Recall gap</b> on 3 quizzes in 3 weeks, Year 9 and Year 10. It is blocking <b>Weekly and monthly review</b>.</p>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <button class="on" id="placeGoal">Make it a goal</button>
      <button id="showRobber">Show me</button>
      <button id="dismiss">Dismiss</button>
    </div>
  </div>
  <div id="legend" class="hide"></div>
  <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button></div>
  <div id="hand"></div>
  <aside id="panel" aria-live="polite"></aside>
  <div class="tip" id="tip"></div>
</main>

<script>
// each series is a terrain, like Catan's resources
const SERIES = {
  QF: { code: 'Q&F', name: 'Questioning and feedback', terrain: 'Fields', hex: '#e2b13c' },
  PR: { code: 'P&R', name: 'Practice and retrieval', terrain: 'Hills', hex: '#c4623a' },
  CP: { code: 'CP',  name: 'Curriculum planning', terrain: 'Mountains', hex: '#8d949a' },
  EM: { code: 'E&M', name: 'Explaining and modelling', terrain: 'Forest', hex: '#3f7d36' },
  BR: { code: 'B&R', name: 'Behaviour and relationships', terrain: 'Pasture', hex: '#93c457' },
  MB: { code: 'MB',  name: 'Mode B teaching', terrain: 'Fishery', hex: '#4fa3b4' },
};
const T = {
  BR: [['Rehearse routines',44],['Positive relationships',36],['Establish your expectations',38],['Signal, pause, insist',40],['Positive framing',42],['Choices and consequences',46]],
  CP: [['Sequence concepts in small steps',52],['Designing a knowledge rich curriculum',50],['Coherent mapping',54],['Blend knowledge and experience',56],['Pitch it up',58],['Plan for reading',60],['Tiered questions and problems',62],['Deliver core; signpost hinterland',64]],
  EM: [['Live modelling',78],['Worked examples and backward fading',68],['Dual coding',70],['Deliberate vocabulary development',72],['Big picture, small picture',74],['Abstract models with concrete examples',76],['Scaffolding',80],['Metacognitive talk',82],['Set the standards',84],['Head on misconceptions',86]],
  QF: [['Check for understanding',96],['Cold calling',90],['Show-me boards',94],['Think, pair, share',92],['Say it again better',98],['Probing questions',100],['Process questions',102],['Whole class feedback',108],['Feedback that moves forward',104],['Feedback as actions',106]],
  PR: [['Quizzing',112],['Weekly and monthly review',122],['Elaborative interrogation',114],['Using a knowledge organiser',116],['Rehearsal and performance',118],['Peer supported retrieval',120],['Concrete examples',124],['Guided practice',126],['Independent practice',128],['Building fluency',130]],
  MB: [['Collaborative learning',134],['Oracy: debating',142],['Homework as guided study',136],['Enquiry projects',138],['Open response tasks',140],['Oracy: talk for writing',144],['Oracy: instructional inputs',146],['Independent learning: pre reading',148]],
};
// invented demo state. b: 0 none, 1 trying, 2 practising, 3 embedded. pips: lesson uses this term (0-5)
const STATE = {
  'Cold calling': { b: 3, pips: 5 }, 'Check for understanding': { b: 2, pips: 4, goal: true, stage: 3, notes: true },
  'Show-me boards': { b: 2, pips: 3 }, 'Think, pair, share': { b: 3, pips: 4 },
  'Quizzing': { b: 3, pips: 5 }, 'Worked examples and backward fading': { b: 1, pips: 1 },
  'Say it again better': { b: 1, pips: 2 }, 'Live modelling': { b: 3, pips: 3 },
  'Sequence concepts in small steps': { b: 2, pips: 2 }, 'Rehearse routines': { b: 3, pips: 2 },
  'Weekly and monthly review': { b: 0, pips: 1 }, 'Whole class feedback': { b: 2, pips: 2 },
  'Dual coding': { b: 1, pips: 2 }, 'Oracy: debating': { b: 1, pips: 1 }, 'Probing questions': { b: 0, pips: 2 },
  'Collaborative learning': { b: 2, pips: 3 },
};
const ROADS = [['Think, pair, share','Cold calling'],['Cold calling','Check for understanding'],['Show-me boards','Check for understanding'],['Check for understanding','Say it again better'],['Quizzing','Weekly and monthly review'],['Live modelling','Worked examples and backward fading'],['Check for understanding','Whole class feedback']];
const SECTOR = ['QF', 'PR', 'CP', 'EM', 'BR', 'MB'];
const DIRS = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const S = 46, R3 = Math.sqrt(3);
const toPx = (q, r) => [S * R3 * (q + r / 2), S * 1.5 * r];
const corners = (cx, cy, s = S) => Array.from({ length: 6 }, (_, i) => { const a = Math.PI / 180 * (60 * i - 30); return [cx + s * Math.cos(a), cy + s * Math.sin(a)]; });
const pts = c => c.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ');
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const isNeighbour = (a, b) => DIRS.some(([dq, dr]) => a.q === b.q + dq && a.r === b.r + dr);

const board = document.getElementById('board');
const defs = el('defs', {}, board);
defs.innerHTML = `
  <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b8322a"/></marker>
  <pattern id="t-QF" width="14" height="16" patternUnits="userSpaceOnUse"><rect width="14" height="16" fill="#e2b13c"/><path d="M4 15 V6 M4 7 l-2.2-2.4 M4 7 l2.2-2.4 M4 10 l-2-2 M4 10 l2-2 M11 9 V1 M11 3 l-2-2 M11 3 l2-2" stroke="#b8861d" stroke-width="1.1" fill="none"/></pattern>
  <pattern id="t-PR" width="18" height="10" patternUnits="userSpaceOnUse"><rect width="18" height="10" fill="#c4623a"/><path d="M0 0.5 H18 M0 5.5 H18 M5 0.5 V5.5 M14 5.5 V10.5" stroke="#9c4626" stroke-width="1"/></pattern>
  <pattern id="t-CP" width="26" height="20" patternUnits="userSpaceOnUse"><rect width="26" height="20" fill="#8d949a"/><path d="M1 17 L8 6 L15 17 Z" fill="#6f777d"/><path d="M8 6 L5.6 9.8 L10.4 9.8 Z" fill="#eef0f1"/><path d="M13 19 L19 10 L25 19 Z" fill="#7b8389"/></pattern>
  <pattern id="t-EM" width="16" height="18" patternUnits="userSpaceOnUse"><rect width="16" height="18" fill="#3f7d36"/><path d="M4 2 L8 10 H0 Z M4 6 L8.5 14 H-.5 Z" fill="#2a5e25"/><path d="M12 9 L15.5 16 H8.5 Z" fill="#2f6a2a"/><rect x="3.4" y="14" width="1.2" height="3" fill="#5a3b1e"/></pattern>
  <pattern id="t-BR" width="18" height="14" patternUnits="userSpaceOnUse"><rect width="18" height="14" fill="#93c457"/><path d="M2 6 l1.5-3 l1.5 3 M10 12 l1.5-3 l1.5 3" stroke="#6fa13b" stroke-width="1.1" fill="none"/><ellipse cx="14" cy="4" rx="2.6" ry="1.8" fill="#f7f4ea"/><circle cx="16.3" cy="3.6" r="1" fill="#3a3a3a"/></pattern>
  <pattern id="t-MB" width="20" height="12" patternUnits="userSpaceOnUse"><rect width="20" height="12" fill="#4fa3b4"/><path d="M0 4 q5 -3 10 0 t10 0 M0 10 q5 -3 10 0 t10 0" stroke="#7cc1cd" stroke-width="1.2" fill="none"/></pattern>
  <pattern id="t-desert" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#e3c98b"/><circle cx="3" cy="4" r=".9" fill="#c9a964"/><circle cx="10" cy="10" r=".9" fill="#c9a964"/><path d="M8 4 q2-2 4 0" stroke="#c9a964" fill="none"/></pattern>
  <pattern id="sea" width="44" height="22" patternUnits="userSpaceOnUse"><rect width="44" height="22" fill="#2f6e9e"/><path d="M0 11 q5.5 -5 11 0 t11 0 t11 0 t11 0" fill="none" stroke="#3f84b8" stroke-width="1.6"/></pattern>
  <pattern id="wood" width="120" height="12" patternUnits="userSpaceOnUse"><rect width="120" height="12" fill="#8a5a2e"/><path d="M0 4 q30 -2 60 0 t60 0 M0 9 q40 2 80 0 t40 0" stroke="#74491f" stroke-width="1.2" fill="none"/></pattern>`;
const gFrame = el('g', {}, board), gShore = el('g', {}, board), gTiles = el('g', {}, board), gRoads = el('g', {}, board), gTop = el('g', {}, board);

// one island: a radius-4 hex board split into six wedges, one per series; desert in the middle
const tiles = {}; const cells = {};
let order = 0;
SECTOR.forEach(sk => cells[sk] = []);
for (let k = 1; k <= 4; k++) {
  let q = DIRS[4][0] * k, r = DIRS[4][1] * k;
  for (let d = 0; d < 6; d++) for (let s = 0; s < k; s++) { cells[SECTOR[d]].push([q, r]); q += DIRS[d][0]; r += DIRS[d][1]; }
}
for (const sk of SECTOR) {
  // inner cells first so the techniques you use most sit near the middle
  const cs = cells[sk].slice().sort((a, b) => (Math.abs(a[0]) + Math.abs(a[1]) + Math.abs(a[0] + a[1])) - (Math.abs(b[0]) + Math.abs(b[1]) + Math.abs(b[0] + b[1])));
  T[sk].forEach(([name, page], i) => { const [q, r] = cs[i]; const [x, y] = toPx(q, r); tiles[name] = { name, page, sk, q, r, x, y, st: STATE[name] || { b: 0, pips: 0 }, i: order++ }; });
}
const all = Object.values(tiles);

      <div class="note">Grey lines: the book's wording, loaded privately from life-hub-data. Your adapted notes sit under each step.</div></div>
    ${st.pips ? `<div class="p-sec"><h3>Lesson reps</h3><div class="reps">${['Y10 · 14 Oct', 'Y9 · 16 Oct', 'Y10 · 21 Oct', 'Y9 · 23 Oct', 'Y10 · 27 Oct'].slice(0, st.pips).map(r => `<span>${r}</span>`).join('')}</div></div>` : ''}
    ${st.b >= 2 && !st.fresh ? `<div class="p-sec"><h3>Student evidence</h3><div class="ev">
      <div class="row"><span>Before</span><div class="bar"><i data-w="58"></i></div><span>58%</span></div>
      <div class="row"><span>Now</span><div class="bar"><i data-w="71"></i></div><span>71%</span></div></div>
      <div class="note">First-attempt scores on the questions this technique targets.</div></div>` : ''}
    <div class="p-actions">${st.goal ? '<button class="on">Keep going</button><button>Move on</button>' : '<button class="on" id="startGoal">Start a goal</button><button>Open in a lesson</button>'}</div>`;
  panel.classList.add('open'); hand.classList.add('hide');
  panel.querySelector('.close').onclick = closePanel;
  const sg = panel.querySelector('#startGoal'); if (sg) sg.onclick = () => { if (t === robT && !robberGone) placeGoal(); else { makeGoal(t); openPanel(t); } };
  requestAnimationFrame(() => panel.querySelectorAll('.bar i').forEach(b => b.style.width = b.dataset.w + '%'));
  const narrow = innerWidth <= 700; const w = narrow ? 360 : 560, h = w * vb[3] / vb[2];
  animateVB([t.x - w * (narrow ? .5 : .38), t.y - h * (narrow ? .14 : .5), w, h]);
  all.forEach(o => o.g.classList.toggle('dim', o !== t && !isNeighbour(o, t)));
}
function closePanel() { panel.classList.remove('open'); hand.classList.remove('hide'); all.forEach(o => o.g.classList.remove('dim')); }
function makeGoal(t) {
  if (t.bEl) t.bEl.remove();
  const b = building(1, t.x, t.y, true); gBuild.appendChild(b); t.bEl = b;
  Object.assign(t.st, { b: Math.max(1, t.st.b), goal: true, stage: 0, fresh: true });
  goalRing(t, t.g);
}

// robber actions
let robberGone = false; const sug = document.getElementById('suggest');
function placeGoal() {
  robberGone = true; robber.classList.add('gone'); sug.classList.add('gone');
  setTimeout(() => makeGoal(robT), 450);
  setTimeout(() => openPanel(robT), 900);
}
document.getElementById('placeGoal').onclick = placeGoal;
document.getElementById('showRobber').onclick = () => openPanel(robT);
document.getElementById('dismiss').onclick = () => { sug.classList.add('gone'); robber.classList.add('gone'); robberGone = true; };
</script>
</body>
</html>
