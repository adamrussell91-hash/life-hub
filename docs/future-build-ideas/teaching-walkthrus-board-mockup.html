<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WalkThrus board mockup</title>
<style>
  :root {
    --bg: #ffffff; --paper: #ffffff; --ink: #1a1a1a; --tab: #2f2f2f; --muted: #6b6b6b; --line: #e3e3e3;
    --yellow: #ffd400; --blue: #2da8e0; --green: #9dc33b; --pink: #e6258f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #161616; --paper: #1f1f1f; --ink: #f2f2f2; --muted: #a8a8a8; --line: #333; }
  }
  :root[data-theme="dark"] { --bg: #161616; --paper: #1f1f1f; --ink: #f2f2f2; --muted: #a8a8a8; --line: #333; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.4 "Helvetica Neue", Arial, system-ui, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: stretch; background: var(--yellow); flex-wrap: wrap; }
  .brand { background: #111; color: #fff; padding: 10px 26px 10px 16px; font-weight: 900; font-size: 20px; letter-spacing: .02em; clip-path: polygon(0 0, 100% 0, calc(100% - 16px) 100%, 0 100%); display: flex; align-items: center; }
  .brand span { font-weight: 300; letter-spacing: .35em; font-size: 15px; margin-left: 14px; }
  .title { display: flex; align-items: center; padding: 0 16px; font-weight: 800; color: #111; font-size: 15px; }
  .tools { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 8px 12px; }
  button { font: inherit; font-size: 12.5px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; border: 2px solid #111; background: #fff; color: #111; border-radius: 0; padding: 6px 11px; cursor: pointer; transition: background .15s, transform .1s; }
  button:hover { background: #fff7c2; }
  button:active { transform: translateY(1px); }
  button.on { background: #111; color: #fff; }
  main { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  svg#board { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; background: var(--bg); }
  svg#board.dragging { cursor: grabbing; }
  svg#board.drawing { cursor: crosshair; }

  .hex { cursor: pointer; transform-box: fill-box; transform-origin: center; transition: transform .25s cubic-bezier(.2,.8,.2,1), filter .25s, opacity .3s; }
  .hex:hover { transform: scale(1.05); filter: drop-shadow(0 6px 8px rgba(0,0,0,.18)); }
  .hex.pick { filter: drop-shadow(0 0 0 #000) drop-shadow(0 0 5px #111); }
  .hex.dim { opacity: .3; }
  .face { stroke: none; }
  .tabbar { fill: var(--tab); }
  .tabtext { font-size: 8.2px; font-weight: 800; fill: #fff; text-anchor: middle; letter-spacing: .03em; }
  .htitle { font-size: 8.6px; font-weight: 900; fill: #111; text-anchor: middle; letter-spacing: .01em; }
  .glyph { fill: none; stroke: #111; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .badge { fill: #111; }
  .dot { fill: #111; }
  .cl-label { font-size: 13px; font-weight: 900; letter-spacing: .08em; fill: var(--ink); }
  .cl-bar { fill: var(--yellow); }
  .pop { animation: pop .5s cubic-bezier(.2,.9,.3,1.3) both; }
  @keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }

  .arrow { fill: none; stroke: var(--ink); stroke-width: 1.8; pointer-events: stroke; }
  .arrow.new { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw .8s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .knot circle { fill: var(--bg); stroke: var(--ink); stroke-width: 1.8; }
  .knot path { fill: var(--ink); }
  .arrow-label { font-size: 8px; font-weight: 800; letter-spacing: .06em; fill: var(--ink); }
  .arrowg { cursor: help; }
  .robber { cursor: pointer; transition: transform .6s cubic-bezier(.5,0,.2,1), opacity .4s; }
  .robber.gone { opacity: 0; transform: translateY(-40px); }
  .chip rect { fill: var(--bg); stroke: var(--ink); stroke-width: 1.8; }
  .chip text { font-size: 9px; font-weight: 900; letter-spacing: .06em; fill: var(--ink); text-anchor: middle; }
  .chip { cursor: pointer; }
  .boxed .face { fill: var(--bg); stroke: var(--blue); stroke-width: 2; stroke-dasharray: 5 4; }
  .boxed .q { font-size: 18px; font-weight: 900; fill: var(--blue); text-anchor: middle; }

  /* five-step strip, opened with the magnifier */
  .strip { animation: stripIn .45s cubic-bezier(.2,.8,.2,1) both; transform-box: fill-box; transform-origin: bottom center; }
  @keyframes stripIn { from { opacity: 0; transform: translateY(16px) scale(.92); } to { opacity: 1; transform: none; } }
  .panel-sq { stroke: none; }
  .stepnum { font-size: 7px; font-weight: 900; fill: #fff; }
  .steplab { fill: #3a3a3a; }
  .ph { fill: #d9d9d9; }
  .mag { cursor: pointer; }

  /* side panel */
  #panel { position: absolute; top: 0; right: 0; bottom: 0; width: min(380px, 100%); background: var(--paper); border-left: 3px solid #111; transform: translateX(105%); transition: transform .45s cubic-bezier(.2,.8,.2,1); overflow-y: auto; padding: 0 0 28px; }
  #panel.open { transform: none; }
  #panel .close { position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; padding: 0; }
  .p-head { background: var(--c); padding: 16px 52px 16px 18px; position: relative; color: #111; }
  .p-code { display: inline-block; background: #2f2f2f; color: #fff; font-size: 11px; font-weight: 800; padding: 3px 9px; letter-spacing: .04em; }
  .p-name { font-size: 22px; font-weight: 900; line-height: 1.05; margin-top: 8px; text-transform: uppercase; }
  .p-ser { font-size: 12px; font-weight: 700; margin-top: 4px; }
  .p-body { padding: 0 18px; }
  .p-sec { margin-top: 18px; }
  .p-sec h3 { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 900; }
  .steps { display: grid; gap: 8px; }
  .step { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start; }
  .step .n { width: 26px; height: 22px; background: #2f2f2f; color: #fff; font-weight: 900; display: grid; place-items: center; font-size: 12px; }
  .step .book { height: 9px; background: var(--line); margin: 3px 0 5px; }
  .step .book.short { width: 70%; }
  .step .mine { font-size: 12.5px; padding: 6px 8px; border-left: 4px solid var(--c); background: color-mix(in srgb, var(--c) 14%, var(--paper)); }
  .note { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
  .reps { display: flex; gap: 4px; flex-wrap: wrap; }
  .reps span { font-size: 11.5px; padding: 3px 8px; border: 1.5px solid var(--ink); font-weight: 700; }
  .ev { display: grid; gap: 6px; }
  .ev .row { display: grid; grid-template-columns: 60px 1fr 40px; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700; }
  .ev .bar { height: 12px; background: var(--line); overflow: hidden; }
  .ev .bar i { display: block; height: 100%; background: var(--c); width: 0; transition: width .9s cubic-bezier(.2,.8,.2,1); }
  .p-actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .chain { font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-weight: 700; }
  .chain b { padding: 3px 8px; border: 1.5px solid var(--ink); }
  .adapt-svg { width: 100%; height: auto; display: block; }
  .adapt-svg text { font-family: inherit; }

  #suggest { position: absolute; left: 16px; top: 16px; width: min(290px, calc(100% - 32px)); font-size: 12.5px; background: var(--paper); border: 2.5px solid #111; padding: 0 0 12px; box-shadow: 6px 6px 0 var(--yellow); transition: transform .5s cubic-bezier(.2,.8,.2,1), opacity .4s; }
  #suggest.gone { transform: translateY(-20px); opacity: 0; pointer-events: none; }
  #suggest .t { background: #111; color: #fff; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; font-weight: 900; padding: 6px 12px; }
  #suggest p { margin: 8px 12px; font-size: 12.5px; }
  #suggest button { font-size: 11px; padding: 5px 9px; }
  #suggest .acts { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 14px; }
  #hand { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; gap: 8px; max-width: calc(100% - 32px); overflow-x: auto; padding: 8px 4px 2px; transition: opacity .3s, transform .3s; }
  .card { flex: none; width: 98px; background: var(--paper); border: 2px solid #111; cursor: pointer; transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s; box-shadow: 4px 4px 0 var(--pink); }
  .card:hover { transform: translateY(-6px); box-shadow: 6px 8px 0 var(--pink); }
  .card .k { background: #111; color: #fff; font-size: 9px; letter-spacing: .12em; text-transform: uppercase; font-weight: 900; padding: 4px 7px; }
  .card .v { font-weight: 900; font-size: 11.5px; padding: 5px 7px 0; text-transform: uppercase; line-height: 1.05; }
  .card .u { font-size: 9.5px; color: var(--muted); padding: 2px 7px 6px; }
  #legend { position: absolute; right: 16px; top: 16px; background: var(--paper); border: 2.5px solid #111; padding: 10px 12px; font-size: 12px; display: grid; gap: 6px; transition: opacity .3s, transform .3s; box-shadow: 6px 6px 0 var(--yellow); }
  #legend .lh { font-weight: 900; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; margin-top: 2px; }
  #legend .sw { display: inline-block; width: 14px; height: 12px; vertical-align: -2px; margin-right: 6px; clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); }
  #legend svg { vertical-align: middle; margin-right: 6px; }
  #legend.hide, #hand.hide { opacity: 0; pointer-events: none; }
  .tip { position: absolute; pointer-events: none; background: #111; color: #fff; font-size: 12px; padding: 6px 9px; max-width: 240px; opacity: 0; transform: translateY(4px); transition: opacity .15s, transform .15s; z-index: 5; }
  .tip.show { opacity: 1; transform: none; }
  .zoom { position: absolute; left: 16px; bottom: 96px; display: grid; gap: 6px; }
  .zoom button { width: 36px; height: 36px; padding: 0; font-size: 18px; }
  @media (max-width: 700px) {
    #legend { display: none; }
    .title { display: none; }
    #panel { top: auto; height: 72%; width: 100%; border-left: 0; border-top: 3px solid #111; transform: translateY(105%); }
    #panel.open { transform: none; }
    main:has(#panel.open) #suggest { opacity: 0; pointer-events: none; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">WALKTHRUs<span>BOARD</span></div>
  <div class="title">Professional learning</div>
  <div class="tools">
    <button id="drawBtn" title="Click one hex, then another">Draw arrow</button>
    <button id="seriesBtn">Series</button>
    <button id="keyBtn">Key</button>
    <button id="resetBtn">Reset</button>
  </div>
</header>
<main>
  <svg id="board" aria-label="WalkThrus board"></svg>
  <div id="suggest">
    <div class="t">Pattern spotted</div>
    <p><b>Recall gap</b> on 3 quizzes in 3 weeks, Year 9 and Year 10. The robber is on <b>Weekly and monthly review</b>.</p>
    <div class="acts">
      <button class="on" id="placeGoal">Make it a goal</button>
      <button id="showRobber">Show me</button>
      <button id="dismiss">Dismiss</button>
    </div>
  </div>
  <div id="legend" class="hide"></div>
  <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button></div>
  <div id="hand"></div>
  <aside id="panel" aria-live="polite"></aside>
  <div class="tip" id="tip"></div>
</main>

<script>
// colour shows the set (book volume); the black tab shows the series
const SETS = { 1: { name: 'Set 1', hex: '#ffd400' }, 2: { name: 'Set 2', hex: '#2da8e0' }, 3: { name: 'Set 3', hex: '#9dc33b' } };
const SERIES = {
  QF: { code: 'Q&F', name: 'Questioning & feedback' },
  PR: { code: 'P&R', name: 'Practice & retrieval' },
  EM: { code: 'E&M', name: 'Explaining & modelling' },
  CP: { code: 'CP',  name: 'Curriculum planning' },
  BR: { code: 'B&R', name: 'Behaviour & relationships' },
  MB: { code: 'MB',  name: 'Mode B teaching' },
};
const T = {
  QF: [['Check for understanding',96],['Cold calling',90],['Show-me boards',94],['Think, pair, share',92],['Say it again better',98],['Probing questions',100],['Process questions',102],['Whole class feedback',108],['Feedback that moves forward',104],['Feedback as actions',106]],
  PR: [['Quizzing',112],['Weekly and monthly review',122],['Elaborative interrogation',114],['Using a knowledge organiser',116],['Rehearsal and performance',118],['Peer supported retrieval',120],['Concrete examples',124],['Guided practice',126],['Independent practice',128],['Building fluency',130]],
  EM: [['Live modelling',78],['Worked examples and backward fading',68],['Dual coding',70],['Deliberate vocabulary development',72],['Big picture, small picture',74],['Abstract models with concrete examples',76],['Scaffolding',80],['Metacognitive talk',82],['Set the standards',84],['Head on misconceptions',86]],
  CP: [['Sequence concepts in small steps',52],['Designing a knowledge rich curriculum',50],['Coherent mapping',54],['Blend knowledge and experience',56],['Pitch it up',58],['Plan for reading',60],['Tiered questions and problems',62],['Deliver core; signpost hinterland',64]],
  BR: [['Rehearse routines',44],['Positive relationships',36],['Establish your expectations',38],['Signal, pause, insist',40],['Positive framing',42],['Choices and consequences',46]],
  MB: [['Collaborative learning',134],['Oracy: debating',142],['Homework as guided study',136],['Enquiry projects',138],['Open response tasks',140],['Oracy: talk for writing',144],['Oracy: instructional inputs',146],['Independent learning: pre reading',148]],
};
// invented demo state. b: 0 none, 1 trying, 2 practising, 3 embedded. pips: lesson uses this term
const STATE = {
  'Cold calling': { b: 3, pips: 5 }, 'Check for understanding': { b: 2, pips: 4, goal: true, stage: 3, notes: true },
  'Show-me boards': { b: 2, pips: 3 }, 'Think, pair, share': { b: 3, pips: 4 },
  'Quizzing': { b: 3, pips: 5 }, 'Worked examples and backward fading': { b: 1, pips: 1 },
  'Say it again better': { b: 1, pips: 2 }, 'Live modelling': { b: 3, pips: 3 },
  'Sequence concepts in small steps': { b: 2, pips: 2 }, 'Rehearse routines': { b: 3, pips: 2 },
  'Weekly and monthly review': { b: 0, pips: 1 }, 'Whole class feedback': { b: 2, pips: 2 },
  'Dual coding': { b: 1, pips: 2 }, 'Oracy: debating': { b: 1, pips: 1 }, 'Probing questions': { b: 0, pips: 2 },
  'Collaborative learning': { b: 2, pips: 3 },
};
const ARROWS = [['Think, pair, share','Cold calling'],['Cold calling','Check for understanding'],['Show-me boards','Check for understanding'],['Check for understanding','Say it again better'],['Quizzing','Weekly and monthly review'],['Live modelling','Worked examples and backward fading'],['Check for understanding','Quizzing', 'then retrieve'],['Rehearse routines','Think, pair, share', 'routine first']];

// flat-topped hexes on one shared grid, so clusters can snap anywhere
const S = 50, R3 = Math.sqrt(3), H = S * R3 / 2;
// tiles are drawn a little smaller than their grid cell, so clusters keep the book's white gaps
const SF = S - 3, HF = SF * R3 / 2;
const DIRS = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const toPx = (q, r) => [S * 1.5 * q, S * R3 * (r + q / 2)];
const toAx = (x, y) => { const q = Math.round(x / (1.5 * S)); return [q, Math.round(y / (R3 * S) - q / 2)]; };
const corners = (cx, cy, s = S) => Array.from({ length: 6 }, (_, i) => { const a = Math.PI / 3 * i; return [cx + s * Math.cos(a), cy + s * Math.sin(a)]; });
const pts = c => c.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ');
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const isNeighbour = (a, b) => DIRS.some(([dq, dr]) => a.q === b.q + dq && a.r === b.r + dr);
function spiral(cq, cr, n) {
  const out = [[cq, cr]];
  for (let k = 1; out.length < n; k++) {
    let q = cq + DIRS[4][0] * k, r = cr + DIRS[4][1] * k;
    for (let d = 0; d < 6 && out.length < n; d++) for (let s = 0; s < k && out.length < n; s++) { out.push([q, r]); q += DIRS[d][0]; r += DIRS[d][1]; }
  }
  return out;
}

const board = document.getElementById('board');
const defs = el('defs', {}, board);
defs.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>`;
const gLabels = el('g', {}, board), gArrows = el('g', {}, board), gTiles = el('g', {}, board), gTop = el('g', {}, board), gStrip = el('g', {}, board);
gArrows.style.color = 'var(--ink)';

// clusters laid out like the book's cluster sheets: white space between them for arrows
const CL = { QF: [0, -150], PR: [470, -150], EM: [-470, -150], CP: [-470, 300], BR: [0, 300], MB: [470, 300] };
const tiles = {}; let order = 0;
for (const sk of Object.keys(CL)) {
  const [cq, cr] = toAx(...CL[sk]);
  const cells = spiral(cq, cr, T[sk].length);
  T[sk].forEach(([name, page], i) => { const [q, r] = cells[i]; const [x, y] = toPx(q, r); tiles[name] = { name, page, sk, set: 1, q, r, x, y, st: STATE[name] || { b: 0, pips: 0 }, i: order++ }; });
  const ys = cells.map(c => toPx(...c)[1]), xs = cells.map(c => toPx(...c)[0]);
  const lx = Math.min(...xs) - S, ly = Math.min(...ys) - H - 22;
  el('rect', { class: 'cl-bar', x: lx, y: ly - 11, width: 6, height: 14 }, gLabels);
  const t = el('text', { class: 'cl-label', x: lx + 12, y: ly }, gLabels); t.textContent = SERIES[sk].name.toUpperCase();
}
const all = Object.values(tiles);

function wrap(text, max = 12) {
  const words = text.toUpperCase().split(' '); const lines = []; let cur = '';
  for (const w of words) { if ((cur + ' ' + w).trim().length > max && cur) { lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); }
  if (cur) lines.push(cur); return lines.slice(0, 3);
}

// placeholder line icons, one per series, until the custom set arrives
function glyph(sk, x, y, g) {
  const p = (d) => el('path', { class: 'glyph', d }, g);
  const head = (hx, hy, r = 3.2) => el('circle', { class: 'glyph', cx: hx, cy: hy, r }, g);
  if (sk === 'QF') { head(x - 6, y - 4); p(`M${x - 6} ${y - 1} v9 M${x - 6} ${y + 2} l6 -3`); p(`M${x + 2} ${y - 11} h10 v7 h-6 l-3 3 v-3 h-1 z`); }
  if (sk === 'PR') { p(`M${x - 8} ${y} a8 8 0 1 1 3 6`); p(`M${x - 9} ${y + 5} l1 -5 l5 1`); p(`M${x - 2} ${y - 3} l2 2 l4 -5`); }
  if (sk === 'EM') { head(x - 7, y - 4); p(`M${x - 7} ${y - 1} v9 M${x - 7} ${y + 2} l7 -6`); p(`M${x + 2} ${y - 10} h11 v9 h-11 z M${x + 4} ${y - 7} h5 M${x + 4} ${y - 4} h7`); }
  if (sk === 'CP') { p(`M${x - 11} ${y + 7} h6 v-5 h6 v-5 h6 v-5 h5`); p(`M${x - 9} ${y + 7} v3 M${x + 9} ${y - 9} v-3`); }
  if (sk === 'BR') { head(x, y - 6); p(`M${x} ${y - 3} v9 M${x} ${y} l-6 -7 M${x} ${y} l6 3`); p(`M${x - 11} ${y + 7} h22`); }
  if (sk === 'MB') { head(x - 8, y - 2, 2.8); head(x, y - 6, 2.8); head(x + 8, y - 2, 2.8); p(`M${x - 8} ${y + 1} v6 M${x} ${y - 3} v6 M${x + 8} ${y + 1} v6 M${x - 8} ${y + 3} l8 -3 l8 3`); }
}

// progress piece in the bottom badge: dashed house, house, city
function piece(b, x, y, g, place) {
  const pg = el('g', { class: place ? 'pop' : '' }, g);
  el('rect', { class: 'badge', x: x - 7.5, y: y - 7.5, width: 15, height: 15 }, pg);
  if (!b) { el('circle', { cx: x, cy: y, r: 1.6, fill: '#fff' }, pg); return pg; }
  const w = { fill: b === 1 ? 'none' : '#fff', stroke: '#fff', 'stroke-width': 1.1 };
  if (b === 1) w['stroke-dasharray'] = '1.6 1.2';
  if (b < 3) el('path', { d: `M${x - 4} ${y + 4} v-4 l4 -4 l4 4 v4 z`, ...w }, pg);
  else { el('path', { d: `M${x - 5} ${y + 4.5} v-4 l3 -3 l3 3 v-3 l2.5 -3 l2.5 3 v7 z`, ...w }, pg); }
  return pg;
}

function tabPoints(x, y, t = 13) { const dd = t * (SF / 2) / HF; return pts([[x - SF / 2, y - HF], [x + SF / 2, y - HF], [x + SF / 2 + dd, y - HF + t], [x - SF / 2 - dd, y - HF + t]]); }

function drawTile(t, delay) {
  const s = SERIES[t.sk];
  const g = el('g', { class: 'hex pop', style: `animation-delay:${delay}ms` }, gTiles);
  el('polygon', { class: 'face', points: pts(corners(t.x, t.y, SF)), fill: SETS[t.set].hex }, g);
  el('polygon', { class: 'tabbar', points: tabPoints(t.x, t.y) }, g);
  const tt = el('text', { class: 'tabtext', x: t.x, y: t.y - HF + 9.6 }, g); tt.textContent = `${s.code} | ${t.page}`;
  const lines = wrap(t.name);
  lines.forEach((ln, i) => { const tx = el('text', { class: 'htitle', x: t.x, y: t.y - 17 + i * 9.4 + (lines.length === 1 ? 5 : 0) }, g); tx.textContent = ln; });
  glyph(t.sk, t.x, t.y + 18, g);
  t.pieceEl = piece(t.st.b, t.x - 2, t.y + HF - 9, g);
  for (let p = 0; p < t.st.pips; p++) el('circle', { class: 'dot', cx: t.x + 9 + p * 4, cy: t.y + HF - 9, r: 1.3 }, g);
  if (t.st.goal) goalRing(t, g);
  t.g = g;
  g.addEventListener('pointerenter', e => tip(e, `<b>${t.name}</b><br>${s.name} · ${SETS[t.set].name}<br>Used in ${t.st.pips} lesson${t.st.pips === 1 ? '' : 's'} this term`));
  g.addEventListener('pointerleave', () => tip());
  g.addEventListener('click', () => { if (moved) return; drawing ? pickForArrow(t) : openTile(t); });
}
function goalRing(t, g) {
  const ring = el('polygon', { points: pts(corners(t.x, t.y, S + 3)), fill: 'none', stroke: '#111', 'stroke-width': 3, 'stroke-dasharray': '8 5' }, g);
  el('animate', { attributeName: 'stroke-dashoffset', from: 0, to: 26, dur: '1.3s', repeatCount: 'indefinite' }, ring);
}
all.slice().sort((a, b) => a.i - b.i).forEach((t, i) => drawTile(t, 100 + i * 16));

// arrows: a knot with a chevron on a shared edge; a thin black line through the white space otherwise
function addArrow(a, b, label, animate) {
  const A = tiles[a], B = tiles[b]; const dx = B.x - A.x, dy = B.y - A.y; const d = Math.hypot(dx, dy); const ux = dx / d, uy = dy / d;
  const g = el('g', { class: 'arrowg' }, isNeighbour(A, B) ? gTop : gArrows);
  if (isNeighbour(A, B)) {
    const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
    const k = el('g', { class: 'knot' + (animate ? ' pop' : '') }, g);
    el('circle', { cx: mx, cy: my, r: 6 }, k);
    el('path', { d: `M${mx + ux * 3.5} ${my + uy * 3.5} L${mx - ux * 2 - uy * 3} ${my - uy * 2 + ux * 3} L${mx - ux * 2 + uy * 3} ${my - uy * 2 - ux * 3} Z` }, k);
  } else {
    // leave from the hex edge, bow out into white space, arrive at the far hex edge
    const off = S + 4; const x1 = A.x + ux * off, y1 = A.y + uy * off, x2 = B.x - ux * (off + 2), y2 = B.y - uy * (off + 2);
    const bend = Math.min(110, d * .3); const cx = (x1 + x2) / 2 - uy * bend, cy = (y1 + y2) / 2 + ux * bend;
    el('circle', { cx: x1, cy: y1, r: 3, fill: 'var(--bg)', stroke: 'var(--ink)', 'stroke-width': 1.8 }, g);
    const p = el('path', { class: 'arrow' + (animate ? ' new' : ''), d: `M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2}`, 'marker-end': 'url(#ah)' }, g);
    if (animate) p.style.setProperty('--len', p.getTotalLength());
    if (label) { const lx = .25 * x1 + .5 * cx + .25 * x2, ly = .25 * y1 + .5 * cy + .25 * y2; const tx = el('text', { class: 'arrow-label', x: lx, y: ly - 5, 'text-anchor': 'middle' }, g); tx.textContent = label.toUpperCase(); }
  }
  g.addEventListener('pointerenter', e => tip(e, `${a} → ${b}`)); g.addEventListener('pointerleave', () => tip());
}
setTimeout(() => ARROWS.forEach(([a, b, l], i) => setTimeout(() => addArrow(a, b, l, true), i * 130)), 1100);

// key
const pieceSvg = b => { const s = document.createElementNS(NS, 'svg'); s.setAttribute('width', 18); s.setAttribute('height', 18); s.setAttribute('viewBox', '-9 -9 18 18'); piece(b, 0, 0, s); return s.outerHTML; };
document.getElementById('legend').innerHTML = `

const keyBtn = document.getElementById('keyBtn'); keyBtn.onclick = () => { keyBtn.classList.toggle('on'); document.getElementById('legend').classList.toggle('hide'); };

// tooltip
const tipEl = document.getElementById('tip');
function tip(e, html) {
  if (!e) { tipEl.classList.remove('show'); return; }
  tipEl.innerHTML = html; const r = document.querySelector('main').getBoundingClientRect();
  tipEl.style.left = Math.min(e.clientX - r.left + 12, r.width - 250) + 'px'; tipEl.style.top = (e.clientY - r.top + 14) + 'px'; tipEl.classList.add('show');
}

// view box, pan, zoom (animated)
const bx = [...all.map(t => t.x), ...exPx.map(p => p[0])], by = [...all.map(t => t.y), ...exPx.map(p => p[1])];
const HOME = [Math.min(...bx) - S - 20, Math.min(...by) - H - 50, Math.max(...bx) - Math.min(...bx) + 2 * S + 40, Math.max(...by) - Math.min(...by) + 2 * H + 130];
let vb = HOME.slice(), anim;
const setVB = v => { vb = v; board.setAttribute('viewBox', v.map(n => n.toFixed(1)).join(' ')); };
setVB(HOME);
if (innerWidth <= 700) { const f = tiles['Check for understanding']; setVB([f.x - 200, f.y - 300, 400, 700]); }
function animateVB(to, ms = 650) {
  cancelAnimationFrame(anim); const from = vb.slice(), t0 = performance.now();
  const ease = x => 1 - Math.pow(1 - x, 3);
  const step = now => { const k = Math.min(1, (now - t0) / ms), e = ease(k); setVB(from.map((f, i) => f + (to[i] - f) * e)); if (k < 1) anim = requestAnimationFrame(step); };
  anim = requestAnimationFrame(step);
}
function zoomBy(f, cx, cy) {
  cx ??= vb[0] + vb[2] / 2; cy ??= vb[1] + vb[3] / 2;
  const w = Math.max(250, Math.min(HOME[2] * 1.5, vb[2] * f)), h = w * vb[3] / vb[2];
  animateVB([cx - (cx - vb[0]) * w / vb[2], cy - (cy - vb[1]) * h / vb[3], w, h], 300);
}
const toSvg = (cx, cy) => { const r = board.getBoundingClientRect(); const s = Math.max(vb[2] / r.width, vb[3] / r.height); const ox = (r.width * s - vb[2]) / 2, oy = (r.height * s - vb[3]) / 2; return [vb[0] - ox + (cx - r.left) * s, vb[1] - oy + (cy - r.top) * s]; };
board.addEventListener('wheel', e => { e.preventDefault(); const [x, y] = toSvg(e.clientX, e.clientY); zoomBy(e.deltaY > 0 ? 1.15 : 0.87, x, y); }, { passive: false });
let drag = null, moved = false;
board.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, vb: vb.slice() }; moved = false; });
window.addEventListener('pointermove', e => {
  if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!moved && Math.hypot(dx, dy) < 5) return; moved = true; board.classList.add('dragging'); tip();
  const r = board.getBoundingClientRect(); const s = Math.max(drag.vb[2] / r.width, drag.vb[3] / r.height);
  setVB([drag.vb[0] - dx * s, drag.vb[1] - dy * s, drag.vb[2], drag.vb[3]]);
});
window.addEventListener('pointerup', () => { drag = null; board.classList.remove('dragging'); setTimeout(() => moved = false, 0); });
document.getElementById('zin').onclick = () => zoomBy(.75);
document.getElementById('zout').onclick = () => zoomBy(1.33);
document.getElementById('resetBtn').onclick = () => { closeTile(); animateVB(HOME); };

// draw-arrow mode
let drawing = false, first = null;
const drawBtn = document.getElementById('drawBtn');
drawBtn.onclick = () => { drawing = !drawing; drawBtn.classList.toggle('on', drawing); board.classList.toggle('drawing', drawing); if (first) first.g.classList.remove('pick'); first = null; drawBtn.textContent = drawing ? 'Pick the start' : 'Draw arrow'; };
function pickForArrow(t) {

  if (first !== t) addArrow(first.name, t.name, '', true);

}

// series spotlight
let seriesOn = false; const seriesBtn = document.getElementById('seriesBtn');
seriesBtn.onclick = () => {

  const ks = Object.keys(SERIES); let i = 0;
  if (!seriesOn) { all.forEach(t => t.g.classList.remove('dim')); seriesBtn.textContent = 'Series'; clearInterval(seriesBtn.t); return; }
  const show = () => { const sk = ks[i++ % ks.length]; seriesBtn.textContent = SERIES[sk].code; all.forEach(t => t.g.classList.toggle('dim', t.sk !== sk)); };
  show(); seriesBtn.t = setInterval(show, 1600);
};

// open a tile: the five-step strip rises above it (the book's magnifier move) and the panel slides in
const panel = document.getElementById('panel');
const STAGES = ['ATTEMPT', 'DEVELOP', 'ADAPT', 'PRACTISE', 'TEST'];
function adaptChain(stage, colour) {
  // five flat-topped hexes in a row with a REPEAT loop over the top
  const s = 26, h = s * R3 / 2, gap = s * 1.5 + 1;
  let out = `<svg class="adapt-svg" viewBox="-6 -40 ${gap * 4 + s * 2 + 12} ${h * 2 + 62}">`;
  out += `<path d="M${s + gap * 4} ${-h + 2} V-26 H${s} V${-h - 4}" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#ahs)"/>`;
  out += `<defs><marker id="ahs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#111"/></marker></defs>`;
  out += `<text x="${s + gap * 2}" y="-30" text-anchor="middle" font-size="8" font-weight="900" letter-spacing=".08em" fill="#111">REPEAT · ITERATE, DEVELOP, IMPROVE</text>`;
  STAGES.forEach((w, i) => {
    const cx = s + gap * i, cy = i % 2 ? h * .55 : 0;
    const cs = corners(cx, cy, s).map(p => p.map(n => n.toFixed(1)).join(',')).join(' ');
    const fill = i < stage ? colour : i === stage ? '#111' : '#fff';
    const tcol = i === stage ? '#fff' : '#111';
    out += `<polygon points="${cs}" fill="${fill}" stroke="#111" stroke-width="${i === stage ? 3 : 2}"/>`;
    out += `<text x="${cx}" y="${cy + 3}" text-anchor="middle" font-size="7" font-weight="900" fill="${tcol}">${w}</text>`;
  });
  return out + '</svg>';
}
let openT = null;
function openTile(t) {
  closeStrip();
  openT = t;
  const s = SERIES[t.sk]; const st = t.st; const robHere = t === robT;
  const stage = st.goal ? st.stage : st.b === 3 ? 5 : st.b === 2 ? 2 : st.b === 1 ? 0 : -1;
  const colour = SETS[t.set].hex;
  panel.style.setProperty('--c', colour);
  panel.innerHTML = `
    <div class="p-head"><button class="close" aria-label="Close">✕</button>
      <span class="p-code">${s.code} | ${t.page}</span>
      <div class="p-name">${t.name}</div><div class="p-ser">${s.name} · ${SETS[t.set].name}</div></div>
    <div class="p-body">
    ${robHere ? `<div class="p-sec"><h3>Why the robber is here</h3><div class="chain"><b>3 quizzes</b>→<b>Recall</b>→<b>Practice &amp; retrieval</b>→<b>This technique</b></div><div class="note">Year 9 and Year 10, last 3 weeks. From quiz tags and markbook Patterns.</div></div>` : ''}
    <div class="p-sec"><h3>ADAPT</h3>${adaptChain(stage, colour)}${stage < 0 ? '<div class="note">No goal yet. Start one to place your first piece.</div>' : ''}</div>
    <div class="p-sec"><h3>The five steps</h3><div class="steps">${[1, 2, 3, 4, 5].map(n => `<div class="step"><div class="n">${n}</div><div><div class="book"></div><div class="book short"></div>${st.notes && n <= 3 ? `<div class="mine">${['Year 10: name the question type out loud first.', 'Wait a full 10 seconds on why-questions.', 'Start with a quiet student, not a volunteer.'][n - 1]}</div>` : ''}</div></div>`).join('')}</div>
      <div class="note">Grey lines: the book's wording, loaded privately from life-hub-data. Your adapted notes sit under each step.</div></div>
    ${st.pips ? `<div class="p-sec"><h3>Lesson reps</h3><div class="reps">${['Y10 · 14 Oct', 'Y9 · 16 Oct', 'Y10 · 21 Oct', 'Y9 · 23 Oct', 'Y10 · 27 Oct'].slice(0, st.pips).map(r => `<span>${r}</span>`).join('')}</div></div>` : ''}
    ${st.b >= 2 && !st.fresh ? `<div class="p-sec"><h3>Student evidence</h3><div class="ev">
      <div class="row"><span>Before</span><div class="bar"><i data-w="58"></i></div><span>58%</span></div>
      <div class="row"><span>Now</span><div class="bar"><i data-w="71"></i></div><span>71%</span></div></div>
      <div class="note">First-attempt scores on the questions this technique targets.</div></div>` : ''}
    <div class="p-actions">${st.goal ? '<button class="on">Keep going</button><button>Move on</button>' : '<button class="on" id="startGoal">Start a goal</button><button>Open in a lesson</button>'}</div>
    </div>`;
  panel.classList.add('open'); hand.classList.add('hide');
  panel.querySelector('.close').onclick = closeTile;
  const sg = panel.querySelector('#startGoal'); if (sg) sg.onclick = () => { if (t === robT && !robberGone) placeGoal(); else { makeGoal(t); openTile(t); } };
  requestAnimationFrame(() => panel.querySelectorAll('.bar i').forEach(b => b.style.width = b.dataset.w + '%'));
  drawStrip(t);
  const narrow = innerWidth <= 700; const w = narrow ? 420 : 760, h = w * vb[3] / vb[2];
  // desktop: keep the strip in the space left of the panel
  animateVB([t.x - w * (narrow ? .5 : .24), t.y - 150 - h * (narrow ? .12 : .32), w, h]);
  all.forEach(o => o.g.classList.toggle('dim', o !== t && !isNeighbour(o, t)));
}
function drawStrip(t) {
  const colour = SETS[t.set].hex;
  const P = 62, G = 7, W = P * 5 + G * 4, top = t.y - H - 40 - P - 22;
  const g = el('g', { class: 'strip' }, gStrip);
  // connector from the strip down to the tile
  el('path', { d: `M${t.x} ${top + P + 22} V${t.y - H - 4}`, stroke: '#111', 'stroke-width': 2.5, fill: 'none' }, g);
  el('rect', { x: t.x - W / 2 - 8, y: top - 8, width: W + 16, height: P + 34, fill: 'var(--bg)', stroke: '#111', 'stroke-width': 2.5 }, g);
  for (let i = 0; i < 5; i++) {
    const x = t.x - W / 2 + i * (P + G);
    el('rect', { class: 'panel-sq', x, y: top, width: P, height: P, fill: colour }, g);
    // placeholder figure until the custom step art arrives
    el('circle', { class: 'glyph', cx: x + P * .38, cy: top + P * .3, r: 4.5 }, g);
    el('path', { class: 'glyph', d: `M${x + P * .38} ${top + P * .3 + 4.5} v16 M${x + P * .38} ${top + P * .3 + 9} l${8 + i * 2} ${-4 + i * 2}` }, g);
    el('rect', { class: 'steplab', x, y: top + P - 11, width: 30, height: 11 }, g);
    const n = el('text', { class: 'stepnum', x: x + 4, y: top + P - 3 }, g); n.textContent = `STEP ${i + 1}`;
    el('rect', { class: 'ph', x, y: top + P + 5, width: P, height: 4 }, g);
    el('rect', { class: 'ph', x, y: top + P + 12, width: P * .6, height: 4 }, g);
  }
  // magnifier to close, like the book's minus glass
  const m = el('g', { class: 'mag' }, g);
  const mx = t.x + W / 2 + 26, my = top + P / 2;
  el('circle', { cx: mx, cy: my, r: 11, fill: 'var(--bg)', stroke: '#111', 'stroke-width': 3 }, m);
  el('path', { d: `M${mx - 5} ${my} h10 M${mx + 8} ${my + 8} l9 9`, stroke: '#111', 'stroke-width': 3, 'stroke-linecap': 'round' }, m);
  m.addEventListener('click', e => { e.stopPropagation(); closeTile(); });
}
function closeStrip() { gStrip.innerHTML = ''; }
function closeTile() { closeStrip(); openT = null; panel.classList.remove('open'); hand.classList.remove('hide'); all.forEach(o => o.g.classList.remove('dim')); }
function makeGoal(t) {
  t.pieceEl.remove();
  t.st.b = Math.max(1, t.st.b);
  t.pieceEl = piece(t.st.b, t.x - 2, t.y + HF - 9, t.g, true);
  Object.assign(t.st, { goal: true, stage: 0, fresh: true });
  goalRing(t, t.g);
}

// robber actions
let robberGone = false; const sug = document.getElementById('suggest');
function placeGoal() {
  robberGone = true; robber.classList.add('gone'); sug.classList.add('gone');

  setTimeout(() => openTile(robT), 900);
}
document.getElementById('placeGoal').onclick = placeGoal;
document.getElementById('showRobber').onclick = () => openTile(robT);
document.getElementById('dismiss').onclick = () => { sug.classList.add('gone'); robber.classList.add('gone'); robberGone = true; };
</script>
