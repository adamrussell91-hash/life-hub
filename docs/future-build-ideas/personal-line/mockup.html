<title>Personal Line Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a station-poster column. Builder strip on top, then the line board: a narrow track
   gutter on the left (lanes drawn in SVG), station rows to its right, term headers between. */
:root {
  --paper: #f6f4ef;
  --board: #ffffff;
  --ink: #13233a;
  --muted: #5d6878;
  --rule: #dcd8cf;
  --hush: #ecebe6;
  --night: #1d2633;
  --t-orange: #f26f21;
  --go: #2f9e44;
  --j: #0057b8; --j-fill: #d4e6ff;
  --i: #e0b400; --i-fill: #fff3b0; --i-ink: #13233a;
  --e: #009a3a; --e-fill: #c8f0d2;
  --r: #6b2d8e; --r-fill: #edd6fa;
  --stop: #ffffff;
  --display: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Public Sans", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0f141b; --board: #161d27; --ink: #eef2f7; --muted: #9aa6b6; --rule: #2a3442; --hush: #1c2430;
  --night: #0a0e13; --j: #4a90e8; --j-fill: #17304f; --i: #f0c400; --i-fill: #3d3410; --e: #22b85a; --e-fill: #133524;
  --r: #a56bd0; --r-fill: #2f1f3d; --stop: #f4f6f8; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0f141b; --board: #161d27; --ink: #eef2f7; --muted: #9aa6b6; --rule: #2a3442; --hush: #1c2430;
  --night: #0a0e13; --j: #4a90e8; --j-fill: #17304f; --i: #f0c400; --i-fill: #3d3410; --e: #22b85a; --e-fill: #133524;
  --r: #a56bd0; --r-fill: #2f1f3d; --stop: #f4f6f8; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 920px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 64px; display: grid; gap: 18px; }
.mock { font-size: 12px; color: var(--muted); letter-spacing: .02em; }
.mock b { color: var(--t-orange); text-transform: uppercase; letter-spacing: .08em; }

/* ---------- builder */
.builder { background: var(--board); border: 1px solid var(--rule); border-radius: 10px; padding: 16px; display: grid; gap: 14px; }
.builder h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1; text-wrap: balance; }
.field { display: grid; gap: 8px; }
.field > span { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip input { position: absolute; opacity: 0; pointer-events: none; }
.chip label { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border: 2px solid var(--rule); border-radius: 999px; cursor: pointer; font-weight: 600; user-select: none; }
.chip input:checked + label { border-color: var(--ink); background: var(--ink); color: var(--board); }
.chip input:focus-visible + label { outline: 3px solid var(--t-orange); outline-offset: 2px; }
.chip .rd { width: 24px; height: 24px; font-size: 14px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { font: 600 15px var(--body); min-height: 42px; padding: 0 18px; border-radius: 8px; border: 2px solid var(--ink); background: var(--board); color: var(--ink); cursor: pointer; }
.btn--go { background: var(--t-orange); border-color: var(--t-orange); color: #fff; }
.btn:focus-visible { outline: 3px solid var(--t-orange); outline-offset: 2px; }
.toast { font-size: 14px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 10px 12px; border-radius: 8px; background: var(--hush); }
.toast code { font: 600 13px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }

/* ---------- roundels */
.rd { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 6px; font: 700 16px/1 var(--display); color: #fff; flex: none; }
.rd--J { background: var(--j); } .rd--I { background: var(--i); color: var(--i-ink); } .rd--E { background: var(--e); } .rd--R { background: var(--r); }
.rd--sm { width: 20px; height: 20px; font-size: 12px; border-radius: 4px; }

/* ---------- line board (Arncliffe poster) */
.board { background: var(--board); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.board__top { background: var(--t-orange); color: #fff; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; }
.board__top strong { font: 700 26px/1.05 var(--display); }
.board__top .tee { width: 40px; height: 40px; border-radius: 50%; border: 3px solid #fff; display: grid; place-items: center; font: 700 22px var(--display); flex: none; }
.board__bar { background: var(--night); color: #fff; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 16px; }
.board__bar h2 { margin: 0; font: 600 24px/1.1 var(--display); text-wrap: balance; }
.board__bar .stamp { margin-left: auto; font-size: 12px; opacity: .8; }
.line { position: relative; padding: 14px 16px 26px 0; }
.line svg.tracks { position: absolute; left: 0; top: 0; width: var(--gutter); height: 100%; overflow: visible; pointer-events: none; }
.row { position: relative; display: grid; grid-template-columns: var(--gutter) minmax(0, 1fr) auto; align-items: center; column-gap: 12px; min-height: 64px; }
.term { display: grid; grid-template-columns: var(--gutter) minmax(0,1fr); column-gap: 12px; padding-block: 12px 4px; }
.term span { grid-column: 2; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 8px; }
.stopbtn { grid-column: 2 / 4; display: grid; grid-template-columns: minmax(0,1fr) auto; column-gap: 12px; align-items: center; text-align: left; font: inherit; color: inherit; background: none; border: 0; padding: 8px 10px; margin-left: -10px; border-radius: 8px; cursor: pointer; }
.stopbtn:hover { background: var(--hush); }
.stopbtn:focus-visible { outline: 3px solid var(--t-orange); outline-offset: 0; }
.stopname { font: 600 22px/1.12 var(--display); min-width: 0; overflow-wrap: anywhere; }
.row.is-shared .stopname { font-weight: 700; }
.badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; align-items: center; }
.kind { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-left: 4px; }
.when { text-align: right; font-variant-numeric: tabular-nums; }
.when b { display: block; font: 700 20px/1 var(--display); }
.when small { color: var(--muted); font-size: 12px; }
.row, .term { transition: none; }
.is-pending { opacity: 0; transform: translateY(6px); }
.is-arrived { opacity: 1; transform: none; transition: opacity .35s ease, transform .35s ease; }
.empty { padding: 28px 16px; color: var(--muted); }

/* ---------- departure-board card */
.scrim { position: fixed; inset: 0; background: rgb(10 14 19 / .55); display: grid; place-items: center; padding: 16px; z-index: 10; }
.card { width: min(560px, 100%); max-height: calc(100% - 8px); overflow: auto; background: var(--board); border-radius: 12px; border: 6px solid var(--night); box-shadow: 0 18px 50px rgb(0 0 0 / .35); }
.card__head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 14px; color: #fff; font: 600 18px var(--display); }
.card__head .now { font-size: 14px; opacity: .9; } .card__head .now b { font-size: 20px; margin-left: 6px; }
.card__body { padding: 14px 16px 18px; display: grid; gap: 14px; }
.card__title { display: flex; gap: 12px; align-items: flex-start; }
.card__title .rds { display: grid; gap: 4px; }
.card__title .rd { width: 40px; height: 40px; font-size: 24px; border-radius: 8px; }
.card__title h3 { margin: 0; font: 700 30px/1.02 var(--display); text-wrap: balance; }
.card__title p { margin: 4px 0 0; color: var(--muted); }
.cars { display: grid; gap: 6px; }
.cars__label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.cars__row { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 4px; }
.car { height: 34px; display: grid; place-items: center; font: 700 15px var(--display); background: var(--hush); color: var(--muted); clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
.car:first-child { clip-path: polygon(14% 0, 100% 0, 100% 100%, 0 100%); }
.car:last-child { clip-path: polygon(0 0, 86% 0, 100% 100%, 0 100%); }
.car.is-in { background: var(--car-fill); color: var(--ink); }
.car.is-you { background: var(--go); color: #fff; }
.split { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 12px; align-items: end; border-top: 1px solid var(--rule); padding-top: 12px; }
.split .k { font-size: 12px; color: var(--muted); }
.split .v { font: 700 22px/1.1 var(--display); }
.split .big { text-align: right; }
.split .big .v { font-size: 34px; color: var(--accent); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { background: var(--night); color: #fff; font: 600 13px var(--body); padding: 3px 8px; border-radius: 3px; }
.card p.desc { margin: 0; max-width: 65ch; }
.meta { font-size: 13px; color: var(--muted); }
.next { border-top: 1px solid var(--rule); padding-top: 10px; display: grid; gap: 6px; }
.next h4 { margin: 0; font: 600 16px var(--display); color: var(--muted); }
.next button { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 10px; align-items: center; text-align: left; font: inherit; color: inherit; background: none; border: 0; padding: 6px 0; cursor: pointer; border-radius: 6px; }
.next button span:nth-child(2) { font: 600 18px/1.1 var(--display); }
.next button:focus-visible { outline: 3px solid var(--t-orange); }
.card__foot { display: flex; flex-wrap: wrap; gap: 10px; }
.card__foot a { text-decoration: none; display: inline-flex; align-items: center; }
.close { background: none; border: 0; color: #fff; font: 600 15px var(--body); cursor: pointer; min-height: 32px; padding: 0 6px; }
.close:focus-visible { outline: 3px solid #fff; }

@media (max-width: 520px) {
  .board__top strong { font-size: 22px; }
  .stopname { font-size: 19px; }
  .when b { font-size: 17px; }
  .scrim { place-items: end center; padding: 0; }
  .card { border-radius: 14px 14px 0 0; border-width: 5px 0 0; max-height: 88%; }
}
@media (prefers-reduced-motion: reduce) { .is-pending { opacity: 1; transform: none; } }
</style>
<div class="wrap">
  <p class="mock"><b>Mockup</b> · real entries from the Programs catalogue · Publish saves nothing yet</p>

  <form class="builder" id="builder" aria-labelledby="builder-title">
    <h1 id="builder-title">Build a personal line</h1>
    <div class="field">
      <span id="year-label">Year level</span>
      <div class="chips" role="radiogroup" aria-labelledby="year-label" id="years"></div>
    </div>
    <div class="field">
      <span id="int-label">Interests</span>
      <div class="chips" role="group" aria-labelledby="int-label" id="strands"></div>
    </div>
    <div class="field">
      <label for="student" style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)">First name (optional)</label>
      <input id="student" type="text" value="Mia" maxlength="24" autocomplete="off" style="font:500 16px var(--body);min-height:42px;padding:0 12px;border:2px solid var(--rule);border-radius:8px;background:var(--board);color:var(--ink);max-width:280px">
    </div>
    <div class="actions">
      <button class="btn btn--go" type="submit">Build line</button>
      <button class="btn" type="button" id="publish">Publish</button>
    </div>
    <div class="toast" id="toast" hidden></div>
  </form>

  <section class="board" aria-labelledby="line-title">
    <div class="board__top"><strong>MindWorks Pathways</strong><span class="tee" aria-hidden="true">M</span></div>
    <div class="board__bar">
      <span id="line-rds" class="badges" style="margin:0"></span>
      <h2 id="line-title">Your line</h2>
      <span class="stamp" id="stamp">2026 · not yet published</span>
    </div>
    <div class="line" id="line"></div>
  </section>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="card-title" id="card"></div>
</div>

const LANE0 = 22, LANE_GAP = 26, PACK = 11;
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const svgNS = 'http://www.w3.org/2000/svg';

const state = { year: 9, strands: new Set(['J', 'R']) };
let rows = [];
let anims = [];

const $ = (id) => document.getElementById(id);
function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
function rd(k, small) { const s = el('span', `rd rd--${k}${small ? ' rd--sm' : ''}`, k); s.setAttribute('aria-hidden', 'true'); return s; }
function isLong(item) { return item.length === 'Year Long' || (item.types.includes('Program') && item.length === 'Long Term'); }

// ---------- builder controls
for (let y = 7; y <= 12; y += 1) {
  const c = el('span', 'chip');
  c.innerHTML = `<input type="radio" name="year" id="y${y}" value="${y}"${y === state.year ? ' checked' : ''}><label for="y${y}">Year ${y}</label>`;
  $('years').append(c);
}
for (const k of ORDER) {
  const c = el('span', 'chip');
  c.innerHTML = `<input type="checkbox" id="s${k}" value="${k}"${state.strands.has(k) ? ' checked' : ''}><label for="s${k}"></label>`;
  const lab = c.querySelector('label');
  lab.append(rd(k), document.createTextNode(STRANDS[k].name));
  $('strands').append(c);
}
$('builder').addEventListener('submit', (e) => {
  e.preventDefault();
  state.year = Number(document.querySelector('input[name=year]:checked').value);
  state.strands = new Set(ORDER.filter((k) => $(`s${k}`).checked));
  $('toast').hidden = true;
  $('stamp').textContent = '2026 · not yet published';
  build(true);
});
$('publish').addEventListener('click', () => {
  const slug = `${state.year}-${[...state.strands].join('').toLowerCase()}-${Math.random().toString(36).slice(2, 6)}`;
  const t = $('toast');
  t.hidden = false;
  t.innerHTML = '';
  t.append(el('strong', '', 'Published.'), el('span', '', 'Snapshot of this line, 14 Oct 2026:'), el('code', '', `life-hub.adam-russell.com/line/${slug}`));
  $('stamp').textContent = 'Snapshot · 14 Oct 2026';
});

// ---------- line
function pick() {
  const chosen = ORDER.filter((k) => state.strands.has(k));
  return DATA
    .filter((it) => it.years.includes(state.year))
    .map((it) => ({ ...it, on: it.strands.filter((k) => state.strands.has(k)) }))
    .filter((it) => it.on.length)
    .sort((a, b) => a.month - b.month || b.on.length - a.on.length || a.name.localeCompare(b.name))
    .map((it) => ({ ...it, on: chosen.filter((k) => it.on.includes(k)) }));
}

function build(animate) {
  anims.forEach((a) => a.cancel());
  anims = [];
  const chosen = ORDER.filter((k) => state.strands.has(k));
  const name = $('student').value.trim();
  $('line-title').textContent = `${name ? `${name}’s line` : 'Your line'} · Year ${state.year} · ${YEAR_LINE(state.year)}`;
  const rdsHost = $('line-rds');
  rdsHost.innerHTML = '';
  chosen.forEach((k) => rdsHost.append(rd(k)));
  const line = $('line');
  line.innerHTML = '';
  line.style.setProperty('--gutter', `${LANE0 * 2 + (chosen.length - 1) * LANE_GAP}px`);
  const items = pick();
  if (!chosen.length || !items.length) {
    line.append(el('p', 'empty', chosen.length ? `Nothing in the catalogue for Year ${state.year} on these lines yet.` : 'Pick at least one interest to build a line.'));
    return;
  }
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('class', 'tracks');
  svg.setAttribute('aria-hidden', 'true');
  line.append(svg);
  rows = [];
  for (const term of TERMS) {
    const inTerm = items.filter((it) => term.months.includes(it.month));
    if (!inTerm.length) continue;
    const head = el('div', 'term');
    head.append(el('span', '', term.label));
    line.append(head);
    rows.push({ node: head, item: null });
    for (const it of inTerm) {
      const row = el('div', `row${it.on.length > 1 ? ' is-shared' : ''}`);
      const btn = el('button', 'stopbtn');
      btn.type = 'button';
      const left = el('span', '');
      left.append(el('span', 'stopname', it.name));
      const badges = el('span', 'badges');
      it.on.forEach((k) => badges.append(rd(k, true)));
      badges.append(el('span', 'kind', isLong(it) ? 'Program' : it.types[0] || 'Competition'));
      left.append(badges);
      const when = el('span', 'when');
      when.append(el('b', '', MONTHS[it.month]), el('small', '', it.length || ''));
      btn.append(left, when);
      btn.addEventListener('click', () => openCard(it));
      row.append(btn);
      line.append(row);
      rows.push({ node: row, item: it });
    }
  }
  draw(svg, chosen, animate && !reduce);
}

function laneXs(chosen, it) {
  const base = chosen.map((_, i) => LANE0 + i * LANE_GAP);
  if (!it || it.on.length < 2) return base;
  const idx = it.on.map((k) => chosen.indexOf(k));
  const lo = Math.min(...idx), hi = Math.max(...idx);
  const centre = (base[lo] + base[hi]) / 2;
  const n = hi - lo + 1;
  return base.map((x, i) => (i < lo || i > hi ? x : centre + (i - lo - (n - 1) / 2) * PACK));
}

function draw(svg, chosen, animate) {
  svg.innerHTML = '';
  const box = $('line').getBoundingClientRect();
  const top = 6, bottom = box.height - 10;
  svg.setAttribute('viewBox', `0 0 ${LANE0 * 2 + (chosen.length - 1) * LANE_GAP} ${box.height}`);
  const stops = rows.filter((r) => r.item).map((r) => {
    const b = r.node.getBoundingClientRect();
    return { r, y: b.top - box.top + b.height / 2, xs: laneXs(chosen, r.item) };
  });
  const base = laneXs(chosen, null);
  const D = Math.min(5200, 700 + stops.length * 260);
  // Lanes: straight down, bending in to join at a shared stop and back out after it.
  const paths = chosen.map((k, li) => {
    let x = base[li];
    let d = `M ${x} ${top}`;
    let y = top;
    for (const s of stops) {
      const nx = s.xs[li];
      if (Math.abs(nx - x) > 0.5) {
        const y0 = Math.max(y, s.y - 30), y1 = s.y - 12;
        d += ` L ${x} ${y0} C ${x} ${(y0 + y1) / 2} ${nx} ${(y0 + y1) / 2} ${nx} ${y1}`;
        x = nx;
      }
      d += ` L ${x} ${s.y}`;
      y = s.y;
      if (Math.abs(base[li] - x) > 0.5) {
        const y0 = s.y + 12, y1 = s.y + 30;
        d += ` L ${x} ${y0} C ${x} ${(y0 + y1) / 2} ${base[li]} ${(y0 + y1) / 2} ${base[li]} ${y1}`;
        x = base[li];
        y = y1;
      }
    }
    d += ` L ${x} ${bottom}`;
    const p = document.createElementNS(svgNS, 'path');
    p.setAttribute('d', d);
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', STRANDS[k].color);
    p.setAttribute('stroke-width', '8');
    p.setAttribute('stroke-linecap', 'round');
    svg.append(p);
    return p;
  });
  // Stops on top of the lanes.
  const marks = stops.map((s) => {
    const g = document.createElementNS(svgNS, 'g');
    const it = s.r.item;
    if (it.on.length > 1) {
      const xs = it.on.map((k) => s.xs[chosen.indexOf(k)]);
      const x0 = Math.min(...xs) - 10, x1 = Math.max(...xs) + 10;
      g.innerHTML = `<rect x="${x0}" y="${s.y - 10}" width="${x1 - x0}" height="20" rx="10" fill="var(--stop)" stroke="var(--ink)" stroke-width="3"/>`;
    } else {
      const k = it.on[0];
      const x = s.xs[chosen.indexOf(k)];
      g.innerHTML = isLong(it)
        ? `<rect x="${x - 9}" y="${s.y - 20}" width="18" height="40" rx="9" fill="${STRANDS[k].fill}" stroke="${STRANDS[k].color}" stroke-width="3"/>`
        : `<circle cx="${x}" cy="${s.y}" r="8" fill="var(--stop)" stroke="var(--muted)" stroke-width="2.5"/>`;
    }
    svg.append(g);
    return { g, y: s.y };
  });
  if (!animate) return;
  const span = bottom - top;
  for (const p of paths) {
    const len = p.getTotalLength();
    p.style.strokeDasharray = `${len}`;
    anims.push(p.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: D, easing: 'linear', fill: 'both' }));
  }
  const at = (y) => Math.max(0, ((y - top) / span) * D);
  for (const m of marks) {
    anims.push(m.g.animate([{ opacity: 0, transform: 'scale(.4)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 260, delay: at(m.y), fill: 'both', easing: 'cubic-bezier(.3,1.6,.5,1)' }));
    m.g.style.transformBox = 'fill-box';
    m.g.style.transformOrigin = 'center';
  }
  const lineBox = $('line').getBoundingClientRect();
  for (const r of rows) {
    const b = r.node.getBoundingClientRect();
    const y = b.top - lineBox.top + b.height / 2;
    anims.push(r.node.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 320, delay: Math.max(0, at(y) - 60), fill: 'both', easing: 'ease-out' }));
  }
}

let resizeTimer = 0;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const svg = document.querySelector('svg.tracks');
    if (svg) draw(svg, ORDER.filter((k) => state.strands.has(k)), false);
  }, 120);
});

// ---------- departure-board card
let lastFocus = null;
function openCard(it) {
  lastFocus = document.activeElement;
  const k = it.on[0];
  const card = $('card');
  card.innerHTML = '';
  card.style.setProperty('--accent', STRANDS[k].color);
  card.style.setProperty('--car-fill', STRANDS[k].fill);
  const head = el('div', 'card__head');
  head.style.background = STRANDS[k].color;
  if (k === 'I') head.style.color = 'var(--i-ink)';
  const type = isLong(it) ? 'Program' : it.types[0] || 'Competition';
  const now = el('span', 'now', 'Runs');
  now.append(el('b', '', MONTHS[it.month]));
  const close = el('button', 'close', 'Close');
  close.type = 'button';
  if (k === 'I') close.style.color = 'var(--i-ink)';
  close.addEventListener('click', closeCard);
  const right = el('span', '');
  right.style.display = 'flex'; right.style.gap = '12px'; right.style.alignItems = 'center';
  right.append(now, close);
  head.append(el('span', '', type), right);

  const body = el('div', 'card__body');
  const title = el('div', 'card__title');
  const rds = el('span', 'rds');
  it.on.forEach((s) => rds.append(rd(s)));
  const tt = el('div', '');
  const h = el('h3', '', it.name);
  h.id = 'card-title';
  tt.append(h, el('p', '', `via ${it.on.map((s) => STRANDS[s].name).join(' + ')}`));
  title.append(rds, tt);

  const cars = el('div', 'cars');
  cars.append(el('span', 'cars__label', 'Year levels'));
  const carRow = el('div', 'cars__row');
  for (let y = 7; y <= 12; y += 1) {
    const c = el('span', `car${it.years.includes(y) ? ' is-in' : ''}${y === state.year ? ' is-you' : ''}`, String(y));
    c.title = y === state.year ? `Year ${y} (you)` : `Year ${y}${it.years.includes(y) ? '' : ' not eligible'}`;
    carRow.append(c);
  }
  cars.append(carRow);

  const split = el('div', 'split');
  const l = el('div', '');
  l.append(el('div', 'k', 'Entries'), el('div', 'v', it.window || 'See website'));
  const r = el('div', 'big');
  r.append(el('div', 'k', 'Cost'), el('div', 'v', it.basis === 'Free' ? 'Free' : (it.basis || 'TBC')));
  split.append(l, r);

  const tags = el('div', 'tags');
  [it.length, it.level, it.basis && it.basis !== 'Free' ? it.cost : null].filter(Boolean).forEach((t) => tags.append(el('span', 'tag', t)));

  const desc = el('p', 'desc', it.desc);
  const meta = el('p', 'meta', [it.organiser, it.location].filter(Boolean).join(' · '));
  meta.style.margin = '0';

  const idx = rows.findIndex((row) => row.item && row.item.id === it.id);
  const following = rows.slice(idx + 1).filter((row) => row.item).slice(0, 2);
  const next = el('div', 'next');
  if (following.length) {
    next.append(el('h4', '', 'Next on your line'));
    for (const f of following) {
      const b = el('button', '');
      b.type = 'button';
      const badge = el('span', 'badges');
      badge.style.margin = '0';
      f.item.on.forEach((s) => badge.append(rd(s, true)));
      const when = el('span', 'when');
      when.append(el('b', '', MONTHS[f.item.month]));
      b.append(badge, el('span', '', f.item.name), when);
      b.addEventListener('click', () => openCard(f.item));
      next.append(b);
    }
  }

  const foot = el('div', 'card__foot');
  if (it.link) {
    const a = el('a', 'btn btn--go', 'Register');
    a.href = it.link;
    a.target = '_blank';
    a.rel = 'noopener';
    foot.append(a);
  }
  body.append(title, cars, split, tags, desc, meta, next, foot);
  card.append(head, body);
  $('scrim').hidden = false;
  close.focus();
}
function closeCard() {
  $('scrim').hidden = true;
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
$('scrim').addEventListener('click', (e) => { if (e.target === $('scrim')) closeCard(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('scrim').hidden) closeCard(); });

document.fonts && document.fonts.ready ? document.fonts.ready.then(() => build(true)) : build(true);
</script>
