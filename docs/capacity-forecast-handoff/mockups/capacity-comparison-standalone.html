&lt;script&gt;
(()=&gt;{
const root=document.getElementById(&#x27;capacity-compare&#x27;);
const defaults={mood:&#x27;unknown&#x27;,energy:&#x27;unknown&#x27;,hours:&#x27;unknown&#x27;,diarySymptoms:&#x27;unknown&#x27;,focus:&#x27;unknown&#x27;,sleep:&#x27;missing&#x27;,missingDays:&#x27;2&#x27;,health:&#x27;improving&#x27;,work:&#x27;heavy&#x27;,exercise:&#x27;gentle&#x27;};
let state={...defaults};
const allowed={mood:[&#x27;unknown&#x27;,&#x27;low&#x27;,&#x27;okay&#x27;,&#x27;good&#x27;],energy:[&#x27;unknown&#x27;,&#x27;low&#x27;,&#x27;medium&#x27;,&#x27;high&#x27;],hours:[&#x27;unknown&#x27;,&#x27;5&#x27;,&#x27;6&#x27;,&#x27;7&#x27;],diarySymptoms:[&#x27;unknown&#x27;,&#x27;none&#x27;,&#x27;one&#x27;,&#x27;two&#x27;],focus:[&#x27;unknown&#x27;,&#x27;foggy&#x27;,&#x27;okay&#x27;,&#x27;clear&#x27;],sleep:[&#x27;missing&#x27;,&#x27;poor&#x27;,&#x27;fair&#x27;,&#x27;good&#x27;],missingDays:[&#x27;1&#x27;,&#x27;2&#x27;,&#x27;4&#x27;,&#x27;7&#x27;],health:[&#x27;ill&#x27;,&#x27;improving&#x27;,&#x27;resolved&#x27;],work:[&#x27;light&#x27;,&#x27;moderate&#x27;,&#x27;heavy&#x27;],exercise:[&#x27;gentle&#x27;,&#x27;hard&#x27;]};
function restore(s){const saved=s?.privateContent?.inputs;if(!saved)return;for(const key of Object.keys(defaults))if(allowed[key].includes(saved[key]))state[key]=saved[key];}
restore(window.openai?.widgetState);
const clamp=n=&gt;Math.round(Math.max(10,Math.min(95,n)));
const readiness=n=&gt;Math.round(Math.max(0,Math.min(100,n)));
function scores(){
 const logged=state.mood!==&#x27;unknown&#x27;||state.energy!==&#x27;unknown&#x27;||state.hours!==&#x27;unknown&#x27;||state.diarySymptoms!==&#x27;unknown&#x27;;
 const old=logged?clamp(80+(state.mood===&#x27;low&#x27;?-8:0)+({unknown:0,low:-15,medium:0,high:8}[state.energy])+(state.hours===&#x27;unknown&#x27;?0:-Math.min(30,(7-Number(state.hours))*8))+({unknown:0,none:0,one:-15,two:-25}[state.diarySymptoms])-8):clamp(80+(40-80)*Math.pow(.6,2));
 const days=Number(state.missingDays);
 // These are demonstration mappings, not fitted clinical coefficients.
 // History supplies unanswered dimensions; it never caps a fresh observation.
 const baseline=Math.round(.55*43+.30*49+.15*75);
 const energy=state.energy===&#x27;unknown&#x27;?baseline:{low:30,medium:70,high:100}[state.energy];
 const focus=state.focus===&#x27;unknown&#x27;?baseline:{foggy:30,okay:70,clear:100}[state.focus];
 const mood=state.mood===&#x27;unknown&#x27;?baseline:{low:30,okay:70,good:100}[state.mood];
 let sleep=state.sleep===&#x27;missing&#x27;?35:{poor:25,fair:70,good:100}[state.sleep];
 if(state.hours!==&#x27;unknown&#x27;){
   const duration={5:45,6:70,7:100}[state.hours];
   // One sleep dimension, not two separate penalties. Adequate duration
   // does not erase an explicit report of poor sleep quality.
   sleep=Math.min(sleep,duration);
 }
 let health={ill:30,improving:65,resolved:100}[state.health];
 if(state.diarySymptoms===&#x27;one&#x27;)health=Math.min(health,65);
 if(state.diarySymptoms===&#x27;two&#x27;)health=Math.min(health,35);
 // Recovery costs survive a fresh check-in. Good recovery attenuates them;
 // a cheerful mood or a clear-focus answer does not erase them.
 const base=.25*energy+.25*focus+.10*mood+.20*health+.20*sleep;
 const recoveryFactor=state.sleep===&#x27;missing&#x27;?.7:sleep&gt;=85?.4:sleep&gt;=60?.7:1;
 const workCost={light:0,moderate:3,heavy:8}[state.work]*recoveryFactor;
 const exerciseCost=(state.exercise===&#x27;hard&#x27;?5:0)*recoveryFactor;
 const interactionCost=state.sleep!==&#x27;missing&#x27;&amp;&amp;sleep&lt;60&amp;&amp;state.work===&#x27;heavy&#x27;?5:0;
 const next=readiness(base-workCost-exerciseCost-interactionCost);
 const unanswered=[state.mood,state.energy,state.focus].filter(v=&gt;v===&#x27;unknown&#x27;).length;
 const spread=6+unanswered+(state.sleep===&#x27;missing&#x27;?Math.min(12,days*2):0);
 return {old,next,logged,low:Math.max(0,next-spread),high:Math.min(100,next+spread),spread,days,base,workCost,exerciseCost,interactionCost};
}
function render(){
